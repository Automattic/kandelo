[package]
name = "fork-instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instruments wasm binaries with save/restore machinery for POSIX fork()"
publish = false

[[bin]]
name = "wasm-fork-instrument"
path = "src/main.rs"

[lib]
name = "fork_instrument"
path = "src/lib.rs"

[dependencies]
wasm-posix-program-abi = { path = "../program-abi" }

# anyhow — ergonomic error chaining for a CLI / build tool.
anyhow = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# clap — argument parsing. `derive` feature for #[derive(Parser)].
clap = { version = "4", features = ["derive"] }

# wasmparser — independent output validation and the bounded original-binary
# scanner. wasm-encoder re-encodes individual functions and index references;
# tempfile spools code/data sections until their encoded lengths are known.
wasmparser = "0.247"
wasm-encoder = { version = "0.247", features = ["wasmparser"] }
tempfile = "3"
# Read-only maps are created only from private, unlinked snapshots whose last
# writable handle is then closed. Never map a mutable user/optimizer file.
memmap2 = "0.9.10"
# Deep compiler-generated structured control grows only the current native
# walk's stack, on the same thread as its borrowed analysis environment.
stacker = "0.1.25"
# Keep common interpreter operand groups inline instead of allocating per op.
smallvec = "1"
# Private, disposable compiler-facts relations. Bundled SQLite keeps native
# builds independent of host libraries; page caches/work/disk are bounded.
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }

[dev-dependencies]
# Independent test inspection of emitted modules; no Walrus transform ships.
walrus = "0.26.4"
# Byte-level text inspection also preserves detached/unreachable operators.
wasmprinter = "0.247"

# wat — compiles WAT source into wasm bytes in-test. Keeps fixture
# sources readable as text alongside the assertions that consume them.
wat = "1"
