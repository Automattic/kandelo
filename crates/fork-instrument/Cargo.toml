[package]
name = "fork-instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instruments wasm binaries with save/restore machinery for POSIX fork()"
publish = false

[[bin]]
name = "wasm-fork-instrument"
path = "src/main.rs"

[lib]
name = "fork_instrument"
path = "src/lib.rs"

[features]
# Opt-in per-category byte attribution of generated code; see
# src/size_attribution.rs. Default builds emit identical modules.
size-attribution = []

[dependencies]
wasm-posix-shared = { path = "../shared" }

# walrus — typed wasm IR with validator. The primary workhorse for
# parsing, manipulating, and emitting instrumented modules.
# 0.26.4 pre-registers implicit multi-value legacy-catch block types. Earlier
# 0.26 releases panic while parsing valid `[tag params] -> [try results]`
# handlers, before the legacy-to-modern normalization pass can run.
walrus = "0.26.4"

# anyhow — ergonomic error chaining for a CLI / build tool.
anyhow = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# clap — argument parsing. `derive` feature for #[derive(Parser)].
clap = { version = "4", features = ["derive"] }

# wasmparser — independent output validation and the bounded original-binary
# scanner. wasm-encoder re-encodes individual functions and index references;
# tempfile spools code/data sections until their encoded lengths are known.
wasmparser = "0.247"
wasm-encoder = { version = "0.247", features = ["wasmparser"] }
tempfile = "3"
# Private, disposable compiler-facts relations. Bundled SQLite keeps native
# builds independent of host libraries; page caches/work/disk are bounded.
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }

[dev-dependencies]
# wasmprinter — byte-level wasm-to-WAT for assertions that walrus's IR
# can't see (notably post-Br "unreachable" code that walrus's parser
# strips on round-trip but is preserved in the actual wasm bytes).
wasmprinter = "0.247"

# wat — compiles WAT source into wasm bytes in-test. Keeps fixture
# sources readable as text alongside the assertions that consume them.
wat = "1"
