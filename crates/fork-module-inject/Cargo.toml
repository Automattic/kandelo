[package]
name = "fork-module-inject"
version.workspace = true
edition.workspace = true
license.workspace = true

# Host-only post-build tool for the fork-module (Phase 6 D6.1). Rust has no
# native `funcref` type and cannot emit a function that returns `(ref func)` from
# a `table.get`, so the fork-module's `__wpk_fork_ref_decode_funcref` export —
# whose whole job is to hand the guest a real funcref reconstructed from the
# imported function catalog table — cannot be written in Rust. This tool injects
# that ONE small wasm function into the compiled fork-module, wiring it to the
# module's Rust `fm_funcref_ordinal` helper (which does the recipe->ordinal
# lookup) and to a newly imported `env.__wpk_fork_function_catalog` funcref
# table. See `crates/fork-module/build-wasm.sh`.
[[bin]]
name = "fork-module-inject"
path = "src/main.rs"

[dependencies]
# The same typed-wasm-IR crate the fork-instrument transforms use; it preserves
# the fork-module's `dylink.0` PIC custom section across the round trip.
walrus = "0.26.4"
anyhow = "1"
# Validate the emitted bytes before writing them. Without this the tool can
# stage a module that only fails when something tries to instantiate it -- which
# it did: a `finish(vec![slot, recipe])` that passed a non-parameter local as a
# parameter produced "invalid local index: 1", and the artifact was written and
# staged before any harness got a chance to notice.
wasmparser = "0.247"
# The drive-table geometry, so it cannot drift. It HAD drifted: this tool strode
# the drive table by 13 while `fork_codec` and the host used 14, and for every
# activation above 0 that aimed a `call_indirect` at the wrong guest export.
# The old comment said the injector "cannot link fork-codec" and pinned the
# duplicate with a test that does not exist. It can link it; this is the fix
# that makes the class of bug impossible rather than merely detected.
fork-codec = { path = "../fork-codec" }
