[package]
name = "runtime-core"
version.workspace = true
edition.workspace = true

[lib]
name = "runtime_core"
crate-type = ["rlib"]

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
spin = { version = "=0.12.2", default-features = false, features = ["mutex", "spin_mutex"] }
wasm-posix-shared = { path = "../shared" }

# The one hash this crate computes: the integrity digest a deferred record
# declares, checked against the bytes that arrive for it. `default-features =
# false` because this crate is no_std + alloc on wasm, exactly as
# `crates/kandelo-image-module` takes it.
sha2 = { version = "0.10", default-features = false }

# The single reader of a WebAssembly artifact. A VFS image's publication policy
# (`image_policy`) asks it whether each Wasm program the image carries matches
# the kernel ABI, so image builds and the kernel judge artifacts with one
# reader rather than a second hand-rolled one.
wasm-artifact = { path = "../wasm-artifact" }
