[package]
name = "host-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native reference host: loads the real kernel.wasm in Wasmtime and runs the channel handshake"
publish = false

# HOST-ONLY crate. Wasmtime (and its Cranelift backend) does not build for
# `wasm32-unknown-unknown`, so this crate — like `tools/xtask` — must always
# be built and tested for the host target, never the workspace-default wasm
# target from `.cargo/config.toml`:
#
#     cargo build -p host-native --target aarch64-apple-darwin
#     cargo test  -p host-native --target aarch64-apple-darwin
#
# It is a workspace member so the closed-by-default
# `cargo test --workspace --exclude xtask --target <host>` suite picks it up
# automatically. The wasm kernel build (`cargo build --release -p kandelo
# -Z build-std=core,alloc`) targets `-p kandelo` specifically and never
# compiles this crate, so Wasmtime is only resolved (into Cargo.lock), never
# built, on the wasm path.

[lib]
name = "host_native"
path = "src/lib.rs"

[dependencies]
# Wasmtime 35 matches the feasibility spike in
# docs/plans/2026-08-25-rust-first-runtime-design.md. It supports every
# feature the kernel needs (threads/shared-memory + atomic wait/notify,
# bulk-memory, mutable-globals, imported/exported memory) with no WASI or
# Component Model. Loading the same `kernel.wasm` on a non-JS engine is the
# freeze-gate acid test that the platform boundary is not JavaScript-shaped.
wasmtime = "35"

[dev-dependencies]
# `wat` compiles the tiny WAT wait/notify probe module in-test, keeping the
# fixture readable alongside the assertions that consume it.
wat = "1"
