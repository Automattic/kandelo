[package]
name = "sffs-module"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone wasm entry point for building VFS images from a host builder"

[lib]
name = "sffs_module"
crate-type = ["cdylib", "rlib"]

[dependencies]
runtime-core = { path = "../runtime-core" }
wasm-posix-shared = { path = "../shared" }
# `default-features = false` for no_std, exactly as `crates/fork-codec` takes
# it: this module is a no_std + alloc unit and must stay one.
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2.14", default-features = false }
