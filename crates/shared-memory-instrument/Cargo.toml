[package]
name = "shared-memory-instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wasm-shared-memory-instrument"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
wasmparser = "0.247"
wasm-encoder = { version = "0.247", features = ["wasmparser"] }
wasm-artifact = { path = "../wasm-artifact" }
wasm-posix-program-abi = { path = "../program-abi" }

[dev-dependencies]
wat = "1"
