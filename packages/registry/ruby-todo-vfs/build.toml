script_path = "images/vfs/scripts/build-ruby-todo-vfs-image.sh"
inputs = [
  # The script itself is listed literally (the closure contract requires the
  # exact script_path entry) …
  "images/vfs/scripts/build-ruby-todo-vfs-image.sh",
  # … and the builder imports shared helpers across the script directory.
  # Track the tree rather than a per-file list that rots each time a builder
  # gains an import.
  "images/vfs/scripts",
  "images/vfs/lib/init/shell-binaries.ts",
  "images/vfs/ruby-todo-app",
  "images/rootfs/etc/services",
  "packages/registry/ruby/ruby-todo-demo.json",
  "host/src",
  "web-libs/kandelo-session/src/demo-config.ts",
  "web-libs/kandelo-session/src/experimental-terminal-session.ts",
  "web-libs/kandelo-session/src/vfs-capacity.ts",
  "images/vfs/lib/kandelo-image-fs.ts",
  # The image writer these builders drive (images/vfs/lib/kandelo-image-fs.ts
  # loads local-binaries/kandelo_image_module32.wasm): its cargo closure and
  # recipe, so a writer change invalidates the images it wrote.
  "cargo:kandelo-image-module",
  "cargo:runtime-core",
  "crates/kandelo-image-module/build-wasm.sh",
]
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "UNPUBLISHED"
revision    = 8
