  "images/rootfs/etc/services",
  "images/vfs/scripts/kandelo-demo-config.ts",
  "images/vfs/scripts/kandelo-demo-guides.ts",
  "images/vfs/scripts/mariadb-image-helpers.ts",
  "images/vfs/scripts/opcache-prewarm.ts",
  "images/vfs/scripts/package-shell-vfs-build.ts",
  "images/vfs/scripts/shell-lazy-archives.ts",
  "images/vfs/scripts/source-rootfs-shell-overlay.ts",
  "images/vfs/scripts/smtp-capture-helpers.ts",
  "images/vfs/scripts/source-extract-helper.ts",
  "images/vfs/scripts/vfs-image-helpers.ts",
  "images/vfs/lib/init/shell-binaries.ts",
  "images/vfs/scripts/wordpress-preinstall.ts",
  "images/vfs/scripts/wordpress-source-layout.ts",
  "apps/browser-demos/lib/init/mysql-benchmark.ts",
  "apps/browser-demos/lib/init/wordpress-runtime-config.ts",
  "host/src",
  "web-libs/kandelo-session/src/demo-config.ts",
  "web-libs/kandelo-session/src/demo-guides.ts",
  "web-libs/kandelo-session/src/experimental-terminal-session.ts",
  "web-libs/kandelo-session/src/vfs-capacity.ts",
  "images/vfs/lib/kandelo-image-fs.ts",
  "images/vfs/scripts/shell-runtime-layout.ts",
  # The image writer these builders drive (images/vfs/lib/kandelo-image-fs.ts
  # loads local-binaries/kandelo_image_module32.wasm): its cargo closure and
  # recipe, so a writer change invalidates the images it wrote.
  "cargo:kandelo-image-module",
  "cargo:runtime-core",
  "crates/kandelo-image-module/build-wasm.sh",
  # The artifact reader every program write and launch goes through
  # (wasm_artifact_module32.wasm).
  "cargo:wasm-artifact-module",
  "cargo:wasm-artifact",
  "crates/wasm-artifact-module/build-wasm.sh",
  # The build boots a kernel host whose process workers load the fork module
  # (fork_module32.wasm) ...
  "cargo:fork-module",
  "cargo:fork-module-inject",
  "crates/fork-module/build-wasm.sh",
  # ... and the dynamic-linking planner (dylink_module32.wasm) for dlopen.
  "cargo:dylink-module",
  "cargo:dylink",
  "crates/dylink-module/build-wasm.sh",
]
