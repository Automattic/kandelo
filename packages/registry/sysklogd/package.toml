kind = "program"
name = "sysklogd"
version = "2.8.0"
# sysklogd (Joachim Wiberg, originally Eric Allman's BSD syslogd): the
# canonical Unix system logging daemon. Kandelo runs it as the reader of
# /dev/log and the writer of /var/log, so the syslog facility is a real
# daemon rather than kernel-side special casing of a log path.
#
# It reads the kernel log from /dev/kmsg natively, which is the surface
# Kandelo provides, and it binds /dev/log to receive AF_UNIX datagrams from
# any process using musl's syslog(3).
#
# Built --without-logger on purpose. sysklogd's `logger` links its own
# libsyslog, which supplies a competing syslog(); Kandelo's syslog(3) is
# musl's, and the point of this facility is that unmodified programs linking
# musl work, so a logger built against another implementation would prove
# nothing about the platform path. The `logger` command comes from toybox
# instead, whose applet calls the system syslog(3).
#
# libsyslog itself is built either way -- it is not gated on the logger -- but
# nothing of it reaches the sysroot: this package installs only src/syslogd
# and never runs `make install`. Upstream would have put its header in
# include/syslog/syslog.h, a subdirectory, so it could not have shadowed
# musl's <syslog.h> in any case.
kernel_abi = 55
depends_on = []

[source]
url = "https://github.com/troglobit/sysklogd/releases/download/v2.8.0/sysklogd-2.8.0.tar.gz"
sha256 = "67f49c6b2e9d75ce15202db815112719f4af0db8901032f0c3a0cec1b9f65551"
provider = "archive"

[license]
spdx = "BSD-3-Clause"
url = "https://github.com/troglobit/sysklogd/blob/master/LICENSE"

[build]
script_path = "packages/registry/sysklogd/build-sysklogd.sh"

# syslogd daemonizes, so it needs fork continuation instrumentation.
[[outputs]]
name = "syslogd"
wasm = "syslogd.wasm"
fork_instrumentation = "auto"
