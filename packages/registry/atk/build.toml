script_path = "packages/registry/atk/build-atk.sh"
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "cf81d0f7c"
revision    = 1

# The fetched `atk-src/` tree is gitignored; the resolver hashes these
# tracked inputs on a clean checkout.
inputs = [
  "packages/registry/atk/build-atk.sh",
  "packages/registry/atk/src/wasm-callback-arity.patch",
]

[binary]
index_url = "https://github.com/Automattic/kandelo/releases/download/binaries-abi-v{abi}/index.toml"
