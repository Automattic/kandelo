kind = "program"

# Omarchy 4's scripts, menu, themes and theme templates, adapted to a sway
# session. Omarchy runs its menu, lock, background and notifications in one
# QuickShell process; Kandelo ships sway, so the patches answer that
# process's IPC with fuzzel, swaylock, swaybg and mako, and change each
# hyprctl and uwsm call to swaymsg.
#
# `allowlist` names the files the archive ships: the scripts the menu, the
# lock, the logout, the theme switch, the key bindings and the notifications
# reach, Omarchy's Lua binding declarations, and each theme's colors.
# Each theme's backgrounds, PNG and JPG, are runtime files at
# /usr/share/backgrounds/omarchy/<theme>/, one lazy file each in the shell
# image, and the archive's themes/<theme>/backgrounds/ entries are absolute
# links to them: omarchy-theme-set copies the theme directory with cp -r,
# which copies the links, so a machine downloads only the backgrounds swaybg
# and swaylock draw. Each theme gets a preview linked to its first
# background, the image omarchy-theme-switcher falls back to, so the first
# theme menu opens with one find per theme instead of up to seven.
# Upstream's own previews stay out: omarchy-theme-set copies the theme
# directory at first boot, which would fetch their 8.8 MB with the archive.
# omarchy-notification-send calls busctl, which the image provides as basu's
# basuctl.
# Each patch under `patches/` states the boundary it adapts to.
#
# The archive mounts at /usr/share/omarchy, Omarchy's OMARCHY_PATH.
name = "omarchy"
version = "4.0.6"
kernel_abi = 55
arches = ["wasm32"]
depends_on = []

[[host_tools]]
name = "zip"
version_constraint = ">=3.0"
probe = { args = ["-v"], version_regex = "Zip (\\d+\\.\\d+)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[source]
url = "https://github.com/basecamp/omarchy/archive/refs/tags/v4.0.6.tar.gz"
sha256 = "e399386c4eb1744a0d712fe03ba71bbb29530188ee116cfcc475930c996441a8"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/basecamp/omarchy/blob/v4.0.6/LICENSE"

[build]
script_path = "packages/registry/omarchy/build-omarchy.sh"

[[outputs]]
name = "omarchy"
wasm = "omarchy.zip"
fork_instrumentation = "disabled"

