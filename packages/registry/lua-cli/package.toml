kind = "program"

# The `lua` command-line interpreter: upstream's lua.c linked against the lua
# library package's liblua.a, so scripts run with the same engine programs
# embed. The source archive is staged only for lua.c.
name = "lua-cli"
version = "5.2.4"
kernel_abi = 55
arches = ["wasm32"]
depends_on = ["lua@5.2.4"]

[source]
provider = "archive"
url = "https://www.lua.org/ftp/lua-5.2.4.tar.gz"
sha256 = "b9e2e4aad6789b3b63a056d442f7b39f0ecfca3ae0f1fc0ae4e9614401b69f4b"

[license]
spdx = "MIT"
url = "https://www.lua.org/license.html"

[build]
script_path = "packages/registry/lua-cli/build-lua-cli.sh"

[[outputs]]
name = "lua"
wasm = "lua.wasm"
