kind = "program"
name = "coreutils-docs"
version = "9.6"
kernel_abi = 7
depends_on = ["coreutils@9.6"]

# The man pages are DERIVED from coreutils two faithful ways: the page BODY
# (SYNOPSIS/DESCRIPTION/OPTIONS) is the real coreutils.wasm binary's
# --help/--version output, captured by booting a Kandelo kernel and running
# each tool inside it; and the NAME/SEE-ALSO lines come from coreutils' own
# man/*.x include files (the same ones GNU's man pages use). help2man only
# reformats — it never fabricates content. So the package source is the
# sha-pinned coreutils tarball (staged by the resolver), which the recipe
# reads man/*.x from; depends_on = coreutils@9.6 provides the binary.
[source]
url = "https://ftpmirror.gnu.org/coreutils/coreutils-9.6.tar.xz"
sha256 = "7a0124327b398fd9eb1a6abde583389821422c744ffa10734b24f557610d3283"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/coreutils.git/tree/COPYING?h=v9.6"

[build]
script_path = "packages/registry/coreutils-docs/build-coreutils-docs.sh"

[[outputs]]
name = "coreutils-docs"
wasm = "coreutils-docs.zip"
fork_instrumentation = "disabled"
