  "host/src",
  "images/vfs/lib/kandelo-image-fs.ts",
  # The image writer that boot path reaches (images/vfs/lib/kandelo-image-fs.ts
  # loads local-binaries/kandelo_image_module32.wasm): its cargo closure and
  # recipe.
  "cargo:kandelo-image-module",
  "cargo:runtime-core",
  "crates/kandelo-image-module/build-wasm.sh",
]
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "UNPUBLISHED"
revision    = 2
