script_path = "packages/registry/coreutils-docs/build-coreutils-docs.sh"
inputs = [
  "packages/registry/coreutils-docs/build-coreutils-docs.sh",
  "images/vfs/scripts/capture-help-output.ts",
  "images/vfs/scripts/create-deterministic-zip.sh",
  "scripts/install-package-man-pages.sh",
  "scripts/package-build-roots.sh",
  # The capture boots a NodeKernelHost, so the host runtime it reaches
  # (including vfs-image-transport.ts, which capture-help-output.ts imports
