# Per-library manifest for libxkbcommon. See docs/package-management.md.
#
# Ports libxkbcommon (libxkbcommon.a) to wasm32-posix-kernel: keymap
# compilation (xkb_keymap_new_from_string, TEXT_V1) and keyboard state
# translation (keycode + modifiers -> keysym -> UTF-8). The Wayland
# compositor (PR6) generates a keymap and hands it to clients over the
# wl_keyboard keymap fd; both sides link this library to interpret it.
# See docs/plans/2026-07-08-dri-wayland-compositor-plan.md §5 (PR4).
#
# The port builds through upstream's meson build with the SDK cross file
# (sdk/meson/wasm32posix.ini). Only libxkbcommon itself is built:
# libxkbcommon-x11 has no xcb here, and libxkbregistry ships as its own
# package (packages/registry/libxkbregistry).

kind = "library"

name = "libxkbcommon"
version = "1.13.2"
kernel_abi = 16

[[host_tools]]
name = "meson"
version_constraint = ">=1.4.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

[[host_tools]]
# meson runs bison to generate src/xkbcomp/parser.c from parser.y (the
# source archive ships the keyword table and keysym tables, but not the
# yacc parser). Provided via flake.nix (pkgs.bison).
name = "bison"
version_constraint = ">=3.6"
probe = { args = ["--version"], version_regex = "bison \\(GNU Bison\\) (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.bison); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.bison); or apt install bison" }

[source]
# xkbcommon.org stopped publishing dist tarballs after 1.7.0; releases
# since then are GitHub tag archives.
url = "https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.13.2.tar.gz"
sha256 = "acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/xkbcommon/libxkbcommon/blob/xkbcommon-1.13.2/LICENSE"

[build]
script_path = "packages/registry/libxkbcommon/build-libxkbcommon.sh"

[outputs]
libs = ["lib/libxkbcommon.a"]
headers = [
  "include/xkbcommon/xkbcommon.h",
  "include/xkbcommon/xkbcommon-names.h",
  "include/xkbcommon/xkbcommon-keysyms.h",
  "include/xkbcommon/xkbcommon-compat.h",
  "include/xkbcommon/xkbcommon-compose.h",
]
pkgconfig = ["lib/pkgconfig/xkbcommon.pc"]
