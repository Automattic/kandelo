# Per-library manifest for mtdev. See docs/package-management.md.
#
# mtdev (libmtdev.a) translates the legacy multitouch protocol A
# (anonymous contacts) into protocol B (slotted contacts). libinput's
# evdev backend links it and routes a protocol-A device through it.
# Built through upstream's autotools build with the SDK configure wrapper.

kind = "library"

name = "mtdev"
version = "1.1.7"
kernel_abi = 47
depends_on = []

[source]
url = "https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2"
sha256 = "a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e"
provider = "archive"

[license]
spdx = "MIT"
url = "https://bitmath.org/code/mtdev/"

[build]
script_path = "packages/registry/mtdev/build-mtdev.sh"

[outputs]
libs = ["lib/libmtdev.a"]
headers = ["include/mtdev.h", "include/mtdev-plumbing.h", "include/mtdev-mapping.h"]
pkgconfig = ["lib/pkgconfig/mtdev.pc"]
