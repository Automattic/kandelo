kind = "program"
name = "m4"
version = "1.4.19"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/m4/m4-1.4.19.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/m4/m4-1.4.19.tar.xz"]
sha256 = "63aede5c6d33b6d9b13511cd0be2cac046f2e70fd0a07aa9573a04a82783af96"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/m4.git/tree/COPYING"

[build]
script_path = "packages/registry/m4/build-m4.sh"

[[outputs]]
name = "m4"
wasm = "m4.wasm"
