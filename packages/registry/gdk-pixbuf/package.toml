# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# Image loading (libgdk_pixbuf-2.0.a). Ported for GTK3 (plan
# docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4,
# PR24). 2.36.12 is the last autotools release (2.38 moved to meson).
# Scope: png loader only, compiled in statically
# (--with-included-loaders=png --disable-modules); no jpeg/tiff, no
# dynamic loader modules.
name = "gdk-pixbuf"
version = "2.36.12"
kernel_abi = 17
depends_on = [
  "glib@2.84.4",
  "libpng@1.6.43",
  "libffi@0.1.0",
  "zlib@1.3.1",
]

[source]
url = "https://download.gnome.org/sources/gdk-pixbuf/2.36/gdk-pixbuf-2.36.12.tar.xz"
sha256 = "fff85cf48223ab60e3c3c8318e2087131b590fd6f1737e42cb3759a3b427a334"

[license]
spdx = "LGPL-2.1-or-later"
url = "https://gitlab.gnome.org/GNOME/gdk-pixbuf/-/blob/2.36.12/COPYING"

[build]
script_path = "packages/registry/gdk-pixbuf/build-gdk-pixbuf.sh"

[outputs]
libs = ["lib/libgdk_pixbuf-2.0.a"]
headers = ["include/gdk-pixbuf-2.0"]
pkgconfig = ["lib/pkgconfig/gdk-pixbuf-2.0.pc"]
