kind = "program"
name = "nethack-docs"
version = "3.6.7"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `nethack` package (nethack).
# The source, SHA-256 and version are the `nethack` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://www.nethack.org/download/3.6.7/nethack-367-src.tgz"
sha256 = "98cf67df6debf9668a61745aa84c09bcab362e5d33f5b944ec5155d44d2aacb2"
provider = "archive"

[license]
spdx = "NGPL"
url = "https://nethack.org/common/license.html"

[build]
script_path = "packages/registry/nethack-docs/build-nethack-docs.sh"

[[outputs]]
name = "nethack-docs"
wasm = "nethack-docs.zip"
fork_instrumentation = "disabled"
