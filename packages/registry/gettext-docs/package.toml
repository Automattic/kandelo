kind = "program"
name = "gettext-docs"
version = "1.0"
kernel_abi = 56
depends_on = []

# Upstream manual pages for the `gettext` package's commands.
# The source, SHA-256 and version are the `gettext` package's own, so the
# pages describe the release that built the installed programs;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://ftpmirror.gnu.org/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"
provider = "archive"


[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/gettext.git/tree/COPYING?h=v1.0"

[build]
toolchain = "none"
script_path = "packages/registry/gettext-docs/build-gettext-docs.sh"

[[outputs]]
name = "gettext-docs"
wasm = "gettext-docs.zip"
fork_instrumentation = "disabled"
