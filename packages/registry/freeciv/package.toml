kind = "program"
name = "freeciv"
version = "3.2.6"
kernel_abi = 50
arches = ["wasm32"]
depends_on = [
  "sdl2@2.32.10",
  "sdl2-image@2.8.12",
  "sdl2-ttf@2.24.0",
  "sdl2-mixer@2.8.2",
  "libwayland@1.24.0",
  "libxkbcommon@1.13.2",
  "libffi@0.1.0",
  "libpng@1.6.43",
  "freetype@2.13.3",
  "zlib@1.3.1",
  "libcurl@8.11.1",
  "openssl@3.3.2",
  "icu@74.2",
  "libcxx@21.1.7",
  "sqlite@3.49.1",
  "readline@8.2",
  "ncurses@6.5",
]

[source]
provider = "archive"
url = "https://files.freeciv.org/stable/freeciv-3.2.6.tar.xz"
sha256 = "b3ce15f54083b1fca146f62837a5f7d41d298537fa34940cca70eeb09c7a9c6e"

[license]
# The server links GPLv3 readline; the aggregate binary is GPLv3-or-later.
spdx = "GPL-3.0-or-later"
url = "https://github.com/freeciv/freeciv/blob/R3_2_6/COPYING"

[build]
script_path = "packages/registry/freeciv/build-freeciv.sh"

[[host_tools]]
name = "meson"
version_constraint = ">=1.3"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "clang"
version_constraint = ">=21.0"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "zip"
version_constraint = ">=3.0"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "patch"
version_constraint = ">=2.7"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[outputs]]
name = "freeciv-sdl2"
wasm = "freeciv-sdl2.wasm"

[[outputs]]
name = "freeciv-server"
wasm = "freeciv-server.wasm"

[[runtime_files]]
artifact = "freeciv-data.zip"
guest_path = "/usr/share/freeciv-data.zip"
