kind = "program"
name = "sed"
version = "4.9"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/sed/sed-4.9.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz"]
sha256 = "6e226b732e1cd739464ad6862bd1a1aba42d7982922da7a53519631d24975181"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/sed.git/tree/COPYING?h=v4.9"

[build]
script_path = "packages/registry/sed/build-sed.sh"

[[outputs]]
name = "sed"
wasm = "sed.wasm"
