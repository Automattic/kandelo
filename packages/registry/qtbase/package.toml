# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.
#
# Qt 6 QtCore, QtGui, QtWidgets, QtWaylandClient, QtConcurrent and QtXml, static,
# for wasm32. The base of the Qt stack Omarchy v4 needs: v4 folds Waybar,
# Walker, Mako, SwayOSD, hyprlock, hypridle, swaybg and polkit-gnome into
# a single Quickshell QML process, and Quickshell is a QtQuick client.
#
# Qt 6.10 moved the Wayland client platform plugin into qtbase, so the
# `wayland` QPA plugin and the xdg-shell integration ship from here
# rather than from a separate qtwayland package.
#
# QtWidgets is on — Quickshell's QuickControls2 style impls need it.
# QtNetwork is on without ssl — Quickshell's IPC rides QLocalSocket.
# QtSql, QtTest and QtDBus are off, and so is
# OpenGL — the Wayland client runs on wl_shm; QtQuick renders through
# its software scenegraph, so no GL surface is required. QProcess is on:
# forkfd-generic-on-wasm.patch keeps Qt's bundled forkfd on its generic
# fork() fallback, which routes through the glue's kernel_fork. See
# build-qtbase.sh.
#
# PCRE2 stays bundled. QRegularExpression needs the 16-bit build
# (PCRE2_CODE_UNIT_WIDTH=16) and the registry's pcre2 package ships only
# libpcre2-8.a. zlib is taken from the registry.
kind = "library"

name = "qtbase"
version = "6.10.2"
kernel_abi = 44
depends_on = [
  "libcxx@21.1.7",
  "zlib@1.3.1",
  "freetype@2.13.3",
  "fontconfig@2.15.0",
  "harfbuzz@10.1.0",
  "libpng@1.6.43",
  "libxkbcommon@1.7.0",
  "libwayland@1.24.0",
]

[source]
url = "https://download.qt.io/archive/qt/6.10/6.10.2/submodules/qtbase-everywhere-src-6.10.2.tar.xz"
sha256 = "aeb78d29291a2b5fd53cb55950f8f5065b4978c25fb1d77f627d695ab9adf21e"
provider = "archive"

[license]
spdx = "LGPL-3.0-only"
url = "https://code.qt.io/cgit/qt/qtbase.git/tree/LICENSES/LGPL-3.0-only.txt?h=v6.10.2"

[build]
script_path = "packages/registry/qtbase/build-qtbase.sh"

# Qt's cross-build runs moc, rcc and uic on the build machine and reads
# them from QT_HOST_PATH/libexec, so they are not on PATH. qmake is, and
# its version identifies the host Qt those generators belong to.
#
# CMake needs an exact host/target version match, but the resolver only
# understands `>=` (deps-management-v2 decision 11). The floor is
# declared here and build-qtbase.sh rejects any inequality outright.
[[host_tools]]
name = "qmake"
version_constraint = ">=6.10.2"
probe = { args = ["-query", "QT_VERSION"], version_regex = "(\\d+\\.\\d+\\.\\d+)" }
install_hints = { darwin = "provided by flake.nix (pkgs.qt6.qtbase); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.qt6.qtbase); enter scripts/dev-shell.sh" }

[outputs]
libs = [
  "lib/libQt6Core.a",
  "lib/libQt6Gui.a",
  "lib/libQt6Widgets.a",
  "lib/libQt6Network.a",
  "lib/libQt6WaylandClient.a",
  "lib/libQt6Concurrent.a",
  "lib/libQt6Xml.a",
  "lib/libQt6BundledPcre2.a",
]
headers = [
  "include/QtCore",
  "include/QtGui",
  "include/QtWidgets",
  "include/QtNetwork",
  "include/QtWaylandClient",
  "include/QtConcurrent",
  "include/QtXml",
]
