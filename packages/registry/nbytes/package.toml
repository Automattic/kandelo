kind = "library"
name = "nbytes"
version = "0.1.4"
kernel_abi = 56
arches = ["wasm32"]
depends_on = ["libcxx@21.1.7"]

[source]
# Keep the complete native dependency bundled with the audited Node target.
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz"
sha256 = "986ead18ef18256831bae3e57d94aef680a7b84cfd4044f3e8471f833fbd7191"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/nodejs/node/blob/18b32a3b1552e199a01f1a8d9fd64aa756d3b75b/deps/nbytes/LICENSE"

[build]
script_path = "packages/registry/nbytes/build-nbytes.sh"

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "cmake"
version_constraint = ">=3.28"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libnbytes.a"]
headers = ["include/nbytes.h"]
pkgconfig = ["lib/pkgconfig/nbytes.pc"]
files = ["share/doc/nbytes/LICENSE"]
