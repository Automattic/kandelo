kind = "library"

# libjpeg-turbo (libjpeg.a), the JPEG codec Linux distributions ship as
# libjpeg. gdk-pixbuf's JPEG loader links it, so swaybg and swaylock draw
# JPEG backgrounds. Built unmodified through upstream's cmake build with the
# SDK toolchain file: the libjpeg API at its default 6.2 ABI, static library
# only, without SIMD (no WebAssembly SIMD code upstream), the TurboJPEG API,
# tools, tests or docs. pkg-config name `libjpeg`.
name = "libjpeg-turbo"
version = "3.1.3"
kernel_abi = 56
depends_on = []

[source]
url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.3/libjpeg-turbo-3.1.3.tar.gz"
sha256 = "075920b826834ac4ddf97661cc73491047855859affd671d52079c6867c1c6c0"
provider = "archive"

[license]
spdx = "IJG AND BSD-3-Clause AND Zlib"
url = "https://github.com/libjpeg-turbo/libjpeg-turbo/blob/3.1.3/LICENSE.md"

[build]
script_path = "packages/registry/libjpeg-turbo/build-libjpeg-turbo.sh"

[[host_tools]]
name = "cmake"
version_constraint = ">=3.20"
probe = { args = ["--version"], version_regex = "cmake version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libjpeg.a"]
headers = ["include/jpeglib.h", "include/jconfig.h", "include/jmorecfg.h", "include/jerror.h"]
pkgconfig = ["lib/pkgconfig/libjpeg.pc"]
