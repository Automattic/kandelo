kind = "program"
name = "autoconf-docs"
version = "2.73"
kernel_abi = 56
depends_on = []

# Upstream manual pages for the `autoconf` package.
# The source, SHA-256 and version are the `autoconf` package's own, so the
# pages describe the release that built the installed program;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://ftpmirror.gnu.org/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
provider = "archive"


[license]
spdx = "GPL-3.0-or-later WITH Autoconf-exception-generic-3.0"
url = "https://git.savannah.gnu.org/cgit/autoconf.git/tree/COPYINGv3?h=v2.73"

[build]
toolchain = "none"
script_path = "packages/registry/autoconf-docs/build-autoconf-docs.sh"

[[outputs]]
name = "autoconf-docs"
wasm = "autoconf-docs.zip"
fork_instrumentation = "disabled"
