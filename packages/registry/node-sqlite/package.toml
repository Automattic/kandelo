# Exact SQLite backend bundled by the Node core API/reference target.
kind = "library"
name = "node-sqlite"
version = "26.13.0"
kernel_abi = 55
depends_on = []
arches = ["wasm32", "wasm64"]

[source]
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz"
sha256 = "986ead18ef18256831bae3e57d94aef680a7b84cfd4044f3e8471f833fbd7191"
provider = "archive"

[license]
spdx = "blessing"
url = "https://www.sqlite.org/copyright.html"

[build]
script_path = "packages/registry/node-sqlite/build-node-sqlite.sh"

[outputs]
libs = ["lib/libsqlite3.a"]
headers = ["include/sqlite3.h", "include/sqlite3ext.h"]
files = ["share/node-sqlite/provenance.json", "share/licenses/node-sqlite/Node-LICENSE", "share/licenses/node-sqlite/SQLite-public-domain.txt"]

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
