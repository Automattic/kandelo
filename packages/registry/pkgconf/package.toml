kind = "program"
name = "pkgconf"
version = "3.0.10"
kernel_abi = 56
depends_on = []

# pkgconf, installed as pkgconf and pkg-config. It searches /usr/local, /usr
# and the guest SDK's sysroot, where the guest's cc finds libraries. The SDK's
# wasm32posix-pkg-config runs the pkg-config on PATH, so inside Kandelo it
# needs this package too. pkgconf-data.zip carries pkg.m4, the
# PKG_CHECK_MODULES macros autoreconf needs.
[source]
url = "https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.10.tar.xz"
sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de"
provider = "archive"

[license]
spdx = "ISC"
url = "https://github.com/pkgconf/pkgconf/blob/pkgconf-3.0.10/COPYING"

[build]
script_path = "packages/registry/pkgconf/build-pkgconf.sh"

[[outputs]]
name = "pkgconf"
wasm = "pkgconf.wasm"

[[outputs]]
name = "pkgconf-data"
wasm = "pkgconf-data.zip"
fork_instrumentation = "disabled"
