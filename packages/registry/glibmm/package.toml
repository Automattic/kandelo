[build]
script_path = "packages/registry/glibmm/build-glibmm.sh"

[outputs]
libs = ["lib/libglibmm-2.4.a", "lib/libgiomm-2.4.a"]
headers = ["include/glibmm-2.4", "include/giomm-2.4"]
