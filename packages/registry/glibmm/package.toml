kind = "library"
name = "glibmm"
version = "2.62.0"
kernel_abi = 17
depends_on = [
  "glib@2.84.4",
  "libsigcxx@2.10.3",
  "libcxx@21.1.7",
]

[source]
url = "https://download.gnome.org/sources/glibmm/2.62/glibmm-2.62.0.tar.xz"
sha256 = "36659f13cc73282392d1305858f3bbca46fbd1ce2f078cc9db8b9f79b2e93cfe"

[license]
spdx = "LGPL-2.1-or-later"
