# Per-program manifest for Waybar. See docs/package-management.md.
#
# Ports Waybar 0.14.0 unmodified — the O2 gate's status bar
# (docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4
# PR24). GTK3 + gtkmm layer-shell bar; its hyprland modules speak
# Hyprland IPC against wlcompositor's socket pair under
# /tmp/hypr/wlcompositor/. Optional-dep modules (network, pulseaudio,
# tray, udev/evdev, mpd, upower, pipewire, …) and the is_linux ones
# (battery, cpu, memory, systemd units) are not compiled — the same set
# meson reaches without those deps on a non-Linux host, and nothing
# this kernel's /proc and /sys could feed. The clock is
# simpleclock.cpp: no chrono-timezone database exists on this libc++.
kind = "program"
name = "waybar"
version = "0.14.0"
kernel_abi = 17
depends_on = [
  "gtkmm3@3.24.2",
  "gtk-layer-shell@0.9.2",
  "glibmm@2.62.0",
  "cairomm@1.12.2",
  "pangomm@2.42.0",
  "atkmm@2.28.0",
  "libsigcxx@2.10.3",
  "jsoncpp@1.9.6",
  "spdlog@1.15.3",
  "fmt@11.2.0",
  "libxkbregistry@1.7.0",
  "gtk3@3.24.34",
  "glib@2.84.4",
  "atk@2.36.0",
  "pango@1.42.4",
  "cairo@1.16.0",
  "gdk-pixbuf@2.36.12",
  "harfbuzz@10.1.0",
  "fribidi@1.0.16",
  "libepoxy@1.5.4",
  "pixman@0.42.2",
  "fontconfig@2.15.0",
  "freetype@2.13.3",
  "libpng@1.6.43",
  "libxml2@2.13.8",
  "zlib@1.3.1",
  "libwayland@1.24.0",
  "libxkbcommon@1.7.0",
  "wayland-protocols@1.45",
  "libffi@0.1.0",
  "pcre2@10.44",
  "libcxx@21.1.7",
]

[[host_tools]]
name = "wayland-scanner"
version_constraint = ">=1.20"
probe = { args = ["--version"], version_regex = "wayland-scanner (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.wayland-scanner); or apt install wayland-scanner" }

[source]
url = "https://github.com/Alexays/Waybar/archive/refs/tags/0.14.0.tar.gz"
sha256 = "7f3859779bb3a5028a7215b2000c2e476c03453a52289164ba60a4bf1bb3772f"

[license]
spdx = "MIT"
url = "https://github.com/Alexays/Waybar/blob/0.14.0/LICENSE"

[build]
script_path = "packages/registry/waybar/build-waybar.sh"

[[outputs]]
name = "waybar"
wasm = "waybar.wasm"
