kind = "program"
name = "jq-docs"
version = "1.8.2"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `jq` package (jq).
# The source, SHA-256 and version are the `jq` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz"
sha256 = "71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"
provider = "archive"

[license]
spdx = "MIT AND ICU AND BSD-2-Clause"
url = "https://github.com/jqlang/jq/blob/jq-1.8.2/COPYING"

[build]
script_path = "packages/registry/jq-docs/build-jq-docs.sh"

[[outputs]]
name = "jq-docs"
wasm = "jq-docs.zip"
fork_instrumentation = "disabled"
