# Normal Node/Amaro executable payload and unchanged bundled npm, lazily at /usr.
kind = "program"
name = "node-browser-bundle"
version = "0.1.0"
kernel_abi = 56
arches = ["wasm32"]
depends_on = ["node@0.1.0", "node-amaro@1.1.11", "node-undici-llhttp@9.3.1"]

[source]
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz"
sha256 = "986ead18ef18256831bae3e57d94aef680a7b84cfd4044f3e8471f833fbd7191"
provider = "archive"

[license]
spdx = "MIT AND MPL-2.0 AND Artistic-2.0"
url = "https://github.com/nodejs/node/blob/main/LICENSE"

[build]
toolchain = "none"
script_path = "packages/registry/node-browser-bundle/build-node-browser-bundle.sh"

[[host_tools]]
name = "node"
version_constraint = ">=24.0"
probe = { args = ["--version"], version_regex = "v(\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[outputs]]
name = "node"
wasm = "node.zip"
fork_instrumentation = "disabled"
