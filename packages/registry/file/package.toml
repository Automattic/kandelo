kind = "program"
name = "file"
version = "5.45"
kernel_abi = 7
depends_on = []

[source]
url = "https://astron.com/pub/file/file-5.45.tar.gz"
sha256 = "fc97f51029bb0e2c9f4e3bffefdaf678f0e039ee872b9de5c002a6d09c784d82"
provider = "archive"

[license]
spdx = "BSD-2-Clause"
url = "https://github.com/file/file/blob/master/COPYING"

[build]
script_path = "packages/registry/file/build-file.sh"

[[outputs]]
name = "file"
wasm = "file.wasm"

# magic.lite — wasm-safe trimmed magic database. Read by shell's
# build-shell-vfs-image.ts from file's cache canonical dir during
# shell's source build. Declaring it here makes it part of the
# package's cache_key_sha + validate_outputs contract: the existing
# v6/v7 release archives (which don't carry magic.lite) become stale,
# and the resolver source-rebuilds file — picking up the build-file.sh
# stage step that copies magic.lite into OUT_DIR.
[[outputs]]
name = "file-magic"
wasm = "magic.lite"

# libmagic maps a compiled magic database (.mgc) privately read/write,
# validates (and if needed byte-swaps) it, then seals it with
# mprotect(PROT_READ) and refuses to load it if that fails
# (src/apprentice.c apprentice_map; QUICK is on because the target has
# mmap). The seal is hardening: nothing writes the map afterwards, so an
# unenforced seal only stops catching a libmagic bug that writes it.
# Database sizes vary, so no length limit applies. Text databases such as
# the shipped magic.lite never reach this call. prot_none requests stay
# ENOTSUP; file makes none.
[[fictions]]
name = "mprotect"
reason = "apprentice.c apprentice_map seals a loaded compiled magic database (.mgc) read-only as hardening and refuses to load it if mprotect fails; nothing writes it afterwards"
config = { read_only = "accept-unenforced" }
