# Per-library manifest for libcss. See docs/package-management.md.
#
# libcss is NetSurf's CSS parser and selection engine: it parses style
# sheets and computes which declarations apply to a given element. ELinks
# uses it to style documents once JavaScript support turns on its
# libdom-based document model.
#
# Built with the NetSurf project's own build system (the
# netsurf-buildsystem-source package) through scripts/netsurf-library-build.sh.

kind = "library"

name = "libcss"
version = "0.9.2"
kernel_abi = 44
depends_on = [
  "netsurf-buildsystem-source@1.10",
  "libparserutils@0.2.5",
  "libwapcaplet@0.4.3",
]
arches = ["wasm32"]

[source]
url = "https://download.netsurf-browser.org/libs/releases/libcss-0.9.2-src.tar.gz"
sha256 = "2df215bbec34d51d60c1a04b01b2df4d5d18f510f1f3a7af4b80cddb5671154e"
provider = "archive"

[license]
spdx = "MIT"
url = "https://git.netsurf-browser.org/libcss.git/tree/COPYING?h=release/0.9.2"

[build]
script_path = "packages/registry/libcss/build-libcss.sh"

[outputs]
libs = ["lib/libcss.a"]
headers = ["include/libcss"]
pkgconfig = ["lib/pkgconfig/libcss.pc"]
