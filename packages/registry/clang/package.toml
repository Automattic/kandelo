kind = "program"
name = "clang"
version = "23.1.3"
kernel_abi = 47
depends_on = ["libcxx@23.1.3", "zlib@1.3.1"]
arches = ["wasm32"]

[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/llvm-project-23.1.3.src.tar.xz"
sha256 = "c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34"
provider = "archive"

[license]
spdx = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/llvm/llvm-project/blob/llvmorg-23.1.3/LICENSE.TXT"

[build]
script_path = "packages/registry/clang/build-clang.sh"

[[outputs]]
name = "clang"
wasm = "clang.wasm"

[[outputs]]
name = "wasm-ld"
wasm = "wasm-ld.wasm"

[[outputs]]
name = "llvm-ar"
wasm = "llvm-ar.wasm"

[[outputs]]
name = "llvm-ranlib"
wasm = "llvm-ranlib.wasm"

[[outputs]]
name = "llvm-nm"
wasm = "llvm-nm.wasm"

[[outputs]]
name = "llvm-objdump"
wasm = "llvm-objdump.wasm"

[[outputs]]
name = "llvm-objcopy"
wasm = "llvm-objcopy.wasm"

[[outputs]]
name = "llvm-readobj"
wasm = "llvm-readobj.wasm"

[[outputs]]
name = "llvm-size"
wasm = "llvm-size.wasm"

[[outputs]]
name = "llvm-strings"
wasm = "llvm-strings.wasm"

[[outputs]]
name = "llvm-cxxfilt"
wasm = "llvm-cxxfilt.wasm"

[[outputs]]
name = "llvm-symbolizer"
wasm = "llvm-symbolizer.wasm"

[[host_tools]]
name = "cmake"
version_constraint = ">=3.20"
probe = { args = ["--version"], version_regex = "cmake version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "make"
version_constraint = ">=3.81"
probe = { args = ["--version"], version_regex = "GNU Make (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "python3"
version_constraint = ">=3.8"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "clang"
version_constraint = ">=21.0"
probe = { args = ["--version"], version_regex = "clang version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
