kind = "program"
name = "netcat-docs"
version = "0.7.1"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `netcat` package (nc, and netcat as an alias of it).
# The source, SHA-256 and version are the `netcat` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://downloads.sourceforge.net/project/netcat/netcat/0.7.1/netcat-0.7.1.tar.gz"
sha256 = "30719c9a4ffbcf15676b8f528233ccc54ee6cba96cb4590975f5fd60c68a066f"
provider = "archive"

[license]
spdx = "GPL-2.0-or-later"
url = "https://sourceforge.net/projects/netcat/files/netcat/0.7.1/"

[build]
toolchain = "none"
script_path = "packages/registry/netcat-docs/build-netcat-docs.sh"

[[outputs]]
name = "netcat-docs"
wasm = "netcat-docs.zip"
fork_instrumentation = "disabled"
