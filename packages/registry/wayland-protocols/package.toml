# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# The Wayland extension protocol XML (stable/, staging/, unstable/) that
# compositors and clients generate their marshalling glue from with the
# host wayland-scanner, plus the `<name>-enum.h` headers upstream
# generates from it. Installed through upstream's meson build, so the
# tree and wayland-protocols.pc (pkgdatadir, includedir) match a distro
# install. wlroots 0.20 requires >= 1.47. 1.48 raises the versions of
# text-input-v3 and xdg-decoration, and 1.49's enum headers need
# wayland-scanner >= 1.25 (the dev shell ships 1.24).
#
# The core protocol (wayland.xml) is not part of this package: libwayland
# installs it at share/wayland/wayland.xml. The wlr-* protocols come from
# the wlr-protocols package.
name = "wayland-protocols"
version = "1.47"
kernel_abi = 47

[[host_tools]]
name = "meson"
version_constraint = ">=1.4.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

# Native module versions are checked by the recipe; preflight probes
# pkg-config itself, consistently across consumers.
[[host_tools]]
name = "pkg-config"
version_constraint = ">=0.29.2"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[source]
url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.47/downloads/wayland-protocols-1.47.tar.xz"
sha256 = "5fd4349bcbc9bab9a46f8cf77d1f434296a7a052c87440a094f63fcf62a58e20"
provider = "archive"

[license]
spdx = "MIT"
url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/blob/1.47/COPYING"

[build]
script_path = "packages/registry/wayland-protocols/build-wayland-protocols.sh"

[outputs]
# Upstream installs every stable, staging and unstable protocol; these are
# the files registry consumers read by path.
headers = ["include/wayland-protocols"]
pkgconfig = ["share/pkgconfig/wayland-protocols.pc"]
files = [
  "share/wayland-protocols/stable/linux-dmabuf/linux-dmabuf-v1.xml",
  "share/wayland-protocols/stable/presentation-time/presentation-time.xml",
  "share/wayland-protocols/stable/viewporter/viewporter.xml",
  "share/wayland-protocols/stable/xdg-shell/xdg-shell.xml",
  "share/wayland-protocols/staging/cursor-shape/cursor-shape-v1.xml",
  "share/wayland-protocols/staging/ext-background-effect/ext-background-effect-v1.xml",
  "share/wayland-protocols/staging/ext-data-control/ext-data-control-v1.xml",
  "share/wayland-protocols/staging/ext-idle-notify/ext-idle-notify-v1.xml",
  "share/wayland-protocols/staging/ext-session-lock/ext-session-lock-v1.xml",
  "share/wayland-protocols/staging/ext-workspace/ext-workspace-v1.xml",
  "share/wayland-protocols/staging/fractional-scale/fractional-scale-v1.xml",
  "share/wayland-protocols/staging/xdg-activation/xdg-activation-v1.xml",
  "share/wayland-protocols/unstable/idle-inhibit/idle-inhibit-unstable-v1.xml",
  "share/wayland-protocols/unstable/keyboard-shortcuts-inhibit/keyboard-shortcuts-inhibit-unstable-v1.xml",
  "share/wayland-protocols/unstable/pointer-gestures/pointer-gestures-unstable-v1.xml",
  "share/wayland-protocols/unstable/primary-selection/primary-selection-unstable-v1.xml",
  "share/wayland-protocols/unstable/tablet/tablet-unstable-v2.xml",
  "share/wayland-protocols/unstable/text-input/text-input-unstable-v3.xml",
  "share/wayland-protocols/unstable/xdg-decoration/xdg-decoration-unstable-v1.xml",
  "share/wayland-protocols/unstable/xdg-foreign/xdg-foreign-unstable-v1.xml",
  "share/wayland-protocols/unstable/xdg-output/xdg-output-unstable-v1.xml",
  "share/wayland-protocols/unstable/xdg-shell/xdg-shell-unstable-v6.xml",
]
