script_path = "packages/registry/wayland-protocols/build-wayland-protocols.sh"
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "1dc10fcc1761475964c0108628a800c3c5e468e5"
revision    = 2

# Vendored protocol XML is part of the cache key: editing either file
# (e.g. bumping the pinned protocol version) must invalidate the staged
# source so consumers regenerate glue. These paths are tracked in git
# (not under the gitignored `*-src/` glob), so the resolver can hash them
# on a clean checkout.
inputs = [
  "packages/registry/wayland-protocols/build-wayland-protocols.sh",
  "packages/registry/wayland-protocols/xml/wayland.xml",
  "packages/registry/wayland-protocols/xml/xdg-shell.xml",
  "packages/registry/wayland-protocols/xml/linux-dmabuf-v1.xml",
  "packages/registry/wayland-protocols/xml/xdg-decoration-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/wlr-layer-shell-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/presentation-time.xml",
  "packages/registry/wayland-protocols/xml/xdg-output-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/primary-selection-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/text-input-unstable-v3.xml",
  "packages/registry/wayland-protocols/xml/xdg-activation-v1.xml",
  "packages/registry/wayland-protocols/xml/viewporter.xml",
  "packages/registry/wayland-protocols/xml/fractional-scale-v1.xml",
  "packages/registry/wayland-protocols/xml/tablet-unstable-v2.xml",
  "packages/registry/wayland-protocols/xml/cursor-shape-v1.xml",
  "packages/registry/wayland-protocols/xml/pointer-gestures-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/xdg-shell-unstable-v6.xml",
  "packages/registry/wayland-protocols/xml/xdg-foreign-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/keyboard-shortcuts-inhibit-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/idle-inhibit-unstable-v1.xml",
  "packages/registry/wayland-protocols/xml/ext-background-effect-v1.xml",
  "packages/registry/wayland-protocols/xml/ext-idle-notify-v1.xml",
  "packages/registry/wayland-protocols/xml/ext-workspace-v1.xml",
]

# Required by the build.toml schema even for a source package (which is
# staged, not published as a binary archive). The resolver stages the
# vendored XML locally; this block just satisfies the parser and lets a
# future release publish the staged source under the standard index.
