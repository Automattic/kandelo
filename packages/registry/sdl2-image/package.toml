kind = "library"
name = "sdl2-image"
version = "2.8.12"
kernel_abi = 50
arches = ["wasm32"]
# SDL's static .pc uses -l names for its Wayland dependencies.
depends_on = ["sdl2@2.32.10","libwayland@1.24.0","libxkbcommon@1.13.2","libffi@0.1.0","libpng@1.6.43","zlib@1.3.1"]

[source]
provider = "archive"
url = "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz"
sha256 = "393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381"

[license]
spdx = "Zlib"
url = "https://github.com/libsdl-org/SDL_image/blob/release-2.8.12/LICENSE.txt"

[build]
script_path = "packages/registry/sdl2-image/build-sdl2-image.sh"

[[host_tools]]
name = "make"
version_constraint = ">=3.80"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libSDL2_image.a"]
headers = ["include/SDL2/SDL_image.h"]
pkgconfig = ["lib/pkgconfig/SDL2_image.pc"]
