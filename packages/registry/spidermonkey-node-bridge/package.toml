libs = ["lib/libkandelo-node-bridge.a"]
headers = ["include/kandelo-node-engine/engine-string-flags.h", "include/kandelo-node-engine/v8-maybe.h", "include/kandelo-node-engine/v8-source-api/v8-maybe.h", "include/kandelo-node-engine/v8-source-api/cppgc/internal/conditional-stack-allocated.h", "include/kandelo-node-engine/v8-source-api/cppgc/macros.h", "include/kandelo-node-engine/v8-source-api/cppgc/type-traits.h", "include/kandelo-node-engine/v8-source-api/cppgc/internal/compiler-specific.h", "include/kandelo-node-engine/v8-value-serializer.h", "include/kandelo-node-engine/v8-source-api/v8-value-serializer.h", "include/kandelo-node-engine/v8-source-api/v8-value-serializer-version.h", "include/kandelo-node-engine/engine-maybe-api.h", "include/kandelo-node-engine/engine-wire-codec.h", "include/kandelo-node-engine/engine-gc-callback-api.h", "include/kandelo-node-engine/engine-property-enum-api.h", "include/kandelo-node-engine/v8-regexp.h", "include/kandelo-node-engine/v8-source-api/v8-regexp.h", "include/kandelo-node-engine/v8-source-api/v8-profiler.h", "include/kandelo-node-engine/v8-source-api/cppgc/common.h", "include/kandelo-node-engine/engine-build-identity.h", "include/kandelo-node-engine/engine-script-api.h", "include/kandelo-node-engine/engine-fast-call-config.h", "include/kandelo-node-engine/v8-source-api/v8-fast-api-calls.h", "include/kandelo-node-engine/v8-external.h", "include/kandelo-node-engine/engine-native-api.h", "include/kandelo-node-engine/v8-source-api/v8-microtask.h", "include/kandelo-node-engine/v8.h", "include/kandelo-node-engine/v8-context.h", "include/kandelo-node-engine/v8-cppgc.h", "include/kandelo-node-engine/v8-exception.h", "include/kandelo-node-engine/v8-external-memory-accounter.h", "include/kandelo-node-engine/v8-fast-api-calls.h", "include/kandelo-node-engine/v8-function-callback.h", "include/kandelo-node-engine/v8-isolate.h", "include/kandelo-node-engine/v8-local-handle.h", "include/kandelo-node-engine/v8-locker.h", "include/kandelo-node-engine/v8-primitive.h", "include/kand