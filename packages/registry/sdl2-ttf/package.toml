kind = "library"
name = "sdl2-ttf"
version = "2.24.0"
kernel_abi = 50
arches = ["wasm32"]
# SDL's static .pc uses -l names for its Wayland dependencies.
depends_on = ["sdl2@2.32.10","libwayland@1.24.0","libxkbcommon@1.7.0","libffi@0.1.0","freetype@2.13.3","zlib@1.3.1"]

[source]
provider = "archive"
url = "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz"
sha256 = "0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd"

[license]
spdx = "Zlib"
url = "https://github.com/libsdl-org/SDL_ttf/blob/release-2.24.0/LICENSE.txt"

[build]
script_path = "packages/registry/sdl2-ttf/build-sdl2-ttf.sh"

[[host_tools]]
name = "make"
version_constraint = ">=3.80"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libSDL2_ttf.a"]
headers = ["include/SDL2/SDL_ttf.h"]
pkgconfig = ["lib/pkgconfig/SDL2_ttf.pc"]
