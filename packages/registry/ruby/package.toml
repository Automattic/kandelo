kind = "program"
name = "ruby"
version = "4.0.5"
kernel_abi = 15
depends_on = [
    "zlib@1.3.1",
    "libyaml-source@0.2.5",
    "sqlite-amalgamation-source@3.49.1",
    "sqlite3-ruby-source@2.9.6",
]

[source]
url = "https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.5.tar.gz"
sha256 = "7d6149079a63f8ae1d326c9fa65c6019ba2dc3155eae7b39159817911c88958e"
provider = "archive"

[license]
spdx = "Ruby OR BSD-2-Clause"
url = "https://github.com/ruby/ruby/blob/master/COPYING"

[build]
script_path = "packages/registry/ruby/build-ruby.sh"

[[outputs]]
name = "ruby"
wasm = "ruby.wasm"

# Runtime files use /usr by default for direct package images. Callers such as
# A packaged build may compile the same runtime for its stable guest prefix while the
# archive keeps its portable /usr staging layout. Multi-output layout places
# both outputs under programs/<arch>/ruby/.
[[outputs]]
name = "ruby-runtime"
wasm = "ruby-runtime.zip"

# Ruby's fiber pool (cont.c) makes the lowest page of every fiber stack a
# PROT_NONE guard and fails the fiber if mprotect refuses. (Fibers still fail
# after that today: the Kandelo coroutine backend has no context switch and
# coroutine_transfer() is ENOSYS; see README.md.) Kandelo cannot
# enforce the guard: a fiber that overflows its stack corrupts the next
# fiber's stack instead of faulting. The fiction is limited to one 64 KiB page
# per request, the guard's size. GC compaction, whose read barrier needs real
# protection, is compiled out in build-ruby.sh, so no other caller makes such
# requests; JIT (read-only/exec) is disabled and stays ENOTSUP.
[[fictions]]
name = "mprotect"
reason = "cont.c fiber stack guard pages (one 64 KiB PROT_NONE page per fiber stack); GC compaction is compiled out"
config = { prot_none = "accept-unenforced", prot_none_max = 65536 }
