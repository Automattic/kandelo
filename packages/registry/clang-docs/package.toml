kind = "program"
name = "clang-docs"
version = "21.1.7"
kernel_abi = 56
depends_on = []

[[host_tools]]
name = "sphinx-build"
version_constraint = ">=7.2"
install_hints = { darwin = "provided by flake.nix (pkgs.python3Packages.sphinx); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.python3Packages.sphinx); enter scripts/dev-shell.sh" }

# Upstream manual pages for the LLVM binary tools the `clang` package
# builds and the shell installs (llvm-ar, llvm-nm, llvm-objdump, ...).
# The source, SHA-256 and version are the `clang` package's own, so the
# pages describe the release that built the installed binaries;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.7/llvm-project-21.1.7.src.tar.xz"
sha256 = "e5b65fd79c95c343bb584127114cb2d252306c1ada1e057899b6aacdd445899e"
provider = "archive"

[license]
spdx = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/llvm/llvm-project/blob/llvmorg-21.1.7/LICENSE.TXT"

[build]
toolchain = "none"
script_path = "packages/registry/clang-docs/build-clang-docs.sh"

[[outputs]]
name = "clang-docs"
wasm = "clang-docs.zip"
fork_instrumentation = "disabled"
