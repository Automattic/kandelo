kind = "program"
name = "mako-docs"
version = "1.10.0"
kernel_abi = 56
depends_on = []

[[host_tools]]
name = "scdoc"
version_constraint = ">=1.11"
probe = { args = ["-v"], version_regex = "scdoc (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.scdoc); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.scdoc); enter scripts/dev-shell.sh" }

# Upstream manual pages for the `mako` package (mako, makoctl).
# The source, SHA-256 and version are the `mako` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://github.com/emersion/mako/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "3ca44f6bb85c941a4f637a9787931c22ee9a7fe6b8039e6985baf863719b0f95"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/emersion/mako/blob/v1.10.0/LICENSE"

[build]
script_path = "packages/registry/mako-docs/build-mako-docs.sh"

[[outputs]]
name = "mako-docs"
wasm = "mako-docs.zip"
fork_instrumentation = "disabled"
