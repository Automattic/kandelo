script_path = "images/vfs/scripts/build-redis-vfs-image.sh"
inputs = [
  "images/vfs/scripts/build-redis-vfs-image.sh",
  "images/vfs/scripts/build-redis-vfs-image.ts",
  "images/vfs/scripts/dinit-image-helpers.ts",
  "images/vfs/scripts/vfs-image-helpers.ts",
  "images/rootfs/etc/services",
  # The builder reads the shared resolver and VFS format transitively. Track
  # those ownership boundaries without making unrelated host changes rebuild
  # this image.
  "host/src/binary-resolver.ts",
  "host/src/constants.ts",
  "host/src/file-offset.ts",
  "host/src/generated/abi.ts",
  "host/src/pathconf.ts",
  "host/src/statfs.ts",
  "host/src/types.ts",
  "host/src/vfs",
  "host/src/binary-tiers.ts",
  "host/src/wasm-artifact-driver.ts",
  "host/src/wasm-artifact-module-registry.ts",
  "images/vfs/lib/kandelo-image-fs.ts",
  # The image writer these builders drive (images/vfs/lib/kandelo-image-fs.ts
  # loads local-binaries/kandelo_image_module32.wasm): its cargo closure and
  # recipe, so a writer change invalidates the images it wrote.
  "cargo:kandelo-image-module",
  "cargo:runtime-core",
  "crates/kandelo-image-module/build-wasm.sh",
  # The artifact reader every program write and launch goes through
  # (wasm_artifact_module32.wasm).
  "cargo:wasm-artifact-module",
  "cargo:wasm-artifact",
  "crates/wasm-artifact-module/build-wasm.sh",
]
repo_url = "https://github.com/Automattic/kandelo.git"
commit = "UNPUBLISHED"
revision = 2
