# Kandelo system defaults for Codex, installed as /etc/codex/config.toml.
# This is upstream's system configuration layer: ~/.codex/config.toml,
# profiles, and command-line options all override it.

[features]
# The shared background server installs a complete managed Codex package,
# which includes codex-code-mode-host. Run the interface in-process
# instead, as `codex --no-daemon` does.
daemon_auto_start = false

[features.code_mode]
# Models whose catalog entry is `code_mode_only` (every model a ChatGPT
# account can use with Codex 0.163.0; the server retired gpt-5.5 for those
# accounts) reach their tools through `codex-code-mode-host`, a JavaScript
# host built on native V8. V8 does not target WebAssembly, so this build
# has no code-mode host. Upstream's setting keeps the built-in tool
# namespace (shell commands, exec, apply_patch) direct even for those
# models, so they run here without one.
direct_only_tool_namespaces = ["functions"]
