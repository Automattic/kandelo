# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# GTK 3 (libgdk-3.a + libgtk-3.a), wayland backend only. The single
# biggest Tier 2 port (plan
# docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4,
# PR24) — Waybar renders through it and the O2 gate runs unmodified
# Waybar + mako + foot. 3.24.34 is the last autotools release (3.24.35
# moved to meson). No X11, no broadway, no cups/papi print backends,
# no dynamic modules.
name = "gtk3"
version = "3.24.34"
kernel_abi = 17
depends_on = [
  "glib@2.84.4",
  "atk@2.36.0",
  "pango@1.42.4",
  "cairo@1.16.0",
  "gdk-pixbuf@2.36.12",
  "libepoxy@1.5.4",
  "fribidi@1.0.16",
  "harfbuzz@10.1.0",
  "fontconfig@2.15.0",
  "freetype@2.13.3",
  "pixman@0.42.2",
  "libpng@1.6.43",
  "libwayland@1.24.0",
  "libxkbcommon@1.7.0",
  "wayland-protocols@1.45",
  "libffi@0.1.0",
  "zlib@1.3.1",
]

[source]
url = "https://download.gnome.org/sources/gtk+/3.24/gtk+-3.24.34.tar.xz"
sha256 = "dbc69f90ddc821b8d1441f00374dc1da4323a2eafa9078e61edbe5eeefa852ec"

[license]
spdx = "LGPL-2.0-or-later"
url = "https://gitlab.gnome.org/GNOME/gtk/-/blob/3.24.34/COPYING"

[build]
script_path = "packages/registry/gtk3/build-gtk3.sh"

[outputs]
libs = ["lib/libgdk-3.a", "lib/libgtk-3.a"]
headers = ["include/gtk-3.0"]
pkgconfig = [
  "lib/pkgconfig/gtk+-3.0.pc",
  "lib/pkgconfig/gdk-3.0.pc",
  "lib/pkgconfig/gtk+-wayland-3.0.pc",
  "lib/pkgconfig/gdk-wayland-3.0.pc",
]
