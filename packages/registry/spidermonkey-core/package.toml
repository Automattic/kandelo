kind = "library"
name = "spidermonkey-core"
version = "153.7.0esr"
kernel_abi = 56
arches = ["wasm32"]
depends_on = ["libcxx@23.1.3", "libuv@1.52.1", "v8-tracing@14.6.202.34"]

[source]
provider = "archive"
url = "https://ftp.mozilla.org/pub/firefox/releases/153.7.0esr/source/firefox-153.7.0esr.source.tar.xz"
sha256 = "7f8715ee7de2cf36a156216a9b1c7f26d1653010e65793bb2fce66e12edb6ea0"

[license]
spdx = "MPL-2.0"
url = "https://www.mozilla.org/MPL/2.0/"

[build]
script_path = "packages/registry/spidermonkey-core/build-spidermonkey-core.sh"

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "make"
version_constraint = ">=3.81"
probe = { args = ["--version"], version_regex = "GNU Make (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "patch"
version_constraint = ">=2.7"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "clang++"
version_constraint = ">=21.0"
probe = { args = ["--version"], version_regex = "clang version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "rustc"
version_constraint = ">=1.97.0"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "cargo"
version_constraint = ">=1.97.0"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "cbindgen"
version_constraint = ">=0.29.4"
probe = { args = ["--version"], version_regex = "cbindgen (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "node"
version_constraint = ">=24.0"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "curl"
version_constraint = ">=7.71.0"
probe = { args = ["--version"], version_regex = "curl (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "pkg-config"
version_constraint = ">=0.29.2"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libmozjs-153.a", "lib/libjsrust.a"]
headers = ["include/mozjs-153"]
pkgconfig = ["lib/pkgconfig/mozjs-153.pc"]
files = ["share/kandelo/spidermonkey-core.json", "share/doc/spidermonkey-core/LICENSE"]
