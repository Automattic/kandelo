# Experimental source-only consumer of the common-memory host profile. It is
# deliberately absent from the default product/package selection.
kind = "program"
name = "php-common-memory"
version = "8.5.12"
kernel_abi = 56
depends_on = ["zlib@1.3.1", "openssl@3.3.2", "sqlite@3.49.1", "libxml2@2.13.8", "libiconv@1.17", "libzip@1.11.4", "libcurl@8.11.1", "icu@74.2", "libcxx@21.1.7"]
arches = ["wasm32"]

[source]
url = "https://www.php.net/distributions/php-8.5.12.tar.gz"
sha256 = "81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525"
provider = "archive"

[license]
spdx = "PHP-3.01"
url = "https://github.com/php/php-src/blob/master/LICENSE"

[build]
script_path = "packages/registry/php-common-memory/build-php-common-memory.sh"

[[outputs]]
name = "php-common-memory"
wasm = "php.wasm"

[[outputs]]
name = "php-fpm-common-memory"
wasm = "php-fpm.wasm"
