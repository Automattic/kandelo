kind = "program"
name = "grep-docs"
version = "3.11"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `grep` package (grep, egrep, fgrep).
# The source, SHA-256 and version are the `grep` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://ftpmirror.gnu.org/grep/grep-3.11.tar.xz"
sha256 = "1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/grep.git/tree/COPYING?h=v3.11"

[build]
script_path = "packages/registry/grep-docs/build-grep-docs.sh"

[[outputs]]
name = "grep-docs"
wasm = "grep-docs.zip"
fork_instrumentation = "disabled"
