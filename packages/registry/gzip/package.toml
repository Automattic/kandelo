kind = "program"
name = "gzip"
version = "1.13"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/gzip/gzip-1.13.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/gzip/gzip-1.13.tar.xz"]
sha256 = "7454eb6935db17c6655576c2e1b0fabefd38b4d0936e0f87f48cd062ce91a057"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/gzip.git/tree/COPYING"

[build]
script_path = "packages/registry/gzip/build-gzip.sh"

[[outputs]]
name = "gzip"
wasm = "gzip.wasm"
