kind = "program"
name = "spidermonkey"
version = "153.7.0esr"
kernel_abi = 7
depends_on = ["libcxx@23.1.3", "openssl@3.3.2", "zlib@1.3.1", "libzstd@1.5.6"]

[source]
url = "https://ftp.mozilla.org/pub/firefox/releases/153.7.0esr/source/firefox-153.7.0esr.source.tar.xz"
sha256 = "7f8715ee7de2cf36a156216a9b1c7f26d1653010e65793bb2fce66e12edb6ea0"
provider = "archive"

[license]
spdx = "MPL-2.0"
url = "https://www.mozilla.org/MPL/2.0/"

[build]
script_path = "packages/registry/spidermonkey/build-spidermonkey.sh"

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "rustc"
version_constraint = ">=1.90"
probe = { args = ["--version"], version_regex = "rustc (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "pinned by rust-toolchain.toml; enter scripts/dev-shell.sh", linux = "pinned by rust-toolchain.toml; enter scripts/dev-shell.sh" }

[[host_tools]]
name = "cargo"
version_constraint = ">=1.92.0"
install_hints = { darwin = "pinned by rust-toolchain.toml; enter scripts/dev-shell.sh", linux = "pinned by rust-toolchain.toml; enter scripts/dev-shell.sh" }

[[host_tools]]
name = "cbindgen"
version_constraint = ">=0.29.4"
probe = { args = ["--version"], version_regex = "cbindgen (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.rust-cbindgen); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.rust-cbindgen); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "node"
version_constraint = ">=22.0"
probe = { args = ["--version"], version_regex = "v(\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "make"
version_constraint = ">=3.80"
probe = { args = ["--version"], version_regex = "GNU Make (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "curl"
version_constraint = ">=7.71.0"
probe = { args = ["--version"], version_regex = "curl (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[outputs]]
name = "js"
wasm = "js.wasm"
fork_instrumentation = "auto"
