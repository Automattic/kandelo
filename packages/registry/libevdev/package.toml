# Per-library manifest for libevdev. See docs/package-management.md.
#
# libevdev (libevdev.a) wraps a `/dev/input/event*` fd: it owns the fd,
# does the EVIOCG* capability probing, and turns the raw
# `struct input_event` stream into a resyncable per-slot state machine.
# libinput's evdev backend is built on it. Built through upstream's
# meson build with the SDK cross file; pkg-config name `libevdev`, whose
# Cflags point at include/libevdev-1.0 as upstream installs it.

kind = "library"

name = "libevdev"
version = "1.13.3"
kernel_abi = 47

[[host_tools]]
name = "meson"
version_constraint = ">=0.60.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

[[host_tools]]
# make-event-names.py generates event-names.h from the bundled
# <linux/input.h> + <linux/input-event-codes.h> at build time.
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.python3); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.python3); or apt install python3" }

# Applies patches/0001 (bundled Linux UAPI headers off Linux and FreeBSD).
[[host_tools]]
name = "patch"
version_constraint = ">=2.7"
probe = { args = ["--version"], version_regex = "patch (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[source]
url = "https://www.freedesktop.org/software/libevdev/libevdev-1.13.3.tar.xz"
sha256 = "abf1aace86208eebdd5d3550ffded4c8d73bb405b796d51c389c9d0604cbcfbf"
provider = "archive"

[license]
spdx = "MIT"
url = "https://gitlab.freedesktop.org/libevdev/libevdev/-/blob/libevdev-1.13.3/COPYING"

[build]
script_path = "packages/registry/libevdev/build-libevdev.sh"

[outputs]
libs = ["lib/libevdev.a"]
headers = ["include/libevdev-1.0/libevdev/libevdev.h", "include/libevdev-1.0/libevdev/libevdev-uinput.h"]
pkgconfig = ["lib/pkgconfig/libevdev.pc"]
