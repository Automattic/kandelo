script_path = "packages/registry/mako/build-mako.sh"
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "cf81d0f7c"
revision    = 1

# The patches are part of the cache key: the fetched
# `mako-src/` tree is gitignored; the resolver hashes these tracked
# inputs on a clean checkout.
inputs = [
  "packages/registry/mako/build-mako.sh",
  "packages/registry/mako/patches/0001-pool-buffer-gbm-prime-fd.patch",
  "packages/registry/mako/patches/0002-rename-parse-boolean.patch",
  "packages/registry/mako/patches/0003-typed-listener-noops.patch",
]

[binary]
index_url = "https://github.com/Automattic/kandelo/releases/download/binaries-abi-v{abi}/index.toml"
