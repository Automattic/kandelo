# Per-program manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "program"

# mako 1.10.0, the wlroots-world notification daemon — the PR24 leg of
# plan docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4.
# It is a layer-shell client (anchored notification surfaces on
# wlcompositor) that owns org.freedesktop.Notifications on the PR22
# dbus-daemon session bus. Its dbus glue speaks sd_bus_* — provided by
# basu, not gdbus (the plan's "gdbus" was gdbus-the-protocol, not
# gdbus-the-library). Built without icons (no gdk-pixbuf): the O2 gate
# is a text notification; add HAVE_ICONS when a demo needs images.
name = "mako"
version = "1.10.0"
kernel_abi = 17
depends_on = [
  "basu@0.2.1",
  "cairo@1.16.0",
  "pango@1.42.4",
  "glib@2.84.4",
  "pcre2@10.44",
  "harfbuzz@10.1.0",
  "fribidi@1.0.16",
  "pixman@0.42.2",
  "fontconfig@2.15.0",
  "freetype@2.13.3",
  "libpng@1.6.43",
  "zlib@1.3.1",
  "libxml2@2.13.8",
  "libwayland@1.24.0",
  "libffi@0.1.0",
  "wayland-protocols@1.45",
  "libcxx@21.1.7",
]

[[host_tools]]
# Generates the client glue for the five protocol XMLs mako compiles
# against (xdg-shell, cursor-shape, xdg-activation, tablet-v2 from the
# vendored wayland-protocols set; wlr-layer-shell from mako's tree).
name = "wayland-scanner"
version_constraint = ">=1.20"
probe = { args = ["--version"], version_regex = "wayland-scanner (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.wayland-scanner); or apt install wayland-utils" }

[source]
url = "https://github.com/emersion/mako/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "3ca44f6bb85c941a4f637a9787931c22ee9a7fe6b8039e6985baf863719b0f95"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/emersion/mako/blob/v1.10.0/LICENSE"

[build]
script_path = "packages/registry/mako/build-mako.sh"

[[outputs]]
name = "mako"
wasm = "mako.wasm"

[[outputs]]
name = "makoctl"
wasm = "makoctl.wasm"
