kind = "program"
name = "cargo"
version = "1.97.0-nightly-2026-04-27"
kernel_abi = 55
arches = ["wasm32"]
depends_on = ["libcurl@8.11.1", "openssl@3.3.2", "zlib@1.3.1"]

[source]
url = "https://github.com/rust-lang/cargo/archive/eb9b60f1f6604b5e022c56be31692c215b8ba11d.tar.gz"
