kind = "program"
name = "file-docs"
version = "5.45"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `file` package (file, reading /usr/share/misc/magic).
# The source, SHA-256 and version are the `file` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://astron.com/pub/file/file-5.45.tar.gz"
sha256 = "fc97f51029bb0e2c9f4e3bffefdaf678f0e039ee872b9de5c002a6d09c784d82"
provider = "archive"

[license]
spdx = "BSD-2-Clause"
url = "https://github.com/file/file/blob/master/COPYING"

[build]
script_path = "packages/registry/file-docs/build-file-docs.sh"

[[outputs]]
name = "file-docs"
wasm = "file-docs.zip"
fork_instrumentation = "disabled"
