# Exact parser backend bundled by the audited Node API target.
kind = "library"
name = "node-simdjson"
version = "26.13.0"
kernel_abi = 55
depends_on = ["libcxx@21.1.7"]
arches = ["wasm32", "wasm64"]

[source]
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz"
sha256 = "986ead18ef18256831bae3e57d94aef680a7b84cfd4044f3e8471f833fbd7191"
provider = "archive"

[license]
spdx = "Apache-2.0 OR MIT"
url = "https://github.com/simdjson/simdjson/blob/master/LICENSE"

[build]
script_path = "packages/registry/node-simdjson/build-node-simdjson.sh"

[outputs]
libs = ["lib/libsimdjson.a"]
headers = ["include/simdjson.h"]
files = ["share/node-simdjson/provenance.json", "share/licenses/node-simdjson/Node-LICENSE", "share/licenses/node-simdjson/LICENSE"]

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
