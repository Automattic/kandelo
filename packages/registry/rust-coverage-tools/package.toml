kind = "program"
name = "rust-coverage-tools"
version = "22.1.2"
kernel_abi = 55
arches = ["wasm32"]
depends_on = ["rust-llvm@22.1.2", "libcxx@21.1.7", "zlib@1.3.1"]

# Match the LLVM submodule of the Rust compiler, including its profile format.
[source]
url = "https://github.com/rust-lang/llvm-project/archive/1cb4e3833c1919c2e6fb579a23ac0e2b22587b7e.tar.gz"
sha256 = "de8712069787f4f2b306a5ff667cd18dcbdad75d9ccfab0ee9e23fde241c89f2"
provider = "archive"

[license]
spdx = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/rust-lang/llvm-project/blob/1cb4e3833c1919c2e6fb579a23ac0e2b22587b7e/LICENSE.TXT"

[build]
script_path = "packages/registry/rust-coverage-tools/build.sh"

[[outputs]]
name = "llvm-cov"
wasm = "llvm-cov.wasm"
fork_instrumentation = "auto"

[[outputs]]
name = "llvm-profdata"
wasm = "llvm-profdata.wasm"
fork_instrumentation = "auto"

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
install_hints = { darwin = "enter scripts/dev-shell.sh", linux = "enter scripts/dev-shell.sh" }

[[host_tools]]
name = "clang"
version_constraint = ">=21.0"
install_hints = { darwin = "enter scripts/dev-shell.sh", linux = "enter scripts/dev-shell.sh" }
