# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

name = "pixman"
# 0.42.2 is the last autotools release — 0.43+ is meson-only, and this
# repo drives autotools cross-builds natively (no meson in flake.nix).
version = "0.42.2"
kernel_abi = 17
depends_on = []

[source]
url = "https://www.cairographics.org/releases/pixman-0.42.2.tar.gz"
sha256 = "ea1480efada2fd948bc75366f7c349e1c96d3297d09a3fe62626e38e234a625e"
provider = "archive"

[license]
spdx = "MIT"
url = "https://gitlab.freedesktop.org/pixman/pixman/-/blob/pixman-0.42.2/COPYING"

[build]
script_path = "packages/registry/pixman/build-pixman.sh"

[outputs]
libs = ["lib/libpixman-1.a"]
headers = ["include/pixman-1"]
pkgconfig = ["lib/pkgconfig/pixman-1.pc"]
