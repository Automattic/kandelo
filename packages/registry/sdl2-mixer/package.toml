kind = "library"
name = "sdl2-mixer"
version = "2.8.2"
kernel_abi = 50
arches = ["wasm32"]
depends_on = ["sdl2@2.32.10", "libwayland@1.24.0", "libxkbcommon@1.7.0", "libffi@0.1.0"]

[source]
provider = "archive"
url = "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.2/SDL2_mixer-2.8.2.tar.gz"
sha256 = "938dff531d00ace2296557a6599abe6f34599e2f34f0a4a08a397e2ccac8b8f7"

[license]
spdx = "Zlib"
url = "https://github.com/libsdl-org/SDL_mixer/blob/release-2.8.2/LICENSE.txt"

[build]
script_path = "packages/registry/sdl2-mixer/build-sdl2-mixer.sh"

[[host_tools]]
name = "make"
version_constraint = ">=3.80"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[outputs]
libs = ["lib/libSDL2_mixer.a"]
headers = ["include/SDL2/SDL_mixer.h"]
pkgconfig = ["lib/pkgconfig/SDL2_mixer.pc"]
