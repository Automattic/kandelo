kind = "program"
name = "grep"
version = "3.11"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/grep/grep-3.11.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz"]
sha256 = "1db2aedde89d0dea42b16d9528f894c8d15dae4e190b59aecc78f5a951276eab"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/grep.git/tree/COPYING?h=v3.11"

[build]
script_path = "packages/registry/grep/build-grep.sh"

[[outputs]]
name = "grep"
wasm = "grep.wasm"
