kind = "library"
name = "libevent"
version = "2.1.12"
kernel_abi = 51
arches = ["wasm32", "wasm64"]
depends_on = []

[source]
url = "https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz"
sha256 = "92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb"
provider = "archive"

[license]
spdx = "BSD-3-Clause"
url = "https://github.com/libevent/libevent/blob/release-2.1.12-stable/LICENSE"

[build]
script_path = "packages/registry/libevent/build-libevent.sh"

[outputs]
libs = ["lib/libevent.a", "lib/libevent_core.a", "lib/libevent_extra.a", "lib/libevent_pthreads.a"]
headers = [
  "include/evdns.h",
  "include/event.h",
  "include/event2/buffer.h",
  "include/event2/buffer_compat.h",
  "include/event2/bufferevent.h",
  "include/event2/bufferevent_compat.h",
  "include/event2/bufferevent_struct.h",
  "include/event2/dns.h",
  "include/event2/dns_compat.h",
  "include/event2/dns_struct.h",
  "include/event2/event-config.h",
  "include/event2/event.h",
  "include/event2/event_compat.h",
  "include/event2/event_struct.h",
  "include/event2/http.h",
  "include/event2/http_compat.h",
  "include/event2/http_struct.h",
  "include/event2/keyvalq_struct.h",
  "include/event2/listener.h",
  "include/event2/rpc.h",
  "include/event2/rpc_compat.h",
  "include/event2/rpc_struct.h",
  "include/event2/tag.h",
  "include/event2/tag_compat.h",
  "include/event2/thread.h",
  "include/event2/util.h",
  "include/event2/visibility.h",
  "include/evhttp.h",
  "include/evrpc.h",
  "include/evutil.h",
]
pkgconfig = ["lib/pkgconfig/libevent.pc", "lib/pkgconfig/libevent_core.pc", "lib/pkgconfig/libevent_extra.pc", "lib/pkgconfig/libevent_pthreads.pc"]
