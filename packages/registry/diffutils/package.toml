kind = "program"
name = "diffutils"
version = "3.10"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/diffutils/diffutils-3.10.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/diffutils/diffutils-3.10.tar.xz"]
sha256 = "90e5e93cc724e4ebe12ede80df1634063c7a855692685919bfe60b556c9bd09e"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/diffutils.git/tree/COPYING"

[build]
script_path = "packages/registry/diffutils/build-diffutils.sh"

[[outputs]]
name = "diff"
wasm = "diff.wasm"

[[outputs]]
name = "cmp"
wasm = "cmp.wasm"

[[outputs]]
name = "diff3"
wasm = "diff3.wasm"

[[outputs]]
name = "sdiff"
wasm = "sdiff.wasm"
