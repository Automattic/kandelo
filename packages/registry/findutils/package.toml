kind = "program"
name = "findutils"
version = "4.10.0"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/findutils/findutils-4.10.0.tar.xz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"]
sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/findutils.git/tree/COPYING"

[build]
script_path = "packages/registry/findutils/build-findutils.sh"

[[outputs]]
name = "find"
wasm = "find.wasm"

[[outputs]]
name = "xargs"
wasm = "xargs.wasm"
