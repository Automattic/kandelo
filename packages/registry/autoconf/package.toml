kind = "program"
name = "autoconf"
version = "2.73"
kernel_abi = 56
depends_on = []

# GNU Autoconf: generates configure scripts. Perl and m4 scripts, installed as a ZIP mounted at /usr; they run the guest's /usr/bin/perl and /usr/bin/m4.
[source]
url = "https://ftpmirror.gnu.org/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later WITH Autoconf-exception-generic-3.0"
url = "https://git.savannah.gnu.org/cgit/autoconf.git/tree/COPYINGv3?h=v2.73"

[build]
toolchain = "none"
script_path = "packages/registry/autoconf/build-autoconf.sh"

[[outputs]]
name = "autoconf"
wasm = "autoconf.zip"
fork_instrumentation = "disabled"
