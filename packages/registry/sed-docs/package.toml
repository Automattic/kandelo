kind = "program"
name = "sed-docs"
version = "4.9"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `sed` package (sed).
# The source, SHA-256 and version are the `sed` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://ftpmirror.gnu.org/sed/sed-4.9.tar.xz"
sha256 = "6e226b732e1cd739464ad6862bd1a1aba42d7982922da7a53519631d24975181"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/sed.git/tree/COPYING?h=v4.9"

[build]
script_path = "packages/registry/sed-docs/build-sed-docs.sh"

[[outputs]]
name = "sed-docs"
wasm = "sed-docs.zip"
fork_instrumentation = "disabled"
