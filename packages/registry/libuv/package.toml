# Initial loop backend, using the exact libuv patch set bundled in pinned Node.
# See README.md for implemented scope and unresolved platform APIs.
kind = "library"
name = "libuv"
version = "1.52.1"
kernel_abi = 56
arches = ["wasm32"]

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "cmake"
version_constraint = ">=3.16"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "patch"
version_constraint = ">=2.7"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[source]
# Node's deps/uv has four C-file differences from standalone libuv 1.52.1.
# Keep the audited Node copy rather than silently replacing its patch set.
url = "https://nodejs.org/dist/v26.13.0/node-v26.13.0.tar.gz"
sha256 = "986ead18ef18256831bae3e57d94aef680a7b84cfd4044f3e8471f833fbd7191"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/nodejs/node/blob/18b32a3b1552e199a01f1a8d9fd64aa756d3b75b/deps/uv/LICENSE"

[build]
script_path = "packages/registry/libuv/build-libuv.sh"

[outputs]
libs = ["lib/libuv.a"]
headers = ["include/uv.h", "include/uv"]
pkgconfig = ["lib/pkgconfig/libuv-static.pc"]
files = [
  "lib/cmake/libuv/libuvConfig.cmake",
  "lib/cmake/libuv/libuvConfig-release.cmake",
  "lib/cmake/libuv/libuvConfigVersion.cmake",
  "share/doc/libuv/LICENSE",
  "share/doc/libuv/LICENSE-extra",
]
