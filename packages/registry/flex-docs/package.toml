kind = "program"
name = "flex-docs"
version = "2.6.4"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `flex` package (flex, and lex as an alias of it).
# The source, SHA-256 and version are the `flex` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"
provider = "archive"

[license]
spdx = "BSD-3-Clause-flex"
url = "https://github.com/westes/flex/blob/v2.6.4/COPYING"

[build]
script_path = "packages/registry/flex-docs/build-flex-docs.sh"

[[outputs]]
name = "flex-docs"
wasm = "flex-docs.zip"
fork_instrumentation = "disabled"
