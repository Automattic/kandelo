kind = "program"
name = "foot-docs"
version = "1.28.0"
kernel_abi = 56
depends_on = []

[[host_tools]]
name = "scdoc"
version_constraint = ">=1.11"
probe = { args = ["-v"], version_regex = "scdoc (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.scdoc); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.scdoc); enter scripts/dev-shell.sh" }

# Upstream manual pages for the `foot` package (foot, foot.ini and its control sequences).
# The source, SHA-256 and version are the `foot` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://codeberg.org/dnkl/foot/releases/download/1.28.0/foot-1.28.0.tar.gz"
sha256 = "ee73c292a4b457004b38c2df178eac025ab0b849fdd9e13253c1f8b5cf110710"
provider = "archive"

[license]
spdx = "MIT"
url = "https://codeberg.org/dnkl/foot/src/tag/1.28.0/LICENSE"

[build]
script_path = "packages/registry/foot-docs/build-foot-docs.sh"

[[outputs]]
name = "foot-docs"
wasm = "foot-docs.zip"
fork_instrumentation = "disabled"
