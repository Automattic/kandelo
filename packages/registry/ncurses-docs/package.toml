kind = "program"
name = "ncurses-docs"
version = "6.5"
kernel_abi = 56
depends_on = []

# Upstream manual pages for the `ncurses` package's programs (clear, tput, tic, ...) and the terminfo formats.
# The source, SHA-256 and version are the `ncurses` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz"
sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
provider = "archive"

[license]
spdx = "X11"
url = "https://invisible-island.net/ncurses/ncurses-license.html"

[build]
script_path = "packages/registry/ncurses-docs/build-ncurses-docs.sh"

[[outputs]]
name = "ncurses-docs"
wasm = "ncurses-docs.zip"
fork_instrumentation = "disabled"
