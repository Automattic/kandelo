# Per-program manifest for ELinks. See docs/package-management.md.
#
# ELinks is a text-mode web browser: it lays out tables and frames, colors
# pages from their style sheets, and has tabs, bookmarks, history, form
# history, downloads, and mouse support, all inside a terminal.
#
# This build runs page JavaScript. ELinks embeds the QuickJS-NG engine and
# exposes each page to scripts through NetSurf's libdom (the document tree)
# and libcss (style). ELinks itself ships with scripts off
# (`ecmascript.enable = 0`); the Kandelo shell image turns them on in
# /etc/elinks/elinks.conf (host/src/shell-runtime-layout.ts), and a user can
# turn them off again from the options manager or ~/.config/elinks.
#
# Features deliberately left out, each because Kandelo has no package for the
# library it needs. They are omitted, not stubbed, so `elinks -version` lists
# only what works:
#   - translations (--disable-nls): compiling the message catalogs needs
#     msgfmt, which the dev shell does not provide; the UI is English.
#   - regular-expression search (TRE), international domain names (libidn2),
#     XBEL bookmark import/export (expat), brotli/zstd/bzip2/lzma content
#     decoding, terminfo, and SFTP.
#
# License note: ELinks is GPL-2.0-only and this binary links OpenSSL
# (Apache-2.0), the same combination the `git` package already ships.

kind = "program"
name = "elinks"
version = "0.20.0"
kernel_abi = 44
depends_on = [
  "zlib@1.3.1",
  "openssl@3.3.2",
  "libcurl@8.11.1",
  "sqlite@3.49.1",
  "quickjs-ng@0.17.0",
  "libwapcaplet@0.4.3",
  "libparserutils@0.2.5",
  "libhubbub@0.3.8",
  "libcss@0.9.2",
  "libdom@0.4.2",
  # src/js/timer.cpp and two map.cpp files use std::map, so the final link
  # needs libc++ and libc++abi.
  "libcxx@21.1.7",
]

[source]
url = "https://github.com/rkd77/elinks/releases/download/v0.20.0/elinks-0.20.0.tar.xz"
sha256 = "75af7ba88af99ff5069ec7b4b7a3241d5920f4089764c7297cff3c8484a9e33f"
provider = "archive"

[license]
spdx = "GPL-2.0-only"
url = "https://github.com/rkd77/elinks/blob/v0.20.0/COPYING"

[build]
script_path = "packages/registry/elinks/build-elinks.sh"

[[outputs]]
name = "elinks"
wasm = "elinks.wasm"
