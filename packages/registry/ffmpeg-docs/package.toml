kind = "program"
name = "ffmpeg-docs"
version = "9.0"
kernel_abi = 56
# configure probes the libraries the ffmpeg package builds against, so the
# pages are built from the same configuration.
depends_on = [
  "zlib@1.3.1",
  "sdl2@2.32.10",
  "libiconv@1.17",
  "libxml2@2.13.8",
  "libwayland@1.24.0",
  "libxkbcommon@1.13.2",
  "libffi@0.1.0",
]

# Upstream manual pages for the `ffmpeg` package (ffmpeg, ffprobe, ffplay and their component pages).
# The source, SHA-256 and version are the `ffmpeg` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz"
sha256 = "7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52"
provider = "archive"

[license]
spdx = "LGPL-2.1-or-later"
url = "https://git.ffmpeg.org/gitweb/ffmpeg.git/blob/refs/tags/n9.0:/LICENSE.md"

[build]
script_path = "packages/registry/ffmpeg-docs/build-ffmpeg-docs.sh"

[[outputs]]
name = "ffmpeg-docs"
wasm = "ffmpeg-docs.zip"
fork_instrumentation = "disabled"
