kind = "program"
name = "graphics-cts"
version = "1.0.0"
kernel_abi = 56
arches = ["wasm32"]
depends_on = ["libcxx@21.1.7", "libdrm@2.4.134", "libpng@1.6.43", "zlib@1.3.1", "jsoncpp@1.9.6"]

[source]
url = "https://github.com/KhronosGroup/VK-GL-CTS/archive/a119e62de3bb38dae67f05abee8acd011e0c729c.tar.gz"
sha256 = "7f0a0601c96973a5919db369159d24557d9e4d82490e4bfad98180e3296dbedf"
provider = "archive"

[license]
spdx = "Apache-2.0 AND GPL-2.0-or-later"
url = "https://github.com/KhronosGroup/VK-GL-CTS/blob/a119e62de3bb38dae67f05abee8acd011e0c729c/LICENSE"

[build]
script_path = "packages/registry/graphics-cts/build-graphics-cts.sh"

[[outputs]]
name = "deqp-egl"
wasm = "deqp-egl.wasm"

[[outputs]]
name = "deqp-gles2"
wasm = "deqp-gles2.wasm"

[[outputs]]
name = "data"
wasm = "deqp-data.zip"
fork_instrumentation = "disabled"

[[host_tools]]
name = "cmake"
version_constraint = ">=3.20.0"
probe = { args = ["--version"], version_regex = "cmake version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
