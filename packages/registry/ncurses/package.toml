# ncurses provides both link-time libraries and the standard terminal
# utilities. The package schema currently has one declared output shape per
# manifest, so this is a program package whose build still installs
# libncursesw/libtinfow and headers into the same prefix for consumers that
# depend on ncurses as a link-time input.
#
# No wasm deps (host `tic`/`infocmp` are built out-of-band inside the
# lib dir — they're host binaries, not cacheable wasm artifacts, so
# they don't go through the resolver). The compiled-in terminal
# fallback entries (xterm-256color, xterm, vt100, dumb) are linked
# into libtinfow.a via MKfallback.sh as a safety-net floor. The
# `terminfo.zip` [[runtime_files]] artifact below is the real runtime
# terminfo database (a curated, generous terminal set) that VFS image
# builders stage at /usr/share/terminfo so every ncurses/termcap-linked
# guest program gets correct behavior beyond that 4-entry floor.

kind = "program"

name = "ncurses"
version = "6.5"
kernel_abi = 7
depends_on = []

[source]
# Use the ncurses maintainer's archive mirror. The GNU canonical origin can be
# unreachable even while the maintainer's identical hash-verified archive is
# available.
url = "https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz"
sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
provider = "archive"

[license]
spdx = "X11"
url = "https://invisible-island.net/ncurses/ncurses-license.html"

[build]
script_path = "packages/registry/ncurses/build-ncurses.sh"

[[outputs]]
name = "clear"
wasm = "clear.wasm"

[[outputs]]
name = "reset"
wasm = "reset.wasm"

[[outputs]]
name = "tset"
wasm = "tset.wasm"

[[outputs]]
name = "tput"
wasm = "tput.wasm"

[[outputs]]
name = "tabs"
wasm = "tabs.wasm"

[[outputs]]
name = "tic"
wasm = "tic.wasm"

[[outputs]]
name = "infocmp"
wasm = "infocmp.wasm"

[[outputs]]
name = "toe"
wasm = "toe.wasm"

[[outputs]]
name = "captoinfo"
wasm = "captoinfo.wasm"

[[outputs]]
name = "infotocap"
wasm = "infotocap.wasm"

# The shared runtime terminfo database: a curated, GENEROUS terminal set
# (roughly ncurses-base) compiled from this ncurses's own misc/terminfo.src,
# rooted at share/terminfo/... Every ncurses/termcap-linked guest program
# (less, vim, ...) already searches /usr/share/terminfo (see
# --with-default-terminfo-dir / --with-terminfo-dirs above); this database is
# what makes the search succeed for terminals beyond the 4-entry compiled-in
# fallback floor.
#
# NOTE: unlike other [[runtime_files]] (e.g. perl-runtime.zip, python-runtime.
# zip) which are placed verbatim at their guest_path, this archive is NOT
# shipped as a file. The shell VFS image builders (populateTerminfoDatabase in
# images/vfs/scripts/shell-lazy-archives.ts) EXTRACT its members into
# /usr/share/terminfo. guest_path below is the nominal artifact location; the
# .zip itself never appears in the guest filesystem.
[[runtime_files]]
artifact = "terminfo.zip"
guest_path = "/usr/share/terminfo/terminfo.zip"
