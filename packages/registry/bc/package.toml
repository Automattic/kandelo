kind = "program"
name = "bc"
version = "1.07.1"
kernel_abi = 7
depends_on = []

[source]
url = "https://ftpmirror.gnu.org/bc/bc-1.07.1.tar.gz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so a
# package can 404 on every retry while the canonical archive serves it fine.
# sha256 below gates the bytes whichever host answers.
mirrors = ["https://ftp.gnu.org/gnu/bc/bc-1.07.1.tar.gz"]
sha256 = "62adfca89b0a1c0164c2cdca59ca210c1d44c3ffc46daf9931cf4942664cb02a"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/bc.git/tree/COPYING"

[build]
script_path = "packages/registry/bc/build-bc.sh"

[[outputs]]
name = "bc"
wasm = "bc.wasm"
