# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# spdlog logging library (libspdlog.a). C++ base dep for the Waybar
# port. Compiled against the external fmt package (SPDLOG_FMT_EXTERNAL)
# so both consumers share one fmt.
name = "spdlog"
version = "1.15.3"
kernel_abi = 17
depends_on = ["fmt@11.2.0", "libcxx@21.1.7"]

[source]
url = "https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz"
sha256 = "15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67"

[license]
spdx = "MIT"
url = "https://github.com/gabime/spdlog/blob/v1.15.3/LICENSE"

[build]
script_path = "packages/registry/spdlog/build-spdlog.sh"

[outputs]
libs = ["lib/libspdlog.a"]
headers = ["include/spdlog"]
pkgconfig = ["lib/pkgconfig/spdlog.pc"]
