kind = "program"
name = "bash"
version = "5.2.37"
kernel_abi = 7
depends_on = ["ncurses@6.5"]

[source]
url = "https://ftpmirror.gnu.org/bash/bash-5.2.37.tar.gz"
# ftpmirror.gnu.org is GNU's redirector and stays primary. It picks a mirror
# without checking that mirror carries the file, and the pick is sticky, so on
# 2026-09-14 every request landed on one host returning 404. The canonical
# archive is the fallback; sha256 below gates the bytes either way.
mirrors = ["https://ftp.gnu.org/gnu/bash/bash-5.2.37.tar.gz"]
sha256 = "9599b22ecd1d5787ad7d3b7bf0c59f312b3396d1e281175dd1f8a4014da621ff"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://git.savannah.gnu.org/cgit/bash.git/tree/COPYING"

[build]
script_path = "packages/registry/bash/build-bash.sh"

[[outputs]]
name = "bash"
wasm = "bash.wasm"
