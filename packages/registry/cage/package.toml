kind = "program"

# cage, a Wayland kiosk compositor: it runs one program as the whole
# session, maximized, and exits when that program exits. Built through
# upstream's meson build with the SDK cross file against the wlroots
# package. It forks its session program, so it is fork-instrumented.
name = "cage"
version = "0.3.1"
kernel_abi = 55
depends_on = [
  "wlroots@0.20.2",
  "libwayland@1.24.0",
  "wayland-protocols@1.47",
  "libdrm@2.4.134",
  "libxkbcommon@1.13.2",
  "pixman@0.46.4",
  "libudev-zero@1.0.5",
  "libseat@0.9.3",
  "libinput@1.28.1",
  "libdisplay-info@0.3.0",
  "xkeyboard-config@2.48",
]

[[host_tools]]
name = "meson"
version_constraint = ">=1.3.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "wayland-scanner"
version_constraint = ">=1.24"
probe = { args = ["--version"], version_regex = "wayland-scanner (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh" }

# meson resolves the native wayland-scanner with the build machine's
# pkg-config, so the probe asks that pkg-config for it.
[[host_tools]]
name = "pkg-config"
version_constraint = ">=1.20.0"
probe = { args = ["--modversion", "wayland-scanner"], version_regex = "(?m)^(\\d+\\.\\d+(?:\\.\\d+)?)$" }
install_hints = { darwin = "wayland-scanner is provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh", linux = "wayland-scanner is provided by flake.nix (pkgs.wayland-scanner); enter scripts/dev-shell.sh" }

[source]
url = "https://github.com/cage-kiosk/cage/releases/download/v0.3.1/cage-0.3.1.tar.gz"
sha256 = "edafc173b6f56a3e1564933e272a54aaa9fe158d330e6a415d57b44ab880fe2b"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/cage-kiosk/cage/blob/v0.3.1/LICENSE"

[build]
script_path = "packages/registry/cage/build-cage.sh"

[[outputs]]
name = "cage"
wasm = "cage.wasm"

# cage compiles its keymap from the xkeyboard-config rules, which
# libxkbcommon reads from /usr/share/X11/xkb. A cage machine root unpacks
# this zip there.
[[runtime_files]]
artifact = "xkeyboard-config.zip"
guest_path = "/usr/share/cage/xkeyboard-config.zip"

# wlroots links libinput statically, and libinput reads its device quirks
# from /usr/share/libinput. A cage machine root unpacks this zip there.
[[runtime_files]]
artifact = "libinput-quirks.zip"
guest_path = "/usr/share/cage/libinput-quirks.zip"
