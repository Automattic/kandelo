kind = "program"
name = "flang-browser-bundle"
version = "23.1.3"
kernel_abi = 56
arches = ["wasm32"]
depends_on = ["libcxx@23.1.3", "kandelo-sdk-browser-bundle@23.1.3"]

[source]
provider = "archive"
url = "https://github.com/Progate/llvm-project/archive/599361caafb0f81262c0cb6a72fab396c43892e2.tar.gz"
# GitHub generates this archive on demand. LLVM's export-subst file
# clang/bindings/python/.git_archival.txt records an abbreviated
# `git describe` name whose length can grow with the fork network, which
# changes the archive bytes but no other member.
sha256 = "38c61727f340599a0a05a2f147e48f50f5415d840c2dfad03770d5894c27d965"

[license]
spdx = "Apache-2.0 WITH LLVM-exception"
url = "https://github.com/Progate/llvm-project/blob/599361caafb0f81262c0cb6a72fab396c43892e2/LICENSE.TXT"

[build]
script_path = "packages/registry/flang-browser-bundle/build.sh"

[[outputs]]
name = "flang"
wasm = "flang.zip"
fork_instrumentation = "disabled"

[[host_tools]]
name = "cmake"
version_constraint = ">=3.20"
probe = { args = ["--version"], version_regex = "cmake version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "clang"
version_constraint = ">=21.0"
probe = { args = ["--version"], version_regex = "clang version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "sphinx-build"
version_constraint = ">=7.2"
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
