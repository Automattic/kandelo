# Kandelo wlcompositor — Hyprland-class tiling desktop (layout via WLC_LAYOUT, set by hyprdesktop).
# Browser desktops use real Alt/Option as their window/workspace modifier.
# WHY: Super/Cmd chords belong to the browser or host window manager, while
# Ctrl belongs to terminal/editor applications. Avoid Alt+Space/Tab/F4,
# Alt+arrows and Ctrl+Alt (AltGr); do not steal those reserved/input chords.

# Applications: C is clock, leaving J/K available for focus.
bind = ALT, Return, exec, /usr/bin/wlterm
bind = ALT, C, exec, /usr/bin/wlclock
bind = ALT, P, exec, /usr/bin/wlpaint

# Window management: J/K follows the other browser desktops' focus keys.
bind = ALT SHIFT, Q, killactive
bind = ALT, J, cyclenext
bind = ALT, K, cycleprev

# Workspaces and moving the focused window.
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9

# Letter directions avoid the host's Alt+arrow navigation shortcuts.
bind = ALT SHIFT, H, swapwindow, l
bind = ALT SHIFT, J, swapwindow, d
bind = ALT SHIFT, K, swapwindow, u
bind = ALT SHIFT, L, swapwindow, r
