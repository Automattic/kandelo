# foot's configuration for the Omarchy desktop, passed with --config.
# TERM is vt100 because no foot terminfo is in the image; workers=0 keeps
# rendering on foot's main thread (see foot's 0002 patch).
[main]
term=vt100
font=monospace:size=12
workers=0

# Omarchy's universal clipboard sends a terminal Ctrl+Shift+C/V from SUPER+C/V
# through Hyprland's sendshortcut, which sway has no command for, so foot owns
# the chords: SUPER (Cmd on macOS), the CUA Ctrl+Insert and Shift+Insert (the
# clipboard, not PRIMARY), and Ctrl+V for browsers that keep SUPER. Ctrl+V
# costs the terminal its literal-next key; Ctrl+C stays SIGINT.
[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert Mod4+c XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert Control+v Mod4+v XF86Paste
primary-paste=none
