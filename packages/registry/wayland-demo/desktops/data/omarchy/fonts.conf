<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The Omarchy machine's fontconfig. omarchydesktop points FONTCONFIG_FILE
     here. The fonts are JetBrainsMono Nerd Font (the jetbrains-mono-nerd-font
     package), Omarchy's own icon font, and the desktop's Inconsolata; the
     rules are Omarchy's, which make JetBrainsMono Nerd Font the monospace
     and sans-serif face. -->
<fontconfig>
  <dir>/usr/share/fonts/jetbrains-mono-nerd-font</dir>
  <dir>/usr/share/omarchy/default/fonts</dir>
  <dir>/usr/share/kandelo/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <include>/usr/share/omarchy/default/fontconfig/conf.avail/50-omarchy.conf</include>
</fontconfig>
