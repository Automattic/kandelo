# The Omarchy machine's sway session. omarchydesktop starts sway with this
# file. Omarchy's own files fill it in: the current theme's sway.conf colors
# the windows, and the bindings file is what omarchy-sway-bindings printed
# from Omarchy's Lua binding declarations before sway started.
#
# The border and gaps are Omarchy's default/hypr/looknfeel.lua: a 2-pixel
# border, 10 pixels between windows (Hyprland's gaps_in 5 on each side) and
# 10 at the screen edges (gaps_out). sway adds its inner gap at the edges
# too, so the inner gap alone gives both.
default_border pixel 2
gaps inner 10

include ~/.local/state/omarchy/current/theme/sway.conf
include ~/.local/state/omarchy/sway/bindings.conf

# Omarchy's terminal binding runs omarchy-launch-terminal, which the image
# does not ship, so the session binds foot itself.
set $term /usr/bin/foot --config=/usr/share/kandelo/omarchy/foot.ini /bin/bash -i
bindsym --no-repeat Mod4+Return exec $term

# A browser keeps some Super chords for itself (Cmd+Space opens Spotlight on
# macOS), so the session mirrors the essential ones on Ctrl. Ctrl+K and
# Ctrl+P open the clock and the paint demo, the desktop's small clients.
# Like Omarchy's own bindings, none of the session's bindings repeats
# while the key is held.
bindsym --no-repeat Ctrl+Return exec $term
bindsym --no-repeat Ctrl+space exec omarchy-menu toggle
bindsym --no-repeat Ctrl+Mod1+space exec omarchy-menu toggle apps
bindsym --no-repeat Ctrl+Shift+space exec omarchy-menu toggle theme
bindsym --no-repeat Ctrl+Escape exec omarchy-menu toggle system
bindsym --no-repeat Ctrl+w kill
bindsym --no-repeat Ctrl+k exec /usr/bin/wlclock
bindsym --no-repeat Ctrl+p exec /usr/bin/wlpaint
bindcode --no-repeat Ctrl+10 workspace number 1
bindcode --no-repeat Ctrl+11 workspace number 2
bindcode --no-repeat Ctrl+12 workspace number 3
bindcode --no-repeat Ctrl+13 workspace number 4
bindcode --no-repeat Ctrl+14 workspace number 5
bindcode --no-repeat Ctrl+15 workspace number 6
bindcode --no-repeat Ctrl+16 workspace number 7
bindcode --no-repeat Ctrl+17 workspace number 8
bindcode --no-repeat Ctrl+18 workspace number 9

# The session's services. They need sway's WAYLAND_DISPLAY, so sway starts
# them: Waybar draws Omarchy's bar in the current theme's waybar.css (a theme
# switch sends it SIGUSR2 to read the file again), mako reads the current
# theme's mako.ini (makoctl reload re-reads it after a theme switch), swaybg
# draws the theme's background, swayidle locks after 300 seconds (the lock
# timeout in Omarchy's config/omarchy/shell.json) unless Omarchy's stay-awake
# indicator is set (omarchydesktop sets it on the first boot), and kclipd turns host clipboard text into the desktop's
# selection.
exec waybar -c /usr/share/kandelo/omarchy/waybar.jsonc -s ~/.local/state/omarchy/current/theme/waybar.css
exec mako --config ~/.local/state/omarchy/current/theme/mako.ini
exec swaybg -i ~/.local/state/omarchy/current/background -m fill
exec swayidle -w timeout 300 '[ -e ~/.local/state/omarchy/indicators/stay-awake ] || omarchy-system-lock'
exec /usr/bin/kclipd

# omarchy-theme-set warms the Theme and Background pickers' caches after each
# switch, but the first boot sets the theme headless, which skips that step.
# The session warms them once at start, so the first pick finds them filled.
exec omarchy-theme-switcher --preload
exec omarchy-theme-bg-cache
