# foot's configuration for the Omarchy session's terminal, passed with
# --config. It is Omarchy's config/foot/foot.ini, which includes the current
# theme's colors, with these changes: TERM is vt100 because no foot terminfo
# is in the image, workers=0 keeps rendering on foot's main thread (see foot's
# 0002 patch), and the clipboard chords below.
[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=vt100
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

# Omarchy's universal clipboard sends a terminal Ctrl+Shift+C/V from SUPER+C/V
# through Hyprland's sendshortcut, which sway has no command for, so foot owns
# the chords: SUPER (Cmd on macOS), the CUA Ctrl+Insert and Shift+Insert (the
# clipboard, not PRIMARY), and Ctrl+V for browsers that keep SUPER. Ctrl+V
# costs the terminal its literal-next key; Ctrl+C stays SIGINT.
[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert Mod4+c XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert Control+v Mod4+v XF86Paste
primary-paste=none

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
