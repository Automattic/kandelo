# Kandelo wlcompositor — the Omarchy-shaped desktop.
theme = tokyo-night
notify = /usr/local/bin/notify-send

# Browser desktops use real Alt/Option as their window/workspace modifier.
# WHY: Super/Cmd chords belong to the browser or host window manager, while
# Ctrl belongs to terminal/editor applications. Avoid Alt+Space/Tab/F4,
# Alt+arrows and Ctrl+Alt (AltGr); do not steal those reserved/input chords.

# Applications: C is clock, leaving J/K available for focus.
bind = ALT, Return, exec, /usr/local/bin/foot --config=/usr/share/kandelo/foot/foot.ini /usr/bin/bash -i
bind = ALT, C, exec, /usr/local/bin/wlclock
bind = ALT, P, exec, /usr/local/bin/wlpaint

# Preserve the names Quickshell registers over hyprland-global-shortcuts.
# Letter chords avoid browser/host Space/Escape shortcut combinations.
# Theme uses Y: Alt+Shift+T focuses Chrome's toolbar. These defaults still
# require actual OS/browser qualification; users can customize this config.
bind = ALT, G, global, quickshell:launcher
bind = ALT, M, global, quickshell:menu
bind = ALT, X, global, quickshell:lock
bind = ALT SHIFT, Y, theme, next

# Window management: J/K follows the other browser desktops' focus keys.
bind = ALT SHIFT, Q, killactive
bind = ALT, J, cyclenext
bind = ALT, K, cycleprev

# Workspaces and moving the focused window.
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9

# Letter directions avoid the host's Alt+arrow navigation shortcuts.
bind = ALT SHIFT, H, swapwindow, l
bind = ALT SHIFT, J, swapwindow, d
bind = ALT SHIFT, K, swapwindow, u
bind = ALT SHIFT, L, swapwindow, r

# Application clipboard, as Omarchy binds it (default/hypr/bindings/clipboard.lua):
# SUPER+C/V send the focused window its own copy/paste shortcut, choosing
# Ctrl+Shift+C/V for a window tagged `terminal` and Ctrl+C/V for any other.
# The tag rule is Omarchy's (default/hypr/apps/terminals.lua). Omarchy picks
# the chord in Lua; kandelo:sendshortcutiftag is wlcompositor's stand-in for that.
# WHY: these Super/Cmd bindings express application editing, not desktop
# navigation. Keep them and the CUA/terminal Ctrl chords when changing the
# desktop modifier; otherwise copy/paste or terminal SIGINT/readline regresses.
# On macOS these fire from Cmd+A/C/V/X: Cmd reaches the desktop as SUPER.
windowrule = tag +terminal, class:(Alacritty|kitty|com.mitchellh.ghostty|foot|org\.codeberg\.dnkl\.foot|wezterm|org\.omarchy\..*|TUI\..*)
bind = SUPER, A, sendshortcut, CTRL, A,
bind = SUPER, C, kandelo:sendshortcutiftag, terminal, CTRL SHIFT, C, CTRL, C
bind = SUPER, V, kandelo:sendshortcutiftag, terminal, CTRL SHIFT, V, CTRL, V
bind = SUPER, X, sendshortcut, CTRL, X,
# Only paste is mirrored on CTRL, for browsers that keep SUPER. It costs a
# terminal its literal-next key (^V). A CTRL+C mirror would turn Ctrl+C into
# Ctrl+Shift+C in terminals and take SIGINT away; CTRL+A and CTRL+X mirrors
# would take readline and editor keys.
bind = CTRL, V, kandelo:sendshortcutiftag, terminal, CTRL SHIFT, V, CTRL, V
# The CUA chords Linux and Windows users expect, routed the same way:
# Shift+Insert pastes and Ctrl+Insert copies (the clipboard, not PRIMARY,
# which a terminal's own Shift+Insert would paste).
bind = SHIFT, Insert, kandelo:sendshortcutiftag, terminal, CTRL SHIFT, V, CTRL, V
bind = CTRL, Insert, kandelo:sendshortcutiftag, terminal, CTRL SHIFT, C, CTRL, C
