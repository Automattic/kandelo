# Kandelo wlcompositor — the Omarchy-shaped desktop.
theme = tokyo-night
notify = /usr/local/bin/notify-send

# Applications.
bind = SUPER, Return, exec, /usr/local/bin/foot --config=/usr/share/kandelo/foot/foot.ini /usr/bin/bash -i
bind = CTRL, Return, exec, /usr/local/bin/foot --config=/usr/share/kandelo/foot/foot.ini /usr/bin/bash -i
bind = SUPER, K, exec, /usr/local/bin/wlclock
bind = CTRL, K, exec, /usr/local/bin/wlclock
bind = SUPER, P, exec, /usr/local/bin/wlpaint
bind = CTRL, P, exec, /usr/local/bin/wlpaint

# The shell's shortcuts, registered by Quickshell over
# hyprland-global-shortcuts: the launcher on Omarchy's SUPER+Space, the menu
# on SUPER+ALT+Space, the lock screen on SUPER+Escape.
bind = SUPER, space, global, quickshell:launcher
bind = CTRL, space, global, quickshell:launcher
bind = SUPER ALT, space, global, quickshell:menu
bind = CTRL ALT, space, global, quickshell:menu
bind = SUPER, Escape, global, quickshell:lock
bind = CTRL, Escape, global, quickshell:lock

# Window management.
bind = SUPER, W, killactive
bind = CTRL, W, killactive
# CTRL+W shadows the terminal's word-erase; CTRL+SHIFT+W closes too and
# collides with nothing a terminal uses.
bind = CTRL SHIFT, W, killactive
bind = SUPER, J, cyclenext
bind = CTRL, J, cyclenext
bind = SUPER SHIFT, J, cycleprev
bind = CTRL SHIFT, J, cycleprev

# Theme cycling, on Omarchy's SUPER+CTRL+SHIFT+Space.
bind = SUPER CTRL SHIFT, space, theme, next
bind = CTRL SHIFT, space, theme, next

# Workspaces.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9, workspace, 9
# Move the focused window to a workspace (Omarchy's SUPER+SHIFT+1..9).
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9
# Swap the focused window with its neighbour (Omarchy's SUPER+SHIFT+arrows).
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d
bind = CTRL SHIFT, left, swapwindow, l
bind = CTRL SHIFT, right, swapwindow, r
bind = CTRL SHIFT, up, swapwindow, u
bind = CTRL SHIFT, down, swapwindow, d
