kind = "program"
name = "less"
version = "668"
kernel_abi = 7
# ncurses: real termcap implementation (libtinfow.a) with xterm-256color/
# xterm/vt100/dumb entries compiled in, so less can do full-screen paging
# instead of falling back to a dumb-teletype stub. See build-less.sh.
depends_on = ["ncurses@6.5"]

[source]
url = "https://www.greenwoodsoftware.com/less/less-668.tar.gz"
sha256 = "2819f55564d86d542abbecafd82ff61e819a3eec967faa36cd3e68f1596a44b8"
provider = "archive"

[license]
spdx = "GPL-3.0-or-later"
url = "https://www.greenwoodsoftware.com/less/LICENSE"

[build]
script_path = "packages/registry/less/build-less.sh"

[[outputs]]
name = "less"
wasm = "less.wasm"
