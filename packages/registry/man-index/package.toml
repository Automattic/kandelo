# mandoc.db, the index `apropos`, `whatis` and `man -k` search and that `man`
# consults before searching directories. It covers every page the shell's
# docs packages ship (the shell includes it only when it selects all of
# them). It is built by makewhatis from mandoc compiled for the build host
# from the same pinned mandoc source the shell's mandoc comes from, so the
# index format is the one the guest reads.
[source]
url = "https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz"
sha256 = "8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c"
provider = "archive"

[license]
spdx = "ISC"
url = "https://mandoc.bsd.lv/"

[build]
script_path = "packages/registry/man-index/build-man-index.sh"

[[outputs]]
name = "man-index"
wasm = "man-index.db"
fork_instrumentation = "disabled"
