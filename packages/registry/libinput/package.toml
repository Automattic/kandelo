# Per-library manifest for libinput. See docs/package-management.md.
#
# libinput 1.28.1 (libinput.a) turns `/dev/input/event*` streams into
# pointer, keyboard, touch, tablet and gesture events on an
# epoll+timerfd event loop. Built through upstream's meson build with the
# SDK cross file, with both seat backends: udev (libudev-zero, which
# enumerates and watches devices through /sys and the uevent netlink
# socket) and path. No libwacom, tools, tests or docs. pkg-config name
# `libinput`.

kind = "library"

name = "libinput"
version = "1.28.1"
kernel_abi = 47
depends_on = ["libevdev@1.13.3", "libudev-zero@1.0.5", "mtdev@1.1.7"]

[[host_tools]]
name = "meson"
version_constraint = ">=1.4.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

# Packs the device-quirks data into its declared zip.
[[host_tools]]
name = "python3"
version_constraint = ">=3.11"
probe = { args = ["--version"], version_regex = "Python (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

# Applies patches/*.patch.
[[host_tools]]
name = "patch"
version_constraint = ">=2.7"
probe = { args = ["--version"], version_regex = "patch (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[source]
# The gitlab auto-archive is behind an Anubis JS-PoW wall that curl cannot
# clear; the Ubuntu `orig` tarball is the byte-identical tree (sha256
# matches the gitlab archive) and its pool mirror is durable.
url = "http://archive.ubuntu.com/ubuntu/pool/main/libi/libinput/libinput_1.28.1.orig.tar.gz"
sha256 = "a13f8c9a7d93df3c85c66afd135f0296701d8d32f911991b7aa4273fdd6a42a3"
provider = "archive"

[license]
spdx = "MIT"
url = "https://gitlab.freedesktop.org/libinput/libinput/-/blob/1.28.1/COPYING"

[build]
script_path = "packages/registry/libinput/build-libinput.sh"

[outputs]
libs = ["lib/libinput.a"]
headers = ["include/libinput.h"]
pkgconfig = ["lib/pkgconfig/libinput.pc"]
# quirks/*.quirks packed as one zip; consumers unpack it at /usr/share/libinput.
files = ["share/libinput-quirks.zip"]
