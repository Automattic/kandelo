kind = "program"
name = "frankenphp-classic"
version = "1.11.0"
kernel_abi = 48
arches = ["wasm32"]
depends_on = ["php-zts@8.3.15", "zlib@1.3.1", "openssl@3.3.2", "sqlite@3.49.1", "libxml2@2.13.8", "libiconv@1.17", "libzip@1.11.4", "libcurl@8.11.1", "icu@74.2", "libcxx@21.1.7"]

[source]
url = "https://github.com/dunglas/frankenphp/archive/refs/tags/v1.11.0.tar.gz"
sha256 = "18ec919af5bfdd65a1224c7e8bbf46b00412c5357cd96663fcf73b61c002e1ff"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/dunglas/frankenphp/blob/main/LICENSE"

[build]
script_path = "packages/registry/frankenphp-classic/build-frankenphp-classic.sh"

[[outputs]]
name = "frankenphp-classic"
wasm = "frankenphp-classic.wasm"
fork_instrumentation = "auto"

[[host_tools]]
name = "go"
version_constraint = ">=1.25.6"
probe = { args = ["version"], version_regex = "go version go(\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
