kind = "program"
name = "frankenphp-classic"
version = "1.13.5"
kernel_abi = 55
arches = ["wasm32"]
depends_on = ["go-bootstrap-source@1.26.10", "php-zts@8.5.12", "zlib@1.3.1", "openssl@3.3.2", "sqlite@3.49.1", "libxml2@2.13.8", "libiconv@1.17", "libzip@1.11.4", "libcurl@8.11.1", "icu@74.2", "libcxx@21.1.7"]

[source]
url = "https://github.com/dunglas/frankenphp/archive/refs/tags/v1.13.5.tar.gz"
sha256 = "c853ae46bfa87a355a8dd3f18e25fb7e986a9fbff4b0ae70139b7fe6662f4a83"
provider = "archive"

[license]
spdx = "MIT"
url = "https://github.com/dunglas/frankenphp/blob/main/LICENSE"

[build]
script_path = "packages/registry/frankenphp-classic/build-frankenphp-classic.sh"

[[outputs]]
name = "frankenphp-classic"
wasm = "frankenphp-classic.wasm"
fork_instrumentation = "auto"

[[host_tools]]
name = "go"
version_constraint = ">=1.25.6"
probe = { args = ["version"], version_regex = "go version go(\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
