kind = "program"
name = "mandoc-docs"
version = "1.14.6"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `mandoc` package (man, mandoc).
# The source, SHA-256 and version are the `mandoc` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz"
sha256 = "8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c"
provider = "archive"

[license]
spdx = "ISC"
url = "https://mandoc.bsd.lv/"

[build]
toolchain = "none"
script_path = "packages/registry/mandoc-docs/build-mandoc-docs.sh"

[[outputs]]
name = "mandoc-docs"
wasm = "mandoc-docs.zip"
fork_instrumentation = "disabled"
