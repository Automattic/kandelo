script_path = "packages/registry/libcxx/build-libcxx.sh"
inputs = [
    "packages/registry/libcxx/build-libcxx.sh",
    "sdk/cmake/Platform/Kandelo.cmake",
    "flake.nix",
    "flake.lock",
]
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "UNPUBLISHED"
# Revision 4: libcxx + libcxxabi + libunwind rebuilt with
# `-mllvm -wasm-use-legacy-eh=false` explicitly set.
# Revision 5: libcxx builds only from flake.nix's exact Nix LLVM
# source derivations, hard-fails on compiler/source version drift, and
# installs headers from the build tree so the header set cannot drift
# from the built library.
# Revision 6: additionally emits position-independent libc++-pic.a /
# libc++abi-pic.a (a second -fPIC build) so wasm side modules like PHP's
# intl.so can statically absorb libc++. The non-PIC pair is unchanged.
# Revision 7: map the worktree (including the assembled LLVM source and both
# build variants) to a stable producer path so archives do not retain the
# caller's absolute checkout directory.
# Revision 8: configure as CMAKE_SYSTEM_NAME=Kandelo (sdk/cmake/Platform/
# Kandelo.cmake, a Unix) instead of Generic, so libc++abi builds
# cxa_thread_atexit.cpp and thread_local destructors run; seed
# LIBCXXABI_HAS_CXA_THREAD_ATEXIT_IMPL=OFF (musl has no _impl).
revision    = 8
