kind = "program"
name = "php-docs"
version = "8.5.12"
kernel_abi = 55
depends_on = []

# Upstream manual pages for the `php` package (php).
# The source, SHA-256 and version are the `php` package's own, so the
# pages describe the release that built the installed binary;
# tests/package-system/package-docs-source-parity.test.ts keeps them equal.
[source]
url = "https://www.php.net/distributions/php-8.5.12.tar.gz"
sha256 = "81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525"
provider = "archive"

[license]
spdx = "PHP-3.01"
url = "https://github.com/php/php-src/blob/master/LICENSE"

[build]
toolchain = "none"
script_path = "packages/registry/php-docs/build-php-docs.sh"

[[outputs]]
name = "php-docs"
wasm = "php-docs.zip"
fork_instrumentation = "disabled"
