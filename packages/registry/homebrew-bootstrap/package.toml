kind = "program"
name = "homebrew-bootstrap"
version = "6.0.4-3-gd6c1be4"
kernel_abi = 41
arches = ["wasm32"]
depends_on = ["ruby@4.0.5"]

# The portable recipe identifies Homebrew's immutable upstream archive. The
# Kandelo project build additionally consumes the same commit through a sealed
# [[git_inputs]] checkout so source preparation never depends on ambient Git
# state or a second network fetch.
[source]
url = "https://github.com/Homebrew/brew/archive/d6c1be418446eec7de09fc72441ba4462282a142.tar.gz"
sha256 = "d3a38612b71eba6ab297a67c06b367829b96250fef48bc0a5088e832a659fc5c"

[license]
spdx = "BSD-2-Clause AND GPL-2.0-or-later"
url = "https://github.com/Automattic/kandelo/blob/main/homebrew/patches/README.md"

[build]
script_path = "packages/registry/homebrew-bootstrap/build-homebrew-bootstrap.sh"

[[outputs]]
name = "homebrew-bootstrap"
wasm = "homebrew-bootstrap.zip"
fork_instrumentation = "disabled"

# Keep the launcher policy in the same atomic package publication as the
# source tree. Consumers must not recreate the bottle tag or precedence rules.
[[outputs]]
name = "homebrew-brew"
wasm = "homebrew-brew.env"
fork_instrumentation = "disabled"

# Homebrew normally downloads this versioned tree through `vendor-install`.
# Kandelo publishes the source-matched Ruby dependency in the same support
# package so first-use activation can expose the stock upstream layout without
# a network bootstrap or a system-Ruby compatibility path.
[[outputs]]
name = "homebrew-portable-ruby"
wasm = "homebrew-portable-ruby.zip"
fork_instrumentation = "disabled"

[[host_tools]]
name = "git"
version_constraint = ">=2.30"
probe = { args = ["--version"], version_regex = "git version (\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "node"
version_constraint = ">=20.0"
probe = { args = ["--version"], version_regex = "v(\\d+\\.\\d+(?:\\.\\d+)?)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "unzip"
version_constraint = ">=6.0"
probe = { args = ["-v"], version_regex = "UnZip ([0-9]+\\.[0-9]+)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }

[[host_tools]]
name = "zip"
version_constraint = ">=3.0"
probe = { args = ["-v"], version_regex = "Zip ([0-9]+\\.[0-9]+)" }
install_hints = { darwin = "run through scripts/dev-shell.sh", linux = "run through scripts/dev-shell.sh" }
