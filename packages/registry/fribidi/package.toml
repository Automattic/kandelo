kind = "library"

# Unicode bidi algorithm (libfribidi.a). Ported as pango's bidi
# dependency (plan
# docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4,
# PR23).
name = "fribidi"
version = "1.0.16"
