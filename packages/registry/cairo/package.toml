# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# 2D renderer (libcairo.a + libcairo-gobject.a). Ported for pango and
# GTK3 (plan docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md
# §4, PR23/PR24). Built through upstream's meson build (1.18 is
# meson-only) with the SDK cross file. Scope per plan: image surfaces
# with freetype/fontconfig fonts and png I/O; no X. The pdf/ps/svg
# surfaces are on for GTK3. cairo-gobject (GType boxing for cairo types)
# is enabled for GTK3. librsvg requires >= 1.18.
name = "cairo"
version = "1.18.6"
kernel_abi = 17
depends_on = [
  "pixman@0.42.2",
  "freetype@2.13.3",
  "fontconfig@2.15.0",
  "libpng@1.6.43",
  "glib@2.84.4",
  "zlib@1.3.1",
]

[[host_tools]]
name = "meson"
version_constraint = ">=1.3.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

[source]
url = "https://www.cairographics.org/releases/cairo-1.18.6.tar.xz"
sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4"
provider = "archive"

[license]
spdx = "LGPL-2.1-only OR MPL-1.1"
url = "https://gitlab.freedesktop.org/cairo/cairo/-/blob/1.18.6/COPYING"

[build]
script_path = "packages/registry/cairo/build-cairo.sh"

[outputs]
libs = ["lib/libcairo.a", "lib/libcairo-gobject.a"]
headers = ["include/cairo"]
pkgconfig = ["lib/pkgconfig/cairo.pc", "lib/pkgconfig/cairo-gobject.pc"]
