# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# 2D renderer (libcairo.a + libcairo-gobject.a). Ported for pango and
# GTK3 (plan docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md
# §4, PR23/PR24). 1.16.0 is the last autotools release (1.18 is
# meson-only). Scope per plan: image surfaces only — freetype/fontconfig
# fonts and png I/O; no GL, no X, no vector backends (pdf/ps/svg/script).
# cairo-gobject (GType boxing for cairo types) is enabled for GTK3.
name = "cairo"
version = "1.16.0"
kernel_abi = 17
depends_on = [
  "pixman@0.42.2",
  "freetype@2.13.3",
  "fontconfig@2.15.0",
  "libpng@1.6.43",
  "glib@2.84.4",
  "zlib@1.3.1",
]

[source]
url = "https://www.cairographics.org/releases/cairo-1.16.0.tar.xz"
sha256 = "5e7b29b3f113ef870d1e3ecf8adf21f923396401604bda16d44be45e66052331"

[license]
spdx = "LGPL-2.1-only OR MPL-1.1"
url = "https://gitlab.freedesktop.org/cairo/cairo/-/blob/1.16.0/COPYING"

[build]
script_path = "packages/registry/cairo/build-cairo.sh"

[outputs]
libs = ["lib/libcairo.a", "lib/libcairo-gobject.a"]
headers = ["include/cairo"]
pkgconfig = ["lib/pkgconfig/cairo.pc", "lib/pkgconfig/cairo-gobject.pc"]
