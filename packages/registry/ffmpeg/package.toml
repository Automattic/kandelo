kind = "program"
name = "ffmpeg"
version = "9.0"
# Upstream FFmpeg built as real ffmpeg/ffprobe/ffplay Kandelo processes.
# The port is a platform campaign: gaps it exposes are fixed in Kandelo,
# not patched around here. See docs/plans/2026-09-26-ffmpeg-port-design.md.
kernel_abi = 43
depends_on = [
  "zlib@1.3.1",
  "sdl2@2.32.10",
  "libiconv@1.17",
  "libxml2@2.13.8",
  # SDL2's static link closure: its Wayland video backend calls
  # libwayland-{client,egl,cursor} and libxkbcommon, and libwayland-client
  # marshals through libffi. sdl2.pc names them with -l only.
  "libwayland@1.24.0",
  "libxkbcommon@1.7.0",
  "libffi@0.1.0",
]
arches = ["wasm32"]

# Release tarball, signed by the FFmpeg release signing key
# FCF986EA15E6E293A5644F10B4322F04D67658D8.
[source]
url = "https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz"
sha256 = "7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52"
provider = "archive"

[license]
spdx = "LGPL-2.1-or-later"
url = "https://git.ffmpeg.org/gitweb/ffmpeg.git/blob/refs/tags/n9.0:/LICENSE.md"

[build]
script_path = "packages/registry/ffmpeg/build-ffmpeg.sh"

[[outputs]]
name = "ffmpeg"
wasm = "ffmpeg.wasm"

[[outputs]]
name = "ffprobe"
wasm = "ffprobe.wasm"

# ffplay links SDL2, which can fork, so the default `auto` policy
# instruments it; ffmpeg and ffprobe import no fork entry point.
[[outputs]]
name = "ffplay"
wasm = "ffplay.wasm"
fork_instrumentation = "auto"
