script_path = "packages/registry/pango/build-pango.sh"
repo_url    = "https://github.com/Automattic/kandelo.git"
commit      = "b87f313b3"
revision    = 1

# The fetched `pango-src/` tree is gitignored; the resolver hashes these
# tracked inputs on a clean checkout.
inputs = [
  "packages/registry/pango/build-pango.sh",
  "packages/registry/pango/src/wasm-callback-arity.patch",
]

[binary]
index_url = "https://github.com/Automattic/kandelo/releases/download/binaries-abi-v{abi}/index.toml"
