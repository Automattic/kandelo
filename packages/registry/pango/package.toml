# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.

kind = "library"

# Text layout (libpango-1.0.a, libpangoft2-1.0.a, libpangocairo-1.0.a).
# Ported for the PR23 render stack and GTK3 (plan
# docs/plans/2026-07-14-build-hyprland-class-compositor-plan.md §4).
# Built through upstream's meson build with the SDK cross file; shapes
# through harfbuzz and runs bidi through fribidi. librsvg requires
# >= 1.50. 1.56 is the newest series whose floors (glib >= 2.82,
# harfbuzz >= 8.4, fontconfig >= 2.15, cairo >= 1.18) the registry
# meets; 1.58 would also need glib/harfbuzz/fontconfig upgrades.
name = "pango"
version = "1.56.4"
kernel_abi = 17
depends_on = [
  "glib@2.84.4",
  "harfbuzz@10.1.0",
  "fribidi@1.0.16",
  "cairo@1.18.6",
  "fontconfig@2.15.0",
  "freetype@2.13.3",
]

[[host_tools]]
name = "meson"
version_constraint = ">=1.2.0"
install_hints = { darwin = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.meson); enter scripts/dev-shell.sh" }

[[host_tools]]
name = "ninja"
version_constraint = ">=1.8"
install_hints = { darwin = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.ninja); enter scripts/dev-shell.sh" }

[source]
url = "https://download.gnome.org/sources/pango/1.56/pango-1.56.4.tar.xz"
sha256 = "17065e2fcc5f5a5bdbffc884c956bfc7c451a96e8c4fb2f8ad837c6413cb5a01"
provider = "archive"

[license]
spdx = "LGPL-2.0-or-later"
url = "https://gitlab.gnome.org/GNOME/pango/-/blob/1.56.4/COPYING"

[build]
script_path = "packages/registry/pango/build-pango.sh"

[outputs]
libs = [
  "lib/libpango-1.0.a",
  "lib/libpangoft2-1.0.a",
  "lib/libpangocairo-1.0.a",
]
headers = ["include/pango-1.0"]
pkgconfig = [
  "lib/pkgconfig/pango.pc",
  "lib/pkgconfig/pangoft2.pc",
  "lib/pkgconfig/pangocairo.pc",
]
