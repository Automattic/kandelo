# Per-library manifest consumed by `cargo xtask build-deps`.
# Schema: see docs/package-management.md.
#
# Qt 6 QtQml, QtQmlModels and QtQuick, static, for wasm32. Stage 3 of
# the Qt stack Omarchy v4 needs: Quickshell is a QtQuick client, and
# this is the QML engine and scenegraph it runs on.
#
# QtQuick renders through its software scenegraph adaptation here — the
# kernel's GL command stream replays onto WebGL2, which only the browser
# host has, and a renderer only one host can run would break dual-host
# parity. The software adaptation rasterises on the CPU into the same
# wl_shm pools qtgallery paints through, on both hosts. qml-network is off
# because qtbase carries no QtNetwork.
kind = "library"

name = "qtdeclarative"
version = "6.10.2"
kernel_abi = 44
depends_on = [
  "qtbase@6.10.2",
  "qtshadertools@6.10.2",
  "libcxx@21.1.7",
  "zlib@1.3.1",
  "freetype@2.13.3",
  "fontconfig@2.15.0",
  "harfbuzz@10.1.0",
  "libpng@1.6.43",
  "libxkbcommon@1.7.0",
  "libwayland@1.24.0",
]

[source]
url = "https://download.qt.io/archive/qt/6.10/6.10.2/submodules/qtdeclarative-everywhere-src-6.10.2.tar.xz"
sha256 = "a249914ff66cdcdbf0df8b5ffad997a2ee6dce01cc17d43c6cc56fdc1d0f4b0f"
provider = "archive"

[license]
spdx = "LGPL-3.0-only"
url = "https://code.qt.io/cgit/qt/qtdeclarative.git/tree/LICENSES/LGPL-3.0-only.txt?h=v6.10.2"

[build]
script_path = "packages/registry/qtdeclarative/build-qtdeclarative.sh"

# The cross-build runs moc, qmltyperegistrar and qmlcachegen from
# QT_HOST_PATH (flake.nix joins nixpkgs' qtbase and qtdeclarative into
# one host prefix). qmake identifies the host Qt; the version must
# match the target exactly, and the build script rejects any mismatch.
[[host_tools]]
name = "qmake"
version_constraint = ">=6.10.2"
probe = { args = ["-query", "QT_VERSION"], version_regex = "(\\d+\\.\\d+\\.\\d+)" }
install_hints = { darwin = "provided by flake.nix (pkgs.qt6.qtbase); enter scripts/dev-shell.sh", linux = "provided by flake.nix (pkgs.qt6.qtbase); enter scripts/dev-shell.sh" }

[outputs]
libs = [
  "lib/libQt6Qml.a",
  "lib/libQt6QmlModels.a",
  "lib/libQt6Quick.a",
]
headers = [
  "include/QtQml",
  "include/QtQmlModels",
  "include/QtQuick",
]
