schema = 1
id = "fixture-shell"
architecture = "wasm32"
output = "fixture-shell.vfs.zst"
builder = "images/vfs/scripts/build-shell-vfs-image.sh"

[[composition.repository]]
id = "shell-config"
paths = ["packages/registry/shell/source-rootfs-shell-demo.json"]
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "dash"
outputs = ["dash"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[software.archive]]
id = "fixture-source"
url = "https://example.invalid/fixture.tar.gz"
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
role = "runtime"
materialization = "embedded"

[[software.toolchain]]
id = "clang-headers"
provider = "repository-dev-shell"
component = "clang-resource-headers"
role = "build"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["dash", "-l"]
cwd = "/home/user"
uid = 1000
gid = 1000

[boot.env]
HOME = "/home/user"
PATH = "/usr/bin:/bin"

[evidence.node]
test = "fixture-shell-startup"
