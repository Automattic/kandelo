schema = 1
id = "mini-tools"
architecture = "wasm32"
output = "mini-tools.vfs"
builder = "images/vfs/scripts/build-abi-staging-mini-vfs.ts"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = ["tool"]
materialization = "lazy"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[boot]
argv = ["/usr/bin/tool"]
cwd = "/"
uid = 0
gid = 0

[boot.env]
PATH = "/usr/bin"

[evidence.node]
test = "mini-tools-node"
