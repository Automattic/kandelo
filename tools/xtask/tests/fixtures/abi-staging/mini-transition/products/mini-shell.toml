schema = 1
id = "mini-shell"
architecture = "wasm32"
output = "mini-shell.vfs"
builder = "images/vfs/scripts/build-abi-staging-mini-vfs.ts"

[[composition.product]]
id = "mini-tools"
materialization = "lazy"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = ["base"]
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[boot]
argv = ["/usr/bin/base"]
cwd = "/"
uid = 0
gid = 0

[boot.env]
PATH = "/usr/bin"

[evidence.node]
test = "mini-shell-node"

[evidence.browser]
test = "mini-shell-browser"
