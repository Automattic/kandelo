# Base VFS package composition.
#
# Entries here are turned into a generated mkrootfs manifest fragment by
# scripts/generate-rootfs-package-manifest.mjs and included by
# scripts/build-rootfs.sh. Package outputs default to lazy files: rootfs.vfs.zst
# stores an executable stub plus URL/size metadata, and the real Wasm is fetched
# on first exec by hosts that run programs from the VFS.

default_install = "lazy"

# Runtime URL prefix for lazy files. The generator resolves binary sizes from
# local-binaries/ first and binaries/ second, but the image metadata should name
# the release/deployment URL. Hosts with a different deployment layout can
# rewrite lazy file URLs after awaiting restoreVerifiedVfsImage().
lazy_url_prefix = "binaries/"

[[packages]]
name = "login"
install = "eager"

[[packages.outputs]]
binary = "programs/wasm32/login.wasm"
path = "/bin/login"
mode = "4755"
uid = 0
gid = 0

[[packages]]
name = "sudo-lite"

[[packages.outputs]]
binary = "programs/wasm32/sudo-lite.wasm"
path = "/usr/bin/sudo-lite"
mode = "4755"
uid = 0
gid = 0

[[packages]]
name = "sudo"

[[packages.outputs]]
binary = "programs/wasm32/sudo/sudo.wasm"
path = "/usr/bin/sudo"
mode = "4755"
uid = 0
gid = 0

[[packages]]
name = "bash"

[[packages.outputs]]
binary = "programs/wasm32/bash.wasm"
path = "/bin/bash"
# bash is /bin/sh in every Kandelo image, and the interactive login shell.
# /bin/sh is what system(), popen() and a `#!/bin/sh` script exec, so it must
# resolve to the same shell everywhere; bash honors POSIX mode when invoked as
# `sh`. The image builders bind it through one helper,
# installBashAsPosixShell in images/vfs/scripts/vfs-image-helpers.ts. Some
# images also ship dash as an ordinary command at its own name; no other shell
# claims /bin/sh.
aliases = ["/bin/sh"]

