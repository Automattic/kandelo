# Kandelo system log. See syslog.conf(5).
#
# Everything at info and above goes to one file. Kandelo has no mail, cron or
# news daemons to separate out, and `*.emerg *` is left out deliberately:
# writing to every logged-in terminal needs utmp, which would fail rather than
# warn. The `-` prefix means "do not sync after every line".
*.info			-/var/log/messages

# /var/log is durable on a saved computer and capped (VAR_LOG_BYTE_LIMIT in
# crates/runtime-core/src/rootfs.rs), so the daemon bounds the files it owns.
# Without this one noisy service would spend the whole budget and the cap
# would then refuse writes for everything.
rotate_size	256k
rotate_count	5
