schema = 1
id = "test-php"
architecture = "wasm32"
output = "php-test.vfs.zst"
builder = "images/vfs/scripts/build-php-test-vfs-image.sh"

[[composition.product]]
id = "platform-rootfs"
materialization = "embedded"

[[composition.repository]]
id = "php-test-fixtures"
paths = ["tests/php-fixtures"]
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "php"
outputs = [
  "php", "php-fpm", "opcache", "curl", "phar", "zend_test", "zip",
  "intl", "icu-data",
]
source_roles = ["test-suite"]
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/bin/sh"]
cwd = "/php-src"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TMPDIR = "/tmp"

[evidence.node]
test = "php-suite-node"

[evidence.browser]
test = "php-suite-browser"
