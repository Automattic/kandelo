schema = 1
id = "test-sqlite"
architecture = "wasm32"
output = "sqlite-test.vfs.zst"
builder = "images/vfs/scripts/build-sqlite-test-vfs-image.sh"

[[software.package]]
name = "sqlite"
outputs = ["sqlite3", "testfixture"]
source_roles = ["full-source"]
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "tcl"
outputs = []
source_roles = ["runtime-library"]
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "dash"
outputs = ["dash"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "coreutils"
outputs = ["coreutils"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/bin/sh"]
cwd = "/sqlite"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
PATH = "/usr/local/bin:/usr/bin:/bin"
TCL_LIBRARY = "/usr/lib/tcl8.6"
TMPDIR = "/tmp"

[evidence.node]
test = "sqlite-suite-node"

[evidence.browser]
test = "sqlite-suite-browser"
