schema = 1
id = "browser-erlang"
architecture = "wasm32"
output = "erlang.vfs.zst"
builder = "images/vfs/scripts/build-erlang-vfs-image.sh"

[[software.package]]
name = "erlang"
outputs = ["erlang", "erlang-otp"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = [
  "/usr/lib/erlang/erts-16.1.2/bin/beam.smp",
  "--",
  "-root", "/usr/lib/erlang",
  "-bindir", "/usr/lib/erlang/erts-16.1.2/bin",
  "-boot", "/usr/lib/erlang/releases/28/start_clean",
  "-noshell",
]
cwd = "/home/maker"
uid = 1000
gid = 1000

[boot.env]
BINDIR = "/usr/lib/erlang/erts-16.1.2/bin"
HOME = "/home/maker"
PATH = "/usr/lib/erlang/erts-16.1.2/bin:/usr/local/bin:/usr/bin:/bin"
ROOTDIR = "/usr/lib/erlang"
TMPDIR = "/tmp"

[evidence.node]
test = "erlang-vfs-node-smoke"

[evidence.browser]
test = "erlang-vfs-browser-smoke"
