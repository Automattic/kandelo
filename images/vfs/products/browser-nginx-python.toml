schema = 1
id = "browser-nginx-python"
architecture = "wasm32"
output = "nginx-python-vfs.vfs.zst"
builder = "images/vfs/scripts/build-nginx-python-vfs-image.sh"

[[composition.product]]
id = "browser-main-shell"
materialization = "embedded"

[[software.package]]
name = "nginx"
outputs = ["nginx"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "cpython"
outputs = ["cpython", "python-runtime"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[software.package]]
name = "dinit"
outputs = ["dinit", "dinitctl"]
source_roles = []
role = "runtime"
materialization = "embedded"

# Build-only: the CPython bytecode prewarm boots the kernel on the Node host
# to compile the stdlib to .pyc before the image is saved (see
# images/vfs/scripts/python-bytecode-prewarm.ts). Sets WASM_POSIX_DEP_KERNEL_DIR.
[[software.toolchain]]
id = "kernel-wasm"
provider = "prepared-runtime"
component = "kernel-wasm"
role = "build"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/sbin/dinit", "--container", "-p", "/tmp/dinitctl", "nginx"]
cwd = "/root"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
LOGNAME = "root"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
PYTHONHOME = "/usr"
PYTHONDONTWRITEBYTECODE = "1"
TMPDIR = "/tmp"
USER = "root"

[evidence.node]
test = "nginx-python-vfs-node-startup"

[evidence.browser]
test = "nginx-python-vfs-browser-startup"
