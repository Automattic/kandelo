schema = 1
id = "browser-lamp"
architecture = "wasm32"
output = "lamp.vfs.zst"
builder = "images/vfs/scripts/build-lamp-vfs-image.sh"

[[composition.product]]
id = "browser-main-shell"
materialization = "embedded"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = ["nginx", "php", "mariadb", "dinit", "msmtpd"]
materialization = "embedded"

[[software.toolchain]]
id = "kernel-wasm"
provider = "prepared-runtime"
component = "kernel-wasm"
role = "build"

[[software.archive]]
id = "wordpress-core"
url = "https://wordpress.org/wordpress-7.0.tar.gz"
sha256 = "530c8fdeb16fb0affdb53eb727b6a04bb8d166621c20029e389cabb01a0fa921"
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/opt/kandelo/homebrew/sbin/dinit", "--container", "-p", "/tmp/dinitctl", "nginx"]
cwd = "/root"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
LOGNAME = "root"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TMPDIR = "/tmp"
USER = "root"
WP_APP_PATH = "/app"
WP_PROTO = "http"

[evidence.node]
test = "wordpress-mariadb-node-startup"

[evidence.browser]
test = "wordpress-mariadb-browser-e2e"
