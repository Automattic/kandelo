schema = 1
id = "platform-rootfs"
architecture = "wasm32"
output = "rootfs.vfs"
builder = "packages/registry/rootfs/build-rootfs-package.sh"

[[composition.repository]]
id = "rootfs-source"
paths = ["MANIFEST", "images/rootfs"]
role = "runtime"
materialization = "embedded"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = ["bash"]
materialization = "embedded"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = [
  "dash", "ncurses", "coreutils", "gawk", "grep", "sed", "bc",
  "file-formula", "m4", "make", "findutils", "diffutils", "posix-utils-lite",
]
materialization = "lazy"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/bin/sh"]
cwd = "/root"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TMPDIR = "/tmp"

[evidence.node]
test = "rootfs-node-startup"

[evidence.browser]
test = "rootfs-browser-startup"
