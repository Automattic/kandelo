schema = 1
id = "platform-rootfs"
architecture = "wasm32"
output = "rootfs.vfs"
builder = "packages/registry/rootfs/build-rootfs-package.sh"

[[software.package]]
name = "rootfs"
outputs = ["rootfs"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/usr/bin/login", "-p", "-f", "maker"]
cwd = "/home/maker"
uid = 0
gid = 0

[boot.env]
HOME = "/home/maker"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TMPDIR = "/tmp"

[evidence.node]
test = "rootfs-node-startup"

[evidence.browser]
test = "rootfs-browser-startup"
