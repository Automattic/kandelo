schema = 1
id = "browser-nginx"
architecture = "wasm32"
output = "nginx.vfs.zst"
builder = "images/vfs/scripts/build-nginx-vfs-image.sh"

[[composition.product]]
id = "browser-main-shell"
materialization = "embedded"

[[software.homebrew]]
tap = "kandelo-dev/homebrew-tap-core"
formulae = ["nginx", "dinit"]
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/opt/kandelo/homebrew/sbin/dinit", "--container", "-p", "/tmp/dinitctl", "nginx"]
cwd = "/root"
uid = 0
gid = 0

[boot.env]
HOME = "/root"
LOGNAME = "root"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
TMPDIR = "/tmp"
USER = "root"

[evidence.node]
test = "nginx-vfs-node-startup"

[evidence.browser]
test = "nginx-vfs-browser-startup"
