schema = 1
id = "browser-node"
architecture = "wasm32"
output = "node-vfs.vfs.zst"
builder = "images/vfs/scripts/build-node-vfs-image.sh"

[[composition.product]]
id = "browser-main-shell"
materialization = "embedded"

[[software.package]]
name = "node"
outputs = ["node"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[software.archive]]
id = "npm-runtime"
url = "https://registry.npmjs.org/npm/-/npm-10.9.2.tgz"
sha256 = "5cd1e5ab971ea6333f910bc2d50700167c5ef4e66da279b2a3efc874c6b116e4"
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/usr/bin/login", "-p", "-f", "maker"]
cwd = "/home/maker"
uid = 0
gid = 0

[boot.env]
HISTFILE = "/home/maker/.bash_history"
HOME = "/home/maker"
LANG = "en_US.UTF-8"
LOGNAME = "maker"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_PROGRESS = "false"
NPM_CONFIG_UPDATE_NOTIFIER = "false"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
PS1 = "spidermonkey-node$ "
SSL_CERT_DIR = "/etc/ssl/certs"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
TERM = "xterm-256color"
TMPDIR = "/tmp"
USER = "maker"
npm_config_audit = "false"
npm_config_cache = "/tmp/.npm-cache"
npm_config_fund = "false"
npm_config_progress = "false"
npm_config_registry = "https://registry.npmjs.org/"
npm_config_update_notifier = "false"

[evidence.node]
test = "node-vfs-node-startup"

[evidence.browser]
test = "node-vfs-browser-startup"
