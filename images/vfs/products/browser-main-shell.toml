schema = 1
id = "browser-main-shell"
architecture = "wasm32"
output = "shell.vfs.zst"
builder = "packages/registry/shell/build-shell.sh"

[[software.package]]
name = "shell"
outputs = ["shell"]
source_roles = []
role = "runtime"
materialization = "embedded"

[[mounts]]
path = "/"
source = "built-image"
readonly = false

[[mounts]]
path = "/tmp"
source = "scratch"
mode = "1777"
uid = 0
gid = 0
ephemeral = true

[boot]
argv = ["/usr/bin/login", "-p", "-f", "maker"]
cwd = "/home/maker"
uid = 0
gid = 0

[boot.env]
HOME = "/home/maker"
HISTFILE = "/home/maker/.bash_history"
LANG = "en_US.UTF-8"
LOGNAME = "maker"
PATH = "/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin"
PS1 = "kandelo$ "
SSL_CERT_DIR = "/etc/ssl/certs"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
TERM = "xterm-256color"
TMPDIR = "/tmp"
USER = "maker"

[evidence.node]
test = "main-shell-startup"

[evidence.browser]
test = "main-shell-basic-e2e"
