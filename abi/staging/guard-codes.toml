schema = 1
kind = "kandelo-abi-staging-guard-codes"
version = 1

[[guards]]
code = "abi_structure_changed_without_bump"
default_disposition = "fail-check"
override_policy = "never"
recovery_policy = "none"
summary = "The structural ABI changed without the required version bump and snapshot update."

[[guards]]
code = "build_failed"
default_disposition = "record-no-candidate"
override_policy = "never"
recovery_policy = "rebuild"
summary = "The deterministic package or product build ended in an application failure."

[[guards]]
code = "build_input_capture_incomplete"
default_disposition = "fail-before-build"
override_policy = "exact-subject-build-risk"
recovery_policy = "none"
summary = "The exact subject has build inputs that protected planning could not capture completely."

[[guards]]
code = "build_timeout"
default_disposition = "record-timeout"
override_policy = "never"
recovery_policy = "retry-policy"
summary = "The package or product build exceeded its protected timeout."

[[guards]]
code = "candidate_integrity_mismatch"
default_disposition = "reject-candidate"
override_policy = "never"
recovery_policy = "none"
summary = "Candidate bytes, sizes, descriptors, or immutable identities do not agree."

[[guards]]
code = "candidate_public_readback_failed"
default_disposition = "mark-ineligible"
override_policy = "never"
recovery_policy = "none"
summary = "Anonymous readback did not reproduce the exact published candidate identity."

[[guards]]
code = "dependency_unavailable"
default_disposition = "block-dependants"
override_policy = "never"
recovery_policy = "resolve-dependency"
summary = "A selected subject cannot proceed until an exact required dependency becomes usable."

[[guards]]
code = "namespace_bootstrap_failed"
default_disposition = "block-publication"
override_policy = "never"
recovery_policy = "repair-namespace"
summary = "The ABI namespace could not be created or verified with its required protection and public identity."

[[guards]]
code = "pages_product_incomplete"
default_disposition = "hold-last-complete-site"
override_policy = "never"
recovery_policy = "none"
summary = "The complete Pages product set is not ready for one atomic deployment."

[[guards]]
code = "policy_version_unknown"
default_disposition = "reject-interpretation"
override_policy = "never"
recovery_policy = "none"
summary = "The protected consumer does not implement the record's policy or guard-registry version."

[[guards]]
code = "request_invalid"
default_disposition = "reject-request"
override_policy = "never"
recovery_policy = "none"
summary = "The request bytes, filename, schema, or exact identities are invalid."

[[guards]]
code = "request_unauthorized"
default_disposition = "reject-request"
override_policy = "never"
recovery_policy = "none"
summary = "The exact request source lacks the required protected authorization."

[[guards]]
code = "source_custody_mismatch"
default_disposition = "reject-candidate-or-admission"
override_policy = "never"
recovery_policy = "none"
summary = "Captured source history or custody evidence does not match the candidate or admission."

[[guards]]
code = "source_identity_mismatch"
default_disposition = "reject-build-or-publication"
override_policy = "never"
recovery_policy = "none"
summary = "An exact source, manifest, input, output, or artifact identity does not match."

[[guards]]
code = "tap_source_drift"
default_disposition = "replan-affected-formula"
override_policy = "never"
recovery_policy = "replan-rebuild"
summary = "The protected tap source changed after the exact build contract was planned."

[[guards]]
code = "transient_infrastructure_failure"
default_disposition = "schedule-retry"
override_policy = "never"
recovery_policy = "manual-retry-after-exhaustion"
summary = "A classified runner, artifact-service, registry, or transport failure interrupted execution."

[[guards]]
code = "verification_failed"
default_disposition = "mark-ineligible"
override_policy = "exact-artifact"
recovery_policy = "none"
summary = "The exact candidate failed a protected registered verification definition."

[[guards]]
code = "verification_timeout"
default_disposition = "mark-ineligible"
override_policy = "exact-artifact"
recovery_policy = "retry-policy"
summary = "Verification of the exact candidate exceeded its protected timeout."
