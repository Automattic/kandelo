schema = 1
kind = "kandelo-vfs-evidence-definitions"
version = 1

[[definitions]]
id = "rootfs-node-startup"
host = "node"
runner = "exec"
timeout_seconds = 120

[definitions.probe]
argv = ["/bin/sh", "-c", "printf 'rootfs-ready\\n'"]
lazy_inputs = ["package-dash-output-dash"]
stdout_exact = "rootfs-ready\n"

[[definitions]]
id = "rootfs-browser-startup"
