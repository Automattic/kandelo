<!doctype html>
<meta charset="utf-8">
<title>VALIDATE_STATUS of a program without a linked executable</title>
<pre id="result">Running</pre>
<script>
// Standalone WebGL 2 with GLSL ES 1.00 shaders. No Kandelo code.
//
// OpenGL ES glValidateProgram (WebGL 2 follows ES 3.0): validation checks
// whether the program's executables can execute in the current state; TRUE
// guarantees that the program executes. A program whose link failed, or that
// was never linked, has no executable and cannot execute, so its
// VALIDATE_STATUS must be FALSE.
//
// control: a program that links validates TRUE.
// test:    a program whose fragment shader failed to compile (link fails),
//          and a program that was never linked, both after validateProgram.
try {
  const gl = document.createElement('canvas').getContext('webgl2');
  if (!gl) throw Error('WebGL2 unavailable');
  const vertex = 'attribute vec4 a; void main() { gl_Position = a; }';
  const good = 'precision mediump float; void main() { gl_FragColor = vec4(1.0); }';
  const bad = 'precision mediump float; void main() { gl_FragColor = vec4(1.0) not glsl; }';
  function run(fragment) {
    const program = gl.createProgram(), out = {};
    for (const [type, source, key] of [[gl.VERTEX_SHADER, vertex, 'vertex'], [gl.FRAGMENT_SHADER, fragment, 'fragment']]) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source); gl.compileShader(shader);
      out[key + 'Compiled'] = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
      gl.attachShader(program, shader);
    }
    gl.linkProgram(program);
    out.linked = gl.getProgramParameter(program, gl.LINK_STATUS);
    gl.validateProgram(program);
    out.validated = gl.getProgramParameter(program, gl.VALIDATE_STATUS);
    out.error = gl.getError();
    return out;
  }
  const control = run(good), test = run(bad);
  const never = gl.createProgram();
  gl.validateProgram(never);
  const neverLinked = { validated: gl.getProgramParameter(never, gl.VALIDATE_STATUS), error: gl.getError() };
  const sane = control.linked === true && control.validated === true && test.fragmentCompiled === false && test.linked === false;
  const verdict = !sane ? 'inconclusive' : test.validated !== false || neverLinked.validated !== false ? 'reproduced' : 'not-reproduced';
  window.__reproVerdict = { verdict, details: JSON.stringify({ control, test, neverLinked, renderer: gl.getParameter(gl.RENDERER) }) };
} catch (error) {
  window.__reproVerdict = { verdict: 'inconclusive', details: JSON.stringify({ error: String(error) }) };
}
document.querySelector('#result').textContent = JSON.stringify(window.__reproVerdict, null, 2);
</script>
