<!doctype html>
<meta charset="utf-8">
<title>Growing a shared WebAssembly.Memory while a worker whose instance imports it is torn down</title>
<pre id="out"></pre>
<script>
// Standalone reproduction; nothing here comes from Kandelo. Serve this
// directory cross-origin isolated:
//   Cross-Origin-Opener-Policy: same-origin
//   Cross-Origin-Embedder-Policy: require-corp
// and open repro.html. The verdict is written to window.__reproVerdict and
// printed on the page.
//
// Question: can one worker grow a shared WebAssembly.Memory while another
// dedicated worker, whose WebAssembly.Instance objects import that memory,
// is being terminated?
//
// Each cycle:
//   1. the page creates a shared memory (initial 1 page);
//   2. "victim" workers each instantiate a few Wasm instances that import
//      the memory, then report ready;
//   3. the page hands the memory to a long-lived "grower" worker and, at the
//      same moment, terminates the victims;
//   4. the grower calls memory.grow(1) until the memory reaches its
//      maximum, so grows run while the victims' VMs are destroyed.
//
// A grow that adds pages visits every instance importing the memory to
// update its cached base and size. If an instance belongs to a worker whose
// VM is being destroyed, that visit can happen after the instance's memory
// object was already destroyed but before the instance itself is.
//
// The defect is a crash of the page's (web content) process, which the page
// cannot report: run it with crash_is_reproduced = true. If the page
// survives every cycle it reports not-reproduced. Sanity check: the run is
// only meaningful if many grows and many victim teardowns actually
// happened; otherwise the verdict is inconclusive.
//
// Query parameters (defaults are the reproduction):
//   mode=terminate|close|gc  how victim instances die: the page calls
//                            terminate(); the victim calls close() itself;
//                            or (gc) victims are long-lived and drop their
//                            instances to the garbage collector
//   grow=js|wasm             the grower uses memory.grow() from JS, or the
//                            Wasm memory.grow instruction
//   delta=1                  pages per grow. delta=0 asks whether a
//                            zero-page grow alone is enough: the grower
//                            receives the memory and waits; a second
//                            "bumper" worker then grows it to its maximum
//                            and finishes; only then are the victims
//                            terminated while the grower makes 100000
//                            zero-page grows on its now-stale view.
//                            (Not expected to crash: a zero-page grow
//                            returns before visiting instances.)
//   maximum=64               memory maximum, in 64 KiB pages
//   victims=4                victim workers per cycle
//   instances=8              instances per victim worker
//   seconds=60               run length
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') ?? 'terminate';
const GROW = params.get('grow') ?? 'js';
const DELTA = Number(params.get('delta') ?? '1');
const MAXIMUM = Number(params.get('maximum') ?? '64');
const VICTIMS = Number(params.get('victims') ?? '4');
const INSTANCES = Number(params.get('instances') ?? '8');
const SECONDS = Number(params.get('seconds') ?? '60');
const MIN_GROWS = 10000;
const MIN_TEARDOWNS = 100;

const out = document.getElementById('out');
const log = (line) => { out.textContent += line + '\n'; };
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// (module (import "env" "memory" (memory 1 65536 shared))
//   (func (export "grow") (param i32) (result i32)
//     (memory.grow (local.get 0))))
const wasmBytes = new Uint8Array([0, 0x61, 0x73, 0x6d, 1, 0, 0, 0,
  1, 6, 1, 0x60, 1, 0x7f, 1, 0x7f,
  2, 0x12, 1, 3, 0x65, 0x6e, 0x76, 6, 0x6d, 0x65, 0x6d, 0x6f, 0x72, 0x79, 2, 3, 1, 0x80, 0x80, 4,
  3, 2, 1, 0,
  7, 8, 1, 4, 0x67, 0x72, 0x6f, 0x77, 0, 0,
  0x0a, 8, 1, 6, 0, 0x20, 0, 0x40, 0, 0x0b]);

// Long-lived. For each memory it receives, grows it until grow fails (the
// memory is at its maximum) or, for zero-page grows, `count` times.
function growerMain() {
  onmessage = ({ data }) => {
    const { memory, module, how, delta, count, gate } = data;
    const grow = how === 'wasm'
      ? new WebAssembly.Instance(module, { env: { memory } }).exports.grow
      : (d) => memory.grow(d);
    const before = memory.buffer.byteLength;
    if (gate) {
      postMessage('armed');
      const flag = new Int32Array(gate);
      while (Atomics.load(flag, 0) === 0);
    }
    let grows = 0;
    let after = -1;
    for (let i = 0; delta !== 0 || i < count; i++) {
      let ok;
      try { ok = grow(delta) >= 0; } catch { ok = false; }
      if (!ok) break;
      grows++;
      if (after < 0) after = memory.buffer.byteLength;
    }
    postMessage({ grows, before, after });
  };
}

// terminate/close mode: one memory, instantiate, report ready (and, in close
// mode, close() when told to die). gc mode: long-lived; builds instances on
// each new memory, then drops them and allocates garbage on 'drop'.
function victimMain() {
  let keep = null;
  onmessage = ({ data }) => {
    if (data.cmd === 'build') {
      const { memory, module, instances } = data;
      keep = [];
      for (let i = 0; i < instances; i++) keep.push(new WebAssembly.Instance(module, { env: { memory } }));
      postMessage('ready');
    } else if (data.cmd === 'die') {
      close();
    } else if (data.cmd === 'drop') {
      keep = null;
      let junk = [];
      for (let i = 0; i < 200000; i++) junk.push({ i, s: 'x' + i });
      junk = null;
      postMessage('dropped');
    }
  };
}

const blobUrl = (fn) => URL.createObjectURL(new Blob([`(${fn})();`], { type: 'text/javascript' }));
const growerUrl = blobUrl(growerMain);
const victimUrl = blobUrl(victimMain);

function nextMessage(worker, timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(`worker sent nothing in ${timeoutMs} ms`)), timeoutMs);
    worker.onmessage = ({ data }) => { clearTimeout(timer); resolve(data); };
    worker.onerror = (event) => { clearTimeout(timer); reject(new Error(`worker error: ${event.message}`)); };
  });
}

async function main() {
  if (typeof SharedArrayBuffer === 'undefined' || !crossOriginIsolated) {
    return { verdict: 'inconclusive', details: 'page is not cross-origin isolated; shared memory unavailable' };
  }
  const module = await WebAssembly.compile(wasmBytes);
  const config = `mode=${MODE} grow=${GROW} delta=${DELTA} maximum=${MAXIMUM} victims=${VICTIMS} instances=${INSTANCES} seconds=${SECONDS}`;
  log(config);

  let grower = new Worker(growerUrl);
  const longLived = MODE === 'gc'
    ? Array.from({ length: VICTIMS }, () => new Worker(victimUrl))
    : [];
  const deadline = performance.now() + SECONDS * 1000;
  let grows = 0;
  let bumperGrows = 0;
  let staleRefreshes = 0;
  let bumper = DELTA === 0 ? new Worker(growerUrl) : null;
  let teardowns = 0;
  let cycles = 0;
  let allocationRetries = 0;
  while (performance.now() < deadline) {
    // Old memories stay reserved until every isolate that saw them collects
    // them, and the grower allocates almost nothing, so it rarely collects.
    // V8 (Chromium) then runs out of address space for new shared memories.
    // Replacing the grower now and then releases its references; an
    // allocation failure is retried after doing so. Neither changes what
    // each cycle does.
    const recycle = () => {
      grower.terminate(); grower = new Worker(growerUrl);
      if (bumper) { bumper.terminate(); bumper = new Worker(growerUrl); }
    };
    if (cycles > 0 && cycles % 32 === 0) recycle();
    let memory;
    for (let attempt = 0; !memory; attempt++) {
      try {
        memory = new WebAssembly.Memory({ initial: 1, maximum: MAXIMUM, shared: true });
      } catch (error) {
        if (!(error instanceof RangeError) || attempt >= 20) throw error;
        allocationRetries++;
        recycle();
        await sleep(250);
      }
    }
    const victims = MODE === 'gc' ? longLived : Array.from({ length: VICTIMS }, () => new Worker(victimUrl));
    const ready = victims.map((v) => nextMessage(v));
    for (const v of victims) v.postMessage({ cmd: 'build', memory, module, instances: INSTANCES });
    await Promise.all(ready);

    let gate = null;
    if (bumper) {
      gate = new Int32Array(new SharedArrayBuffer(4));
      const armed = nextMessage(grower);
      grower.postMessage({ memory, module, how: GROW, delta: 0, count: 100000, gate: gate.buffer });
      await armed;
      const bumped = nextMessage(bumper);
      bumper.postMessage({ memory, module, how: 'wasm', delta: 1 });
      bumperGrows += (await bumped).grows;
    }
    const grown = nextMessage(grower);
    if (!bumper) grower.postMessage({ memory, module, how: GROW, delta: DELTA });
    let dropped = [];
    if (MODE === 'terminate') for (const v of victims) v.terminate();
    else if (MODE === 'close') for (const v of victims) v.postMessage({ cmd: 'die' });
    else {
      dropped = victims.map((v) => nextMessage(v));
      for (const v of victims) v.postMessage({ cmd: 'drop' });
    }
    if (gate) Atomics.store(gate, 0, 1);
    const result = await grown;
    grows += result.grows;
    if (gate && result.after > result.before) staleRefreshes++;
    await Promise.all(dropped);
    teardowns += victims.length;
    cycles++;
    if (cycles % 20 === 0) log(`cycle ${cycles}: grows ${grows}, victims torn down ${teardowns}`);
  }
  grower.terminate();
  if (bumper) bumper.terminate();
  for (const v of longLived) v.terminate();

  const summary = `${config}; cycles ${cycles}, grower grows ${grows}, bumper grows ${bumperGrows}, ` +
    `cycles where the grower saw the bumper growth ${staleRefreshes}, ` +
    `memory allocation retries ${allocationRetries}, ` +
    `${MODE === 'gc' ? 'instance batches dropped' : 'victim workers torn down'} ${teardowns}`;
  if (grows < MIN_GROWS || teardowns < MIN_TEARDOWNS) {
    return { verdict: 'inconclusive', details: `sanity check failed (need >= ${MIN_GROWS} grows and >= ${MIN_TEARDOWNS} teardowns): ${summary}` };
  }
  return { verdict: 'not-reproduced', details: `page survived: ${summary}` };
}

main().then(
  (verdict) => { window.__reproVerdict = verdict; log(`${verdict.verdict}: ${verdict.details}`); },
  (error) => { window.__reproVerdict = { verdict: 'inconclusive', details: `repro failed: ${error}` }; log(String(error)); },
);
</script>
