name: Publish Kandelo bottles

on:
  repository_dispatch:
    types: [publish-kandelo-bottles]

jobs:
  publish:
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@main
    with:
      kandelo-repository: Automattic/kandelo
      kandelo-ref: ${{ github.event.client_payload.kandelo_sha }}
      tap-repository: kandelo-dev/homebrew-tap-core
      tap-name: kandelo-dev/tap-core
      tap-ref: ${{ github.event.client_payload.tap_sha }}
      formulae: ${{ github.event.client_payload.formulae }}
      arches: ${{ github.event.client_payload.arches || 'wasm32' }}
      release-tag: ${{ github.event.client_payload.release_tag || '' }}
      expected-cache-keys: ${{ github.event.client_payload.expected_cache_keys || '' }}
      package-generation-wasm32: ${{ github.event.client_payload.package_generation_wasm32 }}
      package-generation-wasm64: ${{ github.event.client_payload.package_generation_wasm64 }}
      force: ${{ github.event.client_payload.force || false }}
      # A deferred run still builds, uploads, and verifies one bottle, but
      # leaves the final Formula/selection commit to a reviewed tap change.
      defer-tap-finalization: ${{ github.event.client_payload.defer_tap_finalization || false }}
      # WHY: dependency-bearing acceptance is a production publication gate.
      # The dry-run caller intentionally keeps the reusable workflow's false
      # default because it cannot publish the bottles that acceptance consumes.
      require-vfs-acceptance: ${{ github.event.client_payload.require_vfs_acceptance || false }}
      dry-run: false
