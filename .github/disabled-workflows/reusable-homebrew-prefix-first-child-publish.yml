name: DISABLED - Reusable Homebrew prefix first-child publish

on:
  workflow_call:
    inputs:
      kandelo-repository:
        type: string
        required: true
      kandelo-ref:
        type: string
        required: true
      tap-repository:
        type: string
        required: true
      tap-name:
        type: string
        required: true
      tap-ref:
        type: string
        required: true
      formula:
        type: string
        required: true
      arch:
        type: string
        required: true
      release-tag:
        type: string
        required: true
      prefix-campaign-tag:
        type: string
        required: true
      prefix-campaign-dependencies:
        type: string
        required: true

# WHY: GHCR cannot atomically create a package only when it is absent. Every
# supported writer for one Formula shares this lock until anonymous readback
# proves either the newly uploaded child or an exact read-only resumption.
concurrency:
  group: kandelo-homebrew-ghcr-${{ inputs.formula }}
  cancel-in-progress: false

jobs:
  first-child:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Validate exact prefix-campaign caller
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          CALLER_ACTION: ${{ github.event.action }}
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CAMPAIGN_DEPENDENCIES: >-
            ${{ inputs.prefix-campaign-dependencies }}
          CAMPAIGN_TAG: ${{ inputs.prefix-campaign-tag }}
          FORMULA: ${{ inputs.formula }}
          KANDELO_REPOSITORY: ${{ inputs.kandelo-repository }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TAP_NAME: ${{ inputs.tap-name }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          normalized_caller="$(printf '%s' "$CALLER_REPOSITORY" |
            tr '[:upper:]' '[:lower:]')"
          normalized_tap="$(printf '%s' "$TAP_REPOSITORY" |
            tr '[:upper:]' '[:lower:]')"
          [ "$normalized_caller" = kandelo-dev/homebrew-tap-core ] &&
            [ "$normalized_tap" = kandelo-dev/homebrew-tap-core ] &&
            [ "$TAP_NAME" = kandelo-dev/tap-core ] || {
            echo "::error::first-child publication is restricted to the protected Kandelo tap"
            exit 2
          }
          [ "$KANDELO_REPOSITORY" = Automattic/kandelo ] || {
            echo "::error::first-child publication requires Automattic/kandelo"
            exit 2
          }
          [ "$CALLER_REF" = refs/heads/main ] &&
            [ "$CALLER_EVENT_NAME" = repository_dispatch ] &&
            [ "$CALLER_ACTION" = publish-prefix-campaign-bottle ] || {
            echo "::error::first-child publication requires its reviewed dispatch"
            exit 2
          }
          expected_workflow="$CALLER_REPOSITORY/.github/workflows/"
          expected_workflow+="prefix-campaign-bottles.yml@refs/heads/main"
          [ "$CALLER_WORKFLOW_REF" = "$expected_workflow" ] || {
            echo "::error::first-child publication requires its reviewed caller"
            exit 2
          }
          [[ "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$KANDELO_REF" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$TAP_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::first-child publication requires exact source commits"
            exit 2
          }
          [[ "$FORMULA" =~ ^[a-z0-9][a-z0-9._-]{0,254}$ ]] || {
            echo "::error::first-child publication Formula is invalid"
            exit 2
          }
          case "$ARCH" in
            wasm32|wasm64) ;;
            *) echo "::error::first-child publication architecture is invalid"; exit 2 ;;
          esac
          [[ "$RELEASE_TAG" =~ ^bottles-abi-v[1-9][0-9]*$ ]] || {
            echo "::error::first-child publication release tag is invalid"
            exit 2
          }
          [[ "$CAMPAIGN_TAG" =~ ^homebrew-prefix-campaign-sha256-[0-9a-f]{64}$ ]] &&
            [[ "${CAMPAIGN_TAG##*-}" =~ [1-9a-f] ]] || {
            echo "::error::first-child publication campaign tag is invalid"
            exit 2
          }
          normalized_dependencies="$(jq -ceS '
            select(
              type == "object" and
              keys == ["dependencies", "schema"] and .schema == 1 and
              (.dependencies | type == "array" and length <= 256) and
              (.dependencies == (.dependencies | sort_by(.formula))) and
              ([.dependencies[].formula] | length == (unique | length)) and
              all(.dependencies[];
                keys == ["formula", "tag"] and
                (.formula | test("^[a-z0-9][a-z0-9._-]{0,254}$")) and
                (.tag | test("^homebrew-prefix-handoff-sha256-[0-9a-f]{64}$"))))
          ' <<<"$CAMPAIGN_DEPENDENCIES")" || {
            echo "::error::first-child campaign dependencies are invalid"
            exit 2
          }
          [ "$normalized_dependencies" = "$CAMPAIGN_DEPENDENCIES" ] || {
            echo "::error::first-child campaign dependencies are not canonical"
            exit 2
          }

      - name: Checkout exact Kandelo bootstrap source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          path: kandelo
          submodules: false

      - name: Checkout exact campaign tap source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: Kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-ref }}
          path: tap
          fetch-depth: 0

      - name: Admit protected source history
        shell: bash
        env:
          CALLER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          [ "$(git -C kandelo rev-parse HEAD)" = "$KANDELO_REF" ] &&
            [ "$(git -C tap rev-parse HEAD)" = "$TAP_REF" ] || {
            echo "::error::first-child checkout differs from reviewed source"
            exit 2
          }
          bash kandelo/.github/scripts/require-repository-main-contains.sh \
            --repository Automattic/kandelo --source-sha "$KANDELO_REF"
          bash kandelo/.github/scripts/require-repository-main-contains.sh \
            --repository Kandelo-dev/homebrew-tap-core \
            --source-sha "$TAP_REF"
          bash kandelo/.github/scripts/require-repository-main-contains.sh \
            --repository Kandelo-dev/homebrew-tap-core \
            --source-sha "$CALLER_SHA"

      - name: Verify exact source snapshots
        shell: bash
        run: |
          set -euo pipefail
          [ -z "$(git -C kandelo status --short --untracked-files=all)" ] &&
            [ -z "$(git -C tap status --short --untracked-files=all)" ] || {
            echo "::error::first-child source checkout is dirty"
            exit 2
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Warm Kandelo dev shell
        shell: bash
        run: |
          cd kandelo
          bash scripts/dev-shell.sh true

      - name: Materialize sealed bootstrap campaign source
        id: campaign-source
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          CAMPAIGN_DEPENDENCIES: >-
            ${{ inputs.prefix-campaign-dependencies }}
          CAMPAIGN_TAG: ${{ inputs.prefix-campaign-tag }}
          FORMULA: ${{ inputs.formula }}
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_NAME: ${{ inputs.tap-name }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          python3 kandelo/scripts/homebrew-prefix-campaign-publisher.py \
            prepare \
            --tap-root "$GITHUB_WORKSPACE/tap" \
            --kandelo-commit "$KANDELO_REF" \
            --tap-repository "$TAP_REPOSITORY" \
            --tap-name "$TAP_NAME" \
            --source-tap-commit "$TAP_REF" \
            --campaign-tag "$CAMPAIGN_TAG" \
            --dependencies "$CAMPAIGN_DEPENDENCIES" \
            --formula "$FORMULA" \
            --arch "$ARCH" \
            --work-root "$RUNNER_TEMP/prefix-first-child-campaign" \
            --receipt-out "$RUNNER_TEMP/prefix-first-child-campaign.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"
          [ "$(git -C tap status --short --untracked-files=all)" = "" ] || {
            echo "::error::sealed campaign materialization left a dirty tap"
            exit 2
          }
          formula_path="tap/Formula/${FORMULA}.rb"
          [ -f "$formula_path" ] && [ ! -L "$formula_path" ] &&
            [ "$(git -C tap ls-files -s -- "Formula/${FORMULA}.rb" |
              wc -l | tr -d '[:space:]')" = 1 ] &&
            [ "$(git -C tap ls-files -s -- "Formula/${FORMULA}.rb" |
              awk '{print $1}')" = 100644 ] || {
            echo "::error::materialized Formula is not one ordinary Git blob"
            exit 2
          }

      - name: Require reviewed first-package admission and release
        shell: bash
        env:
          ADMISSION_KIND: >-
            ${{ steps.campaign-source.outputs.prefix-campaign-destination-admission-kind }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TAP_NAME: ${{ inputs.tap-name }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
        run: |
          set -euo pipefail
          [ "$ADMISSION_KIND" = \
            first-package-namespace-bootstrap-required ] || {
            echo "::error::campaign did not authorize first-package bootstrap"
            exit 2
          }
          abi="$(sed -nE \
            's/^pub const ABI_VERSION: u32 = ([0-9]+);$/\1/p' \
            kandelo/crates/shared/src/lib.rs | head -n1)"
          [ "$RELEASE_TAG" = "bottles-abi-v${abi}" ] || {
            echo "::error::first-child release tag differs from the Kandelo ABI"
            exit 2
          }
          . kandelo/scripts/homebrew-tap-identity.sh
          bottle_root="$(homebrew_bottle_root_url \
            "$TAP_REPOSITORY" "$TAP_NAME")"
          {
            echo "KANDELO_HOMEBREW_ABI=$abi"
            echo "KANDELO_HOMEBREW_BOTTLE_ROOT_URL=$bottle_root"
          } >>"$GITHUB_ENV"

      - name: Resolve exact dependency tap map
        shell: bash
        env:
          TAP_NAME: ${{ inputs.tap-name }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/homebrew-resolved-taps.json"
          python3 kandelo/scripts/homebrew-dependency-taps.py resolve \
            --tap-root "$GITHUB_WORKSPACE/tap" \
            --tap-name "$TAP_NAME" \
            --tap-repository "$TAP_REPOSITORY" \
            --tap-commit "$TAP_REF" \
            --checkout-commit "$KANDELO_HOMEBREW_PREPARED_TAP_COMMIT" \
            --out "$resolved"
          echo "KANDELO_HOMEBREW_RESOLVED_TAPS_FILE=$resolved" \
            >>"$GITHUB_ENV"

      - name: Admit two exact same-run bootstrap artifacts
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          FORMULA: ${{ inputs.formula }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/prefix-first-child-evidence"
          mkdir -p "$evidence"
          run_json="$evidence/workflow-run.json"
          gh api "/repos/$CALLER_REPOSITORY/actions/runs/$RUN_ID" >"$run_json"
          jq -e \
            --arg repository "$CALLER_REPOSITORY" \
            --arg sha "$CALLER_SHA" \
            --argjson id "$RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" '
              .id == $id and .run_attempt == $attempt and
              (.repository.full_name | ascii_downcase) ==
                ($repository | ascii_downcase) and
              .path == ".github/workflows/prefix-campaign-bottles.yml" and
              .event == "repository_dispatch" and
              .head_branch == "main" and .head_sha == $sha
            ' "$run_json" >/dev/null || {
            echo "::error::bootstrap artifacts are not from this exact reviewed run"
            exit 1
          }
          for kind in homebrew-build-handoff homebrew-oci-child; do
            name="prefix-campaign-bootstrap-dry-run-${kind}-"
            name+="${FORMULA}-${ARCH}-attempt-${RUN_ATTEMPT}"
            artifact_json="$evidence/${kind}.json"
            gh api --method GET \
              "/repos/$CALLER_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              -f name="$name" -f per_page=100 >"$artifact_json"
            jq -e \
              --arg name "$name" --arg sha "$CALLER_SHA" \
              --argjson id "$RUN_ID" '
                .total_count == 1 and (.artifacts | length) == 1 and
                .artifacts[0].name == $name and
                (.artifacts[0].digest |
                  test("^sha256:[0-9a-f]{64}$")) and
                .artifacts[0].expired == false and
                .artifacts[0].workflow_run.id == $id and
                .artifacts[0].workflow_run.head_sha == $sha
              ' "$artifact_json" >/dev/null || {
              echo "::error::bootstrap artifact is absent, expired, or ambiguous: $name"
              exit 1
            }
          done

      - name: Download exact bootstrap build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: >-
            prefix-campaign-bootstrap-dry-run-homebrew-build-handoff-${{ inputs.formula }}-${{ inputs.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homebrew-build-handoff

      - name: Download exact bootstrap OCI child
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: >-
            prefix-campaign-bootstrap-dry-run-homebrew-oci-child-${{ inputs.formula }}-${{ inputs.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homebrew-oci-child

      - name: Validate exact bootstrap data without credentials
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          FORMULA: ${{ inputs.formula }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TAP_NAME: ${{ inputs.tap-name }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          for secret_name in GH_TOKEN GITHUB_TOKEN \
            HOMEBREW_GITHUB_API_TOKEN HOMEBREW_GITHUB_PACKAGES_TOKEN \
            HOMEBREW_DOCKER_REGISTRY_TOKEN; do
            [ -z "${!secret_name:-}" ] || {
              echo "::error::bootstrap validator received $secret_name"
              exit 2
            }
          done
          cd kandelo
          args=(
            --handoff "$RUNNER_TEMP/homebrew-build-handoff"
            --formula "$FORMULA"
            --arch "$ARCH"
            --release-tag "$RELEASE_TAG"
            --tap-repository "$TAP_REPOSITORY"
            --tap-name "$TAP_NAME"
            --tap-commit "$TAP_REF"
            --tap-checkout-commit "$KANDELO_HOMEBREW_PREPARED_TAP_COMMIT"
            --kandelo-commit "$KANDELO_REF"
            --bottle-root-url "$KANDELO_HOMEBREW_BOTTLE_ROOT_URL"
            --forbidden-root "$GITHUB_WORKSPACE"
            --forbidden-root "$(dirname "$GITHUB_WORKSPACE")"
            --forbidden-root "$RUNNER_TEMP"
            --forbidden-root /home/kandelo-homebrew-build
            --prefix-campaign-layout-sha256 \
              "$KANDELO_HOMEBREW_PREFIX_CAMPAIGN_LAYOUT_SHA256"
            --out-env "$RUNNER_TEMP/prefix-first-child-build.env"
          )
          bash scripts/dev-shell.sh env \
            KANDELO_HOMEBREW_RESOLVED_TAPS_FILE="$KANDELO_HOMEBREW_RESOLVED_TAPS_FILE" \
            bash scripts/homebrew-validate-build-handoff.sh "${args[@]}"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/prefix-first-child-build.env"
          bash scripts/dev-shell.sh python3 scripts/homebrew-oci-layout.py \
            validate-child \
            --layout "$RUNNER_TEMP/homebrew-oci-child/layout" \
            --receipt "$RUNNER_TEMP/homebrew-oci-child/receipt.json"
          jq -e \
            --arg formula "$FORMULA" --arg arch "$ARCH" \
            --arg abi "$KANDELO_HOMEBREW_ABI" \
            --arg tap_repository "$TAP_REPOSITORY" \
            --arg tap_name "$TAP_NAME" --arg tap_ref "$TAP_REF" \
            --arg kandelo_ref "$KANDELO_REF" \
            --arg sha "$BOTTLE_SHA256" --arg bytes "$BOTTLE_BYTES" '
              .schema == 2 and .kind == "child" and
              .formula == $formula and .arch == $arch and
              .abi == ($abi | tonumber) and
              (.tap_repository | ascii_downcase) ==
                ($tap_repository | ascii_downcase) and
              .tap_name == $tap_name and .tap_commit == $tap_ref and
              .kandelo_commit == $kandelo_ref and
              .bottle.sha256 == $sha and
              .bottle.bytes == ($bytes | tonumber)
            ' "$RUNNER_TEMP/homebrew-oci-child/receipt.json" >/dev/null

      - name: Classify anonymous exact-child resumption
        id: resume
        shell: bash
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/prefix-first-child-anonymous.json"
          result="$RUNNER_TEMP/prefix-first-child-probe.json"
          printf '{"auths":{}}\n' >"$config"
          reference="$(jq -er '.oci.transport_tag' \
            "$RUNNER_TEMP/homebrew-oci-child/receipt.json")"
          expected="$(jq -er '.oci.manifest.digest' \
            "$RUNNER_TEMP/homebrew-oci-child/receipt.json")"
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py probe-registry \
            --kind manifest \
            --remote "ghcr.io/kandelo-dev/homebrew-tap-core/$FORMULA" \
            --reference "$reference" --registry-config "$config" \
            --out-result "$result"
          status="$(jq -er .status "$result")"
          case "$status" in
            present)
              [ "$(jq -er .digest "$result")" = "$expected" ] || {
                echo "::error::public bootstrap child has a different digest"
                exit 1
              }
              mode=resume
              ;;
            missing|auth-required) mode=bootstrap ;;
            *) echo "::error::anonymous bootstrap probe is unsupported"; exit 1 ;;
          esac
          echo "mode=$mode" >>"$GITHUB_OUTPUT"

      - name: Record exact public child without credentials
        if: ${{ steps.resume.outputs.mode == 'resume' }}
        shell: bash
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prefix-first-child-result"
          cd kandelo
          bash scripts/dev-shell.sh bash scripts/homebrew-ghcr-upload.sh \
            --layout "$RUNNER_TEMP/homebrew-oci-child/layout" \
            --layout-receipt "$RUNNER_TEMP/homebrew-oci-child/receipt.json" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core --formula "$FORMULA" \
            --auth-mode github-token --require-pat false \
            --destination-mode repository-bootstrap \
            --out-json \
              "$RUNNER_TEMP/prefix-first-child-result/receipt.json"

      - name: Publish one absent first child with GITHUB_TOKEN
        if: ${{ steps.resume.outputs.mode == 'bootstrap' }}
        shell: bash
        env:
          FORMULA: ${{ inputs.formula }}
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_REF: ${{ inputs.tap-ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prefix-first-child-result"
          cd kandelo
          # WHY: repository-bootstrap authenticates only after both sealed
          # artifacts and campaign admission have been validated. It writes
          # one child, never an index, sidecar, Formula, or normal handoff.
          bash scripts/dev-shell.sh bash scripts/homebrew-ghcr-upload.sh \
            --layout "$RUNNER_TEMP/homebrew-oci-child/layout" \
            --layout-receipt "$RUNNER_TEMP/homebrew-oci-child/receipt.json" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core --formula "$FORMULA" \
            --kandelo-main-contains-sha "$KANDELO_REF" \
            --target-main-contains-sha "$TAP_REF" \
            --auth-mode github-token --require-pat false \
            --destination-mode repository-bootstrap \
            --out-json \
              "$RUNNER_TEMP/prefix-first-child-result/receipt.json"

      - name: Validate public first-child evidence without credentials
        shell: bash
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/prefix-first-child-result"
          cd kandelo
          bash scripts/dev-shell.sh python3 \
            scripts/homebrew-oci-layout.py validate-publication-receipt \
            --receipt "$result/receipt.json" \
            --layout-receipt \
              "$RUNNER_TEMP/homebrew-oci-child/receipt.json" \
            --kind child --formula "$FORMULA" \
            --tap-repository kandelo-dev/homebrew-tap-core \
            --tap-name kandelo-dev/tap-core
          jq -e '
            .publication.status == "uploaded" or
            .publication.status == "already-present"
          ' "$result/receipt.json" >/dev/null
          evidence="$RUNNER_TEMP/prefix-first-child-evidence"
          cp "$evidence/workflow-run.json" \
            "$result/workflow-run.json"
          mkdir -p "$result/artifacts"
          cp "$evidence/homebrew-build-handoff.json" \
            "$result/artifacts/build.json"
          cp "$evidence/homebrew-oci-child.json" \
            "$result/artifacts/child.json"

      - name: Upload bootstrap-only first-child evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            homebrew-prefix-first-child-${{ inputs.formula }}-${{ inputs.arch }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prefix-first-child-result
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
