name: 💬 Feedback
description: Tell us what you're trying to do with Kandelo and how it's going.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for sharing your experience with Kandelo. Rough notes are fine —
        you don't need to have it all figured out. If you have a specific bug or
        feature request, a blank issue might fit better, but if you're unsure,
        just start here.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do with Kandelo, and what drew you to it?
      description: >
        Tell us what you're building (or hoping to build), who it's for, and
        what made Kandelo appealing for it. The more specific, the better.
      placeholder: >
        e.g. "A no-install Python playground for my students — I didn't want to
        run a server just for a sandbox," or "Running untrusted C programs in
        the browser, because I needed real fork/exec that nothing else offered."
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: How's it going — what worked well, and what got in your way?
      description: >
        The rough edges are the most useful part: where things were confusing,
        slow, missing, or frustrating. And tell us what worked well too, so we
        know what not to break.
      placeholder: >
        e.g. "Booting in the browser just worked, but getting my package to
        build took a lot of trial and error," or "I couldn't tell if a syscall
        was unsupported or I was using it wrong."
    validations:
      required: true
