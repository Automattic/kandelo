name: 💬 Feedback
description: Tell us what you're building with Kandelo, what pulled you in, and what tripped you up.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: >
        Hi! 👋 Thanks for stopping by to tell us about your time with Kandelo —
        genuinely, it makes our day.

        There are no wrong answers here. Half-formed thoughts, wild ideas, and
        grumpy rants are all welcome. If you've got a razor-specific bug or
        feature ask, a blank issue might be comfier — but if you're not sure,
        just start typing. We'd much rather hear from you than not.

  - type: textarea
    id: use-case
    attributes:
      label: What are you building (or dreaming of building) with Kandelo?
      description: >
        Paint us a picture — what are you running, where, and who's it for?
        The messier and more specific, the better.
      placeholder: >
        e.g. "A no-install Python playground so my students can just click and
        code," or "A sandbox for running strangers' C programs without my
        laptop catching fire."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: What pulled you toward Kandelo in the first place?
      description: >
        What were you trying to pull off, and what made "a whole POSIX kernel in
        the browser" sound like the answer? Bonus points if you tell us what you
        tried before.
      placeholder: >
        e.g. "I was tired of babysitting a server just to run a sandbox," or "I
        needed real fork/exec in the browser and nothing else came close."
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: Where did it get annoying, confusing, or slow?
      description: >
        This is the good stuff — tell us where you groaned, got stuck, or nearly
        rage-quit. A package that wouldn't build, a syscall that lied to you,
        docs that hid the answer, a boot that dragged... all of it helps us make
        Kandelo better.
      placeholder: >
        e.g. "Getting my package to build was a guess-and-check nightmare," or
        "Cold boot felt like waiting for coffee," or "I couldn't tell if a
        syscall was missing or I was just holding it wrong."
    validations:
      required: true

  - type: textarea
    id: what-worked
    attributes:
      label: What made you smile? (optional)
      description: >
        Anything that surprised you, delighted you, or that we'd better not
        break — we love hearing this too.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Where were you running it? (optional)
      description: >
        Only if it's handy — browser + version or Node version, your OS, and how
        you fired Kandelo up (a demo, a local build, tucked into your own app).
      placeholder: >
        e.g. "Chrome 141 on macOS 27, running ./run.sh browser from a local
        checkout."
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else on your mind? (optional)
      description: Links, screenshots, hot takes, a haiku — the floor is yours.
    validations:
      required: false
