name: Publish experimental ABI-42 Homebrew VFS

on:
  workflow_dispatch:
    inputs:
      tap-revision:
        description: Exact lowercase 40-character homebrew-tap-core commit
        required: true
        type: string
      selection-path:
        description: Safe relative path to the canonical tap selection
        required: true
        type: string
      selection-sha256:
        description: Exact lowercase SHA-256 of the canonical selection bytes
        required: true
        type: string

jobs:
  build-image:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      vfs_filename: ${{ steps.identify_candidate.outputs.vfs_filename }}
      vfs_sha256: ${{ steps.identify_candidate.outputs.vfs_sha256 }}
      vfs_bytes: ${{ steps.identify_candidate.outputs.vfs_bytes }}
      selection_sha256: ${{ steps.identify_candidate.outputs.selection_sha256 }}
      selection_bytes: ${{ steps.identify_candidate.outputs.selection_bytes }}
      report_sha256: ${{ steps.identify_candidate.outputs.report_sha256 }}
      report_bytes: ${{ steps.identify_candidate.outputs.report_bytes }}
      kernel_sha256: ${{ steps.identify_candidate.outputs.kernel_sha256 }}
      kernel_bytes: ${{ steps.identify_candidate.outputs.kernel_bytes }}
      rootfs_sha256: ${{ steps.identify_candidate.outputs.rootfs_sha256 }}
      rootfs_bytes: ${{ steps.identify_candidate.outputs.rootfs_bytes }}
    steps:
      - name: Checkout exact Kandelo source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize exact musl submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- libc/musl
          expected_musl_sha="$(git rev-parse HEAD:libc/musl)"
          actual_musl_sha="$(git -C libc/musl rev-parse HEAD)"
          test "$actual_musl_sha" = "$expected_musl_sha"
          test -d libc/musl/src

      - name: Checkout exact Homebrew tap source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-revision }}
          path: tap
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/setup-nix

      - name: Build worktree-local wasm32 sysroot
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dev-shell.sh bash scripts/build-musl.sh
          test -f sysroot/lib/libc.a

      - name: Install locked builder dependencies
        run: npm ci

      - name: Validate dispatch and canonical selection
        shell: bash
        env:
          TAP_REVISION: ${{ inputs.tap-revision }}
          SELECTION_PATH: ${{ inputs.selection-path }}
          SELECTION_SHA256: ${{ inputs.selection-sha256 }}
        run: |
          set -euo pipefail
          bash scripts/validate-homebrew-experimental-vfs-selection.sh
          selection_file="$(realpath "tap/$SELECTION_PATH")"
          scripts/dev-shell.sh ./node_modules/.bin/tsx \
            scripts/homebrew-validate-flat-selection.ts \
            --selection "$selection_file" --expected-abi 42

      - name: Build the exact flat VFS candidate
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-candidate
          SELECTION_PATH: ${{ inputs.selection-path }}
        run: |
          set -euo pipefail
          selection_file="$(realpath -e -- "tap/$SELECTION_PATH")"
          mkdir -p "$CANDIDATE_ROOT" "${RUNNER_TEMP}/homebrew-flat-bottle-cache"
          cp -- "$selection_file" "$CANDIDATE_ROOT/homebrew-selection.json"
          vfs_filename="$(jq -er '.requestedVfsFilename | strings' "$selection_file")"
          [[ "$vfs_filename" =~ ^[A-Za-z0-9._-]*experimental[A-Za-z0-9._-]*abi42[A-Za-z0-9._-]*\.vfs\.zst$ ||
             "$vfs_filename" =~ ^[A-Za-z0-9._-]*abi42[A-Za-z0-9._-]*experimental[A-Za-z0-9._-]*\.vfs\.zst$ ]]

          scripts/dev-shell.sh bash build.sh
          scripts/dev-shell.sh env \
            ROOTFS_BINARIES_DIR=binaries \
            ROOTFS_SKIP_PACKAGE_RESOLVE=1 \
            ROOTFS_SEALED_BUILD=1 \
            bash scripts/build-rootfs.sh --default-install eager
          scripts/dev-shell.sh npx tsx \
            images/vfs/scripts/build-homebrew-flat-vfs-image.ts \
            --selection "$selection_file" \
            --base-image host/wasm/rootfs.vfs \
            --bottle-cache "${RUNNER_TEMP}/homebrew-flat-bottle-cache" \
            --shell-config homebrew/main-shell-default.json \
            --out "$CANDIDATE_ROOT/$vfs_filename" \
            --report "$CANDIDATE_ROOT/homebrew-vfs-build-report.json"
          # WHY: preserve the package-owned kernel provenance before the
          # same-run artifact turns the immutable member into a regular file.
          kernel="$(bash scripts/resolve-binary.sh kernel.wasm)"
          kernel_namespace="$(realpath \
            local-binaries/.kandelo-local-generations/wasm32/kernel)"
          kernel_generation="$(dirname "$kernel")"
          kernel_identity="$(dirname "$kernel_generation")"
          kernel_session="$(basename "$kernel_generation")"
          kernel_cache_key="$(basename "$kernel_identity")"
          [ "$(realpath local-binaries/kernel.wasm)" = "$kernel" ]
          [ "$(dirname "$kernel_identity")" = "$kernel_namespace" ]
          [ "$(basename "$kernel")" = kandelo-kernel.wasm ]
          [[ "$kernel_cache_key" =~ ^[0-9a-f]{64}$ ]]
          [[ "$kernel_session" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [ -f "$kernel_identity/.$kernel_session.publication-claimed" ]
          [ ! -L "$kernel_identity/.$kernel_session.publication-claimed" ]
          [ -f "$kernel" ] && [ ! -L "$kernel" ]
          cp -- "$kernel" "$CANDIDATE_ROOT/kernel.wasm"
          # WHY: the browser acceptance module statically imports the ordinary
          # rootfs even though these focused cases boot only the composed VFS.
          # Relay the exact builder input instead of rebuilding or substituting
          # that module dependency on the fresh proof runner.
          [ -f host/wasm/rootfs.vfs ] && [ ! -L host/wasm/rootfs.vfs ]
          cp -- host/wasm/rootfs.vfs "$CANDIDATE_ROOT/rootfs.vfs"

      - name: Identify the exact build candidate
        id: identify_candidate
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-candidate
        run: |
          set -euo pipefail
          vfs_filename="$(jq -er '.requestedVfsFilename | strings' \
            "$CANDIDATE_ROOT/homebrew-selection.json")"
          [[ "$vfs_filename" =~ ^[A-Za-z0-9._-]+\.vfs\.zst$ ]]
          candidate_files=(
            "$vfs_filename"
            homebrew-selection.json
            homebrew-vfs-build-report.json
            kernel.wasm
            rootfs.vfs
          )
          [ "$(find "$CANDIDATE_ROOT" -mindepth 1 -printf '.' | wc -c)" -eq 5 ]
          for candidate_file in "${candidate_files[@]}"; do
            [ -f "$CANDIDATE_ROOT/$candidate_file" ] &&
              [ ! -L "$CANDIDATE_ROOT/$candidate_file" ]
          done

          rootfs_sha256="$(sha256sum "$CANDIDATE_ROOT/rootfs.vfs" | awk '{print $1}')"
          rootfs_bytes="$(stat -c '%s' "$CANDIDATE_ROOT/rootfs.vfs")"
          [ "$(jq -er '.base_image.sha256 | strings' \
            "$CANDIDATE_ROOT/homebrew-vfs-build-report.json")" = \
            "$rootfs_sha256" ]
          [ "$(jq -er '.base_image.bytes | numbers' \
            "$CANDIDATE_ROOT/homebrew-vfs-build-report.json")" = \
            "$rootfs_bytes" ]

          emit_identity() {
            local name="$1" path="$2"
            printf '%s_sha256=%s\n' "$name" \
              "$(sha256sum "$path" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
            printf '%s_bytes=%s\n' "$name" \
              "$(stat -c '%s' "$path")" >>"$GITHUB_OUTPUT"
          }
          printf 'vfs_filename=%s\n' "$vfs_filename" >>"$GITHUB_OUTPUT"
          emit_identity vfs "$CANDIDATE_ROOT/$vfs_filename"
          emit_identity selection "$CANDIDATE_ROOT/homebrew-selection.json"
          emit_identity report "$CANDIDATE_ROOT/homebrew-vfs-build-report.json"
          emit_identity kernel "$CANDIDATE_ROOT/kernel.wasm"
          emit_identity rootfs "$CANDIDATE_ROOT/rootfs.vfs"

      - name: Retain the exact same-run build candidate
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-experimental-vfs-abi42-candidate-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homebrew-experimental-vfs-candidate/${{ steps.identify_candidate.outputs.vfs_filename }}
            ${{ runner.temp }}/homebrew-experimental-vfs-candidate/homebrew-selection.json
            ${{ runner.temp }}/homebrew-experimental-vfs-candidate/homebrew-vfs-build-report.json
            ${{ runner.temp }}/homebrew-experimental-vfs-candidate/kernel.wasm
            ${{ runner.temp }}/homebrew-experimental-vfs-candidate/rootfs.vfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-test:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      vfs_filename: ${{ steps.identify.outputs.vfs_filename }}
      vfs_sha256: ${{ steps.identify.outputs.vfs_sha256 }}
      vfs_bytes: ${{ steps.identify.outputs.vfs_bytes }}
      selection_sha256: ${{ steps.identify.outputs.selection_sha256 }}
      selection_bytes: ${{ steps.identify.outputs.selection_bytes }}
      report_sha256: ${{ steps.identify.outputs.report_sha256 }}
      report_bytes: ${{ steps.identify.outputs.report_bytes }}
    steps:
      - name: Checkout exact Kandelo source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Homebrew tap source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-revision }}
          path: tap
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/setup-nix

      - name: Install locked proof dependencies
        run: |
          npm ci
          npm --prefix apps/browser-demos ci --no-audit --no-fund

      - name: Validate dispatch and canonical selection again
        shell: bash
        env:
          TAP_REVISION: ${{ inputs.tap-revision }}
          SELECTION_PATH: ${{ inputs.selection-path }}
          SELECTION_SHA256: ${{ inputs.selection-sha256 }}
        run: |
          set -euo pipefail
          bash scripts/validate-homebrew-experimental-vfs-selection.sh
          selection_file="$(realpath "tap/$SELECTION_PATH")"
          scripts/dev-shell.sh ./node_modules/.bin/tsx \
            scripts/homebrew-validate-flat-selection.ts \
            --selection "$selection_file" --expected-abi 42

      - name: Install locked Chromium runtime
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Download the exact same-run build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-image.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/homebrew-experimental-vfs-candidate

      - name: Verify and stage the exact build candidate
        shell: bash
        env:
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-assets
          CANDIDATE_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-candidate
          SELECTION_PATH: ${{ inputs.selection-path }}
          VFS_FILENAME: ${{ needs.build-image.outputs.vfs_filename }}
          VFS_SHA256: ${{ needs.build-image.outputs.vfs_sha256 }}
          VFS_BYTES: ${{ needs.build-image.outputs.vfs_bytes }}
          SELECTION_SHA256: ${{ needs.build-image.outputs.selection_sha256 }}
          SELECTION_BYTES: ${{ needs.build-image.outputs.selection_bytes }}
          REPORT_SHA256: ${{ needs.build-image.outputs.report_sha256 }}
          REPORT_BYTES: ${{ needs.build-image.outputs.report_bytes }}
          KERNEL_SHA256: ${{ needs.build-image.outputs.kernel_sha256 }}
          KERNEL_BYTES: ${{ needs.build-image.outputs.kernel_bytes }}
          ROOTFS_SHA256: ${{ needs.build-image.outputs.rootfs_sha256 }}
          ROOTFS_BYTES: ${{ needs.build-image.outputs.rootfs_bytes }}
        run: |
          set -euo pipefail
          [[ "$VFS_FILENAME" =~ ^[A-Za-z0-9._-]+\.vfs\.zst$ ]]
          expected_inventory="$(printf '%s\n' \
            "$VFS_FILENAME" \
            homebrew-selection.json \
            homebrew-vfs-build-report.json \
            kernel.wasm \
            rootfs.vfs | LC_ALL=C sort)"
          actual_inventory="$(find "$CANDIDATE_ROOT" -mindepth 1 \
            -printf '%P\n' | LC_ALL=C sort)"
          [ "$actual_inventory" = "$expected_inventory" ]

          verify_candidate() {
            local name="$1" expected_sha="$2" expected_bytes="$3"
            local path="$CANDIDATE_ROOT/$name"
            [ -f "$path" ] && [ ! -L "$path" ]
            [ "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha" ]
            [ "$(stat -c '%s' "$path")" = "$expected_bytes" ]
          }
          verify_candidate "$VFS_FILENAME" "$VFS_SHA256" "$VFS_BYTES"
          verify_candidate homebrew-selection.json \
            "$SELECTION_SHA256" "$SELECTION_BYTES"
          verify_candidate homebrew-vfs-build-report.json \
            "$REPORT_SHA256" "$REPORT_BYTES"
          verify_candidate kernel.wasm "$KERNEL_SHA256" "$KERNEL_BYTES"
          verify_candidate rootfs.vfs "$ROOTFS_SHA256" "$ROOTFS_BYTES"
          [ "$(jq -er '.base_image.sha256 | strings' \
            "$CANDIDATE_ROOT/homebrew-vfs-build-report.json")" = \
            "$ROOTFS_SHA256" ]
          [ "$(jq -er '.base_image.bytes | numbers' \
            "$CANDIDATE_ROOT/homebrew-vfs-build-report.json")" = \
            "$ROOTFS_BYTES" ]
          cmp -- "$CANDIDATE_ROOT/homebrew-selection.json" \
            "$(realpath -e -- "tap/$SELECTION_PATH")"

          [ ! -e "$ASSET_ROOT" ] && [ ! -L "$ASSET_ROOT" ]
          [ ! -e local-binaries/kernel.wasm ] &&
            [ ! -L local-binaries/kernel.wasm ]
          [ ! -e local-binaries/rootfs.vfs ] &&
            [ ! -L local-binaries/rootfs.vfs ]
          alternate_rootfs_paths=(
            host/wasm/rootfs.vfs
            binaries/rootfs.vfs
            local-binaries/programs/wasm32/rootfs.vfs
            binaries/programs/wasm32/rootfs.vfs
          )
          for alternate_rootfs_path in "${alternate_rootfs_paths[@]}"; do
            [ ! -e "$alternate_rootfs_path" ] &&
              [ ! -L "$alternate_rootfs_path" ]
          done
          mkdir -p "$ASSET_ROOT" local-binaries
          cp -- "$CANDIDATE_ROOT/$VFS_FILENAME" "$ASSET_ROOT/$VFS_FILENAME"
          cp -- "$CANDIDATE_ROOT/homebrew-selection.json" \
            "$ASSET_ROOT/homebrew-selection.json"
          cp -- "$CANDIDATE_ROOT/homebrew-vfs-build-report.json" \
            "$ASSET_ROOT/homebrew-vfs-build-report.json"
          cp -- "$CANDIDATE_ROOT/kernel.wasm" local-binaries/kernel.wasm
          cp -- "$CANDIDATE_ROOT/rootfs.vfs" local-binaries/rootfs.vfs
          [ "$(sha256sum local-binaries/kernel.wasm | awk '{print $1}')" = \
            "$KERNEL_SHA256" ]
          [ "$(stat -c '%s' local-binaries/kernel.wasm)" = "$KERNEL_BYTES" ]
          [ "$(sha256sum local-binaries/rootfs.vfs | awk '{print $1}')" = \
            "$ROOTFS_SHA256" ]
          [ "$(stat -c '%s' local-binaries/rootfs.vfs)" = "$ROOTFS_BYTES" ]

      - name: Prove exact composition startup on a fresh runner
        shell: bash
        env:
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-assets
          TAP_REVISION: ${{ inputs.tap-revision }}
          SELECTION_PATH: ${{ inputs.selection-path }}
        run: |
          set -euo pipefail
          vfs_filename="$(jq -er '.requestedVfsFilename | strings' \
            "$ASSET_ROOT/homebrew-selection.json")"
          scripts/dev-shell.sh npx tsx \
            scripts/homebrew-flat-vfs-node-startup.ts \
            --image "$ASSET_ROOT/$vfs_filename" \
            --selection "$ASSET_ROOT/homebrew-selection.json" \
            --report "$ASSET_ROOT/homebrew-vfs-build-report.json" \
            --kernel local-binaries/kernel.wasm \
            --tap-root tap --tap-revision "$TAP_REVISION"
          scripts/dev-shell.sh env \
            ASSET_ROOT="$ASSET_ROOT" \
            TAP_REVISION="$TAP_REVISION" \
            SELECTION_PATH="$SELECTION_PATH" \
            bash -c \
            "cd apps/browser-demos && npx playwright test \
              test/homebrew-flat-vfs-shipping.spec.ts --project=chromium \
              --grep 'starts.*Ruby'"

      - name: Identify the exact three release assets
        id: identify
        shell: bash
        env:
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-assets
        run: |
          set -euo pipefail
          vfs_filename="$(jq -er '.requestedVfsFilename | strings' \
            "$ASSET_ROOT/homebrew-selection.json")"
          [[ "$vfs_filename" =~ ^[A-Za-z0-9._-]+\.vfs\.zst$ ]]
          assets=(
            "$vfs_filename"
            homebrew-selection.json
            homebrew-vfs-build-report.json
          )
          [ "$(find "$ASSET_ROOT" -mindepth 1 -printf '.' | wc -c)" -eq 3 ]
          for asset in "${assets[@]}"; do
            [ -f "$ASSET_ROOT/$asset" ] && [ ! -L "$ASSET_ROOT/$asset" ]
          done

          emit_identity() {
            local name="$1" path="$2"
            printf '%s_sha256=%s\n' "$name" \
              "$(sha256sum "$path" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
            printf '%s_bytes=%s\n' "$name" \
              "$(stat -c '%s' "$path")" >>"$GITHUB_OUTPUT"
          }
          printf 'vfs_filename=%s\n' "$vfs_filename" >>"$GITHUB_OUTPUT"
          emit_identity vfs "$ASSET_ROOT/$vfs_filename"
          emit_identity selection "$ASSET_ROOT/homebrew-selection.json"
          emit_identity report "$ASSET_ROOT/homebrew-vfs-build-report.json"

      - name: Bind startup-tested bytes to the exact build candidate
        shell: bash
        env:
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-assets
          VFS_FILENAME: ${{ needs.build-image.outputs.vfs_filename }}
          VFS_SHA256: ${{ needs.build-image.outputs.vfs_sha256 }}
          VFS_BYTES: ${{ needs.build-image.outputs.vfs_bytes }}
          SELECTION_SHA256: ${{ needs.build-image.outputs.selection_sha256 }}
          SELECTION_BYTES: ${{ needs.build-image.outputs.selection_bytes }}
          REPORT_SHA256: ${{ needs.build-image.outputs.report_sha256 }}
          REPORT_BYTES: ${{ needs.build-image.outputs.report_bytes }}
          KERNEL_SHA256: ${{ needs.build-image.outputs.kernel_sha256 }}
          KERNEL_BYTES: ${{ needs.build-image.outputs.kernel_bytes }}
          ROOTFS_SHA256: ${{ needs.build-image.outputs.rootfs_sha256 }}
          ROOTFS_BYTES: ${{ needs.build-image.outputs.rootfs_bytes }}
        run: |
          set -euo pipefail
          verify_input() {
            local path="$1" expected_sha="$2" expected_bytes="$3"
            [ -f "$path" ] && [ ! -L "$path" ]
            [ "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha" ]
            [ "$(stat -c '%s' "$path")" = "$expected_bytes" ]
          }
          verify_input "$ASSET_ROOT/$VFS_FILENAME" \
            "$VFS_SHA256" "$VFS_BYTES"
          verify_input "$ASSET_ROOT/homebrew-selection.json" \
            "$SELECTION_SHA256" "$SELECTION_BYTES"
          verify_input "$ASSET_ROOT/homebrew-vfs-build-report.json" \
            "$REPORT_SHA256" "$REPORT_BYTES"
          verify_input local-binaries/kernel.wasm \
            "$KERNEL_SHA256" "$KERNEL_BYTES"
          verify_input local-binaries/rootfs.vfs "$ROOTFS_SHA256" "$ROOTFS_BYTES"
          [ "$(find "$ASSET_ROOT" -mindepth 1 -printf '.' | wc -c)" -eq 3 ]

      - name: Retain the fixed three-file artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-experimental-vfs-abi42
          path: |
            ${{ runner.temp }}/homebrew-experimental-vfs-assets/${{ steps.identify.outputs.vfs_filename }}
            ${{ runner.temp }}/homebrew-experimental-vfs-assets/homebrew-selection.json
            ${{ runner.temp }}/homebrew-experimental-vfs-assets/homebrew-vfs-build-report.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the fixed same-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-experimental-vfs-abi42
          path: ${{ runner.temp }}/homebrew-experimental-vfs-release-assets

      - name: Publish the exact inert assets once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: homebrew-experimental-abi42-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-release-assets
          VFS_FILENAME: ${{ needs.build-test.outputs.vfs_filename }}
          VFS_SHA256: ${{ needs.build-test.outputs.vfs_sha256 }}
          VFS_BYTES: ${{ needs.build-test.outputs.vfs_bytes }}
          SELECTION_SHA256: ${{ needs.build-test.outputs.selection_sha256 }}
          SELECTION_BYTES: ${{ needs.build-test.outputs.selection_bytes }}
          REPORT_SHA256: ${{ needs.build-test.outputs.report_sha256 }}
          REPORT_BYTES: ${{ needs.build-test.outputs.report_bytes }}
        run: |
          set -euo pipefail
          [[ "$VFS_FILENAME" =~ ^[A-Za-z0-9._-]+\.vfs\.zst$ ]]
          [[ "$VFS_FILENAME" == *experimental* && "$VFS_FILENAME" == *abi42* ]]
          expected_inventory="$(printf '%s\n' \
            "$VFS_FILENAME" \
            homebrew-selection.json \
            homebrew-vfs-build-report.json | LC_ALL=C sort)"
          actual_inventory="$(find "$ASSET_ROOT" -mindepth 1 \
            -printf '%P\n' | LC_ALL=C sort)"
          [ "$actual_inventory" = "$expected_inventory" ]

          verify_asset() {
            local name="$1" expected_sha="$2" expected_bytes="$3"
            local path="$ASSET_ROOT/$name"
            [ -f "$path" ] && [ ! -L "$path" ]
            [ "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha" ]
            [ "$(stat -c '%s' "$path")" = "$expected_bytes" ]
          }
          verify_asset "$VFS_FILENAME" "$VFS_SHA256" "$VFS_BYTES"
          verify_asset homebrew-selection.json \
            "$SELECTION_SHA256" "$SELECTION_BYTES"
          verify_asset homebrew-vfs-build-report.json \
            "$REPORT_SHA256" "$REPORT_BYTES"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Experimental ABI-42 Homebrew VFS" \
            --notes "Experimental ABI-42 flat Homebrew VFS; exact composition plus bounded Node and Chromium selected-runtime startup verified; stock in-guest tap/install lifecycle is not a release gate." \
            --prerelease \
            --latest=false \
            "$ASSET_ROOT/$VFS_FILENAME" \
            "$ASSET_ROOT/homebrew-selection.json" \
            "$ASSET_ROOT/homebrew-vfs-build-report.json"

  public-readback:
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
    needs: [build-test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Read back every public asset without credentials
        shell: bash
        env:
          RELEASE_TAG: homebrew-experimental-abi42-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          ASSET_ROOT: ${{ runner.temp }}/homebrew-experimental-vfs-release-assets
          VFS_FILENAME: ${{ needs.build-test.outputs.vfs_filename }}
          VFS_SHA256: ${{ needs.build-test.outputs.vfs_sha256 }}
          VFS_BYTES: ${{ needs.build-test.outputs.vfs_bytes }}
          SELECTION_SHA256: ${{ needs.build-test.outputs.selection_sha256 }}
          SELECTION_BYTES: ${{ needs.build-test.outputs.selection_bytes }}
          REPORT_SHA256: ${{ needs.build-test.outputs.report_sha256 }}
          REPORT_BYTES: ${{ needs.build-test.outputs.report_bytes }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          mkdir -p "$ASSET_ROOT"

          fetch_and_verify() {
            local asset="$1" expected_sha="$2" expected_bytes="$3"
            local output="$ASSET_ROOT/$asset"
            local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
            env -i /usr/bin/curl --disable \
              --fail --location --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --output "$output" "$url"
            [ "$(sha256sum "$output" | awk '{print $1}')" = "$expected_sha" ]
            [ "$(stat -c '%s' "$output")" = "$expected_bytes" ]
          }
          fetch_and_verify "$VFS_FILENAME" "$VFS_SHA256" "$VFS_BYTES"
          fetch_and_verify "homebrew-selection.json" \
            "$SELECTION_SHA256" "$SELECTION_BYTES"
          fetch_and_verify "homebrew-vfs-build-report.json" \
            "$REPORT_SHA256" "$REPORT_BYTES"
