          do
            env -u GH_TOKEN -u GITHUB_TOKEN \
              curl --disable --fail --location --silent --show-error \
                "${lifecycle_root}${name}" \
                --output "$RUNNER_TEMP/public-$name"
            cmp "$lifecycle/$name" "$RUNNER_TEMP/public-$name"
          done
          cmp "$image" "$lifecycle/main-shell.vfs.zst"
          cmp homebrew/main-shell-brew-package-tree.json \
            "$lifecycle/main-shell-brew-package-tree.json"
          cmp "$bootstrap" "$lifecycle/homebrew-bootstrap.zip"
          cmp "$bootstrap_env" "$lifecycle/homebrew-brew.env"
          {
            echo "image=$image"
            echo "bootstrap=$bootstrap"
            echo "bootstrap-env=$bootstrap_env"
            echo "plan-url=$plan_url"
            echo "image-sha=$(sha256sum "$image" | awk '{print $1}')"
            echo "bootstrap-sha=$(sha256sum "$bootstrap" | awk '{print $1}')"
            echo "bootstrap-bytes=$(wc -c <"$bootstrap" | tr -d '[:space:]')"
            echo "lifecycle-root=$lifecycle_root"
          } >>"$GITHUB_OUTPUT"

      - name: Build exact public browser product
        working-directory: apps/browser-demos
        shell: bash
        env:
          KANDELO_BROWSER_DEMO_INPUTS: main,homebrew-vfs-test
          WASM_POSIX_BINARY_CACHE_ROOT: ${{ runner.temp }}/main-shell-public-chromium-proof-cache
        run: |
          set -euo pipefail
          browser_bootstrap=public/homebrew-bootstrap.zip
          test -f "$browser_bootstrap"
          test ! -L "$browser_bootstrap"
          # WHY: prepare-browser owns this fixed same-origin asset. The build
          # must consume those admitted bytes instead of silently replacing
          # them from a second package source.
          cmp "${{ steps.public.outputs.bootstrap }}" "$browser_bootstrap"
          # WHY: dev-shell intentionally drops ambient variables. Forward the
          # selector or Vite builds its default pages and omits the proof page.
          bash ../../scripts/dev-shell.sh env \
            "KANDELO_BROWSER_DEMO_INPUTS=$KANDELO_BROWSER_DEMO_INPUTS" \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            npm run build
          test -f dist/index.html
          test -f dist/pages/homebrew-vfs-test/index.html
          cmp "${{ steps.public.outputs.bootstrap }}" \
            dist/homebrew-bootstrap.zip
          bash ../../scripts/verify-browser-shell-vfs-asset.sh \
            dist "${{ steps.public.outputs.image }}"

      - name: Create exact all-public Chromium lifecycle fixture
        id: public-fixture
        shell: bash
        env:
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          CANARY_REF: ${{ inputs.canary-ref }}
          FIXED_ASSET_ROOT: ${{ steps.public.outputs.lifecycle-root }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/homebrew-guest-lifecycle-public-fixture.json"
          lifecycle="$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff"
          bash scripts/dev-shell.sh npx tsx \
            scripts/create-homebrew-guest-lifecycle-fixture.ts \
              --transport-mode public \
              --image "$lifecycle/main-shell.vfs.zst" \
              --homebrew-bootstrap-spec \
                "$lifecycle/main-shell-brew-package-tree.json" \
              --homebrew-bootstrap-archive \
                "$lifecycle/homebrew-bootstrap.zip" \
              --homebrew-bootstrap-env "$lifecycle/homebrew-brew.env" \
              --bottle-mirror \
                "$RUNNER_TEMP/main-shell-mirror-handoff/mirror" \
              --fixed-asset-url-root "$FIXED_ASSET_ROOT" \
              --core-revision "$TAP_CATALOG_REF" \
              --canary-revision "$CANARY_REF" \
              --timeout-ms 900000 \
              --out "$fixture"
          echo "fixture=$fixture" >>"$GITHUB_OUTPUT"

      - name: Prove public shell and live tap lifecycle in Chromium
        working-directory: apps/browser-demos
        shell: bash
        env:
          KANDELO_BROWSER_DEMO_INPUTS: main
          KANDELO_PLAYWRIGHT_SERVE_DIST: "1"
          WASM_POSIX_BINARY_CACHE_ROOT: ${{ runner.temp }}/main-shell-public-chromium-proof-cache
          KANDELO_HOMEBREW_MAIN_SHELL_STRICT: "1"
          KANDELO_HOMEBREW_MAIN_SHELL_SHA256: ${{ steps.public.outputs.image-sha }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256: ${{ steps.public.outputs.bootstrap-sha }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES: ${{ steps.public.outputs.bootstrap-bytes }}
          KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE: public
          KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL: ${{ steps.public.outputs.plan-url }}
        run: |
          set -euo pipefail
          test -z "${VITE_KANDELO_HOMEBREW_CLOSED_ACCEPTANCE_ROOT:-}"
          test -z "${KANDELO_PLAYWRIGHT_CLOSED_ACCEPTANCE_ROOT:-}"
          run_public_playwright() {
            # WHY: dev-shell deliberately drops ambient variables. Keep the
            # exact built product, resolver cache, and public-input contract
            # together so neither Playwright invocation silently serves
            # source mode or resolves a different kernel.
            bash ../../scripts/dev-shell.sh env \
              "KANDELO_BROWSER_DEMO_INPUTS=$KANDELO_BROWSER_DEMO_INPUTS" \
              "KANDELO_PLAYWRIGHT_SERVE_DIST=$KANDELO_PLAYWRIGHT_SERVE_DIST" \
              "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
              "KANDELO_HOMEBREW_MAIN_SHELL_STRICT=$KANDELO_HOMEBREW_MAIN_SHELL_STRICT" \
              "KANDELO_HOMEBREW_MAIN_SHELL_SHA256=$KANDELO_HOMEBREW_MAIN_SHELL_SHA256" \
              "KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256=$KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256" \
              "KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES=$KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES" \
              "KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE=$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" \
              "KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL=$KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL" \
              "$@"
          }
          run_public_playwright npx playwright test \
            test/kandelo-homebrew-main-shell.spec.ts \
            --project=chromium
          lifecycle_report="$RUNNER_TEMP/homebrew-guest-lifecycle-public-playwright.json"
          run_public_playwright \
            "PLAYWRIGHT_JSON_OUTPUT_FILE=$lifecycle_report" \
            "KANDELO_HOMEBREW_GUEST_BROWSER_LIFECYCLE_LIVE=1" \
            "KANDELO_HOMEBREW_GUEST_BROWSER_LIFECYCLE_FIXTURE_PATH=${{ steps.public-fixture.outputs.fixture }}" \
            npx playwright test test/homebrew-guest-lifecycle.spec.ts \
              --project=chromium \
              --grep "survives a Chromium rootfs reboot" \
              --reporter=json
          jq -e '
            .stats.expected == 1 and .stats.unexpected == 0 and
            .stats.flaky == 0 and .stats.skipped == 0
          ' "$lifecycle_report" >/dev/null

      - name: Upload public Chromium lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-public-guest-lifecycle-evidence
          path: |
            ${{ steps.public-fixture.outputs.fixture }}
            ${{ runner.temp }}/homebrew-guest-lifecycle-public-playwright.json
            apps/browser-demos/test-results
          retention-days: 7
          if-no-files-found: warn
