name: Reusable Homebrew main-shell mirror publish

on:
  workflow_call:
    inputs:
      kandelo-ref:
        description: Exact live Automattic/kandelo main commit Mpre
        type: string
        required: true
      tap-catalog-ref:
        description: Exact final bottle-catalog commit TF
        type: string
        required: true
      publication-mode:
        description: Exact operation, create-mirror or publish-lifecycle
        type: string
        required: true
      mirror-authority-ref:
        description: Exact earlier TA0; empty when this caller creates the mirror
        type: string
        required: false
        default: ""
      canary-ref:
        description: Exact live independent-canary main commit C
        type: string
        required: true

concurrency:
  group: homebrew-main-shell-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare bounded mirror handoff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
      lifecycle-artifact-digest: ${{ steps.lifecycle-handoff.outputs.artifact-digest }}
      mirror-authority-ref: ${{ steps.authority.outputs.mirror-authority-ref }}
    steps:
      - name: Validate tap-owned caller and exact live inputs
        id: authority
        shell: bash
        env:
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
          REQUESTED_MIRROR_AUTHORITY_REF: ${{ inputs.mirror-authority-ref }}
          CANARY_REF: ${{ inputs.canary-ref }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_BRANCH_REF: ${{ github.ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [ "$CALLER_EVENT" = repository_dispatch ]
          [ "$CALLER_BRANCH_REF" = refs/heads/main ]
          [ "${CALLER_REPOSITORY,,}" = kandelo-dev/homebrew-tap-core ]
          [ "$CALLER_WORKFLOW_REF" = \
            "$CALLER_REPOSITORY/.github/workflows/publish-main-shell-mirror.yml@refs/heads/main" ]
          case "$PUBLICATION_MODE" in
            create-mirror)
              # WHY: the protected caller that performs the write is the only
              # truthful authority for a newly created immutable release.
              # Accepting a caller-supplied TA0 here could relabel new bytes as
              # if an older commit had published them.
              [ -z "$REQUESTED_MIRROR_AUTHORITY_REF" ]
              tap_mirror_authority_ref="$TAP_CALLER_AUTHORITY_REF"
              ;;
            publish-lifecycle)
              # WHY: TA1 consumes an already immutable release. Requiring an
              # explicit, different TA0 preserves who actually created it.
              [[ "$REQUESTED_MIRROR_AUTHORITY_REF" =~ ^[0-9a-f]{40}$ ]]
              [ "$REQUESTED_MIRROR_AUTHORITY_REF" != \
                "$TAP_CALLER_AUTHORITY_REF" ]
              tap_mirror_authority_ref="$REQUESTED_MIRROR_AUTHORITY_REF"
              ;;
            *)
              echo "unsupported publication mode: $PUBLICATION_MODE" >&2
              exit 2
              ;;
          esac
          for ref in \
            "$KANDELO_REF" "$TAP_CATALOG_REF" \
            "$tap_mirror_authority_ref" "$TAP_CALLER_AUTHORITY_REF" \
            "$CANARY_REF"
          do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          done
          echo "mirror-authority-ref=$tap_mirror_authority_ref" >>"$GITHUB_OUTPUT"

      - name: Check out exact Kandelo authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          path: kandelo
          persist-credentials: false

      - name: Check out exact tap catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.tap-catalog-ref }}
          path: tap-catalog
          persist-credentials: false

      - name: Check out protected tap caller authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Kandelo-dev/homebrew-tap-core
          ref: ${{ github.sha }}
          path: tap-authority
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source locks and public main heads
        shell: bash
        env:
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
          TAP_MIRROR_AUTHORITY_REF: ${{ steps.authority.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          [ "$(git -C kandelo rev-parse HEAD)" = "$KANDELO_REF" ]
          [ "$(git -C tap-catalog rev-parse HEAD)" = "$TAP_CATALOG_REF" ]
          [ "$(git -C tap-authority rev-parse HEAD)" = \
            "$TAP_CALLER_AUTHORITY_REF" ]
          test -z "$(git -C kandelo status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C tap-catalog status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C tap-authority status --porcelain=v1 --untracked-files=all)"
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository Automattic/kandelo --source-sha "$KANDELO_REF"
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository Kandelo-dev/homebrew-tap-core \
            --source-sha "$TAP_CALLER_AUTHORITY_REF"
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository brandonpayton/homebrew-kandelo-canary \
            --source-sha "$CANARY_REF"
          [ "$(jq -er '.catalog.tap_commit' \
            kandelo/homebrew/main-shell-migration-lock.json)" = "$TAP_CATALOG_REF" ]
          [ "$(jq -er '.catalog.tap_commit' \
            kandelo/homebrew/main-shell-homebrew-runtime-support.json)" = \
            "$TAP_CATALOG_REF" ]
          [ "$(jq -er '.lifecycle_installs[0].revision' \
            kandelo/homebrew/main-shell-homebrew-runtime-support.json)" = "$CANARY_REF" ]
          case "$PUBLICATION_MODE" in
            create-mirror)
              [ "$TAP_MIRROR_AUTHORITY_REF" = "$TAP_CALLER_AUTHORITY_REF" ]
              git -C tap-authority merge-base --is-ancestor \
                "$TAP_CATALOG_REF" "$TAP_CALLER_AUTHORITY_REF"
              ;;
            publish-lifecycle)
              # WHY: TF owns the bottle recipes, TA0 owns the existing mirror,
              # and TA1 owns only the later lifecycle-input release. The full
              # ancestry chain prevents adopting a stale or unrelated mirror.
              [ "$TAP_MIRROR_AUTHORITY_REF" != "$TAP_CALLER_AUTHORITY_REF" ]
              git -C tap-authority merge-base --is-ancestor \
                "$TAP_CATALOG_REF" "$TAP_MIRROR_AUTHORITY_REF"
              git -C tap-authority merge-base --is-ancestor \
                "$TAP_MIRROR_AUTHORITY_REF" "$TAP_CALLER_AUTHORITY_REF"
              ;;
          esac
          if [ "$PUBLICATION_MODE" = publish-lifecycle ]; then
            jq -e '.state == "sealed" and .image.sha256 != null and .image.bytes > 0' \
              kandelo/homebrew/main-shell-lazy-artifact-lock.json >/dev/null
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            kandelo/package-lock.json
            kandelo/tools/mkrootfs/package-lock.json

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Cache Nix store and flake evaluation
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Install exact mirror preparation tools
        working-directory: kandelo
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix tools/mkrootfs ci --no-audit --no-fund
          bash scripts/dev-shell.sh true

      - name: Validate structured shell release locks
        if: inputs.publication-mode == 'publish-lifecycle'
        working-directory: kandelo
        shell: bash
        env:
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          bash scripts/dev-shell.sh python3 \
            .github/scripts/check-homebrew-main-shell-release-locks.py \
              --source-root "$PWD" \
              --tap-catalog-ref "$TAP_CATALOG_REF" \
              --canary-ref "$CANARY_REF"

      - name: Resolve the exact public shell generation
        id: shell
        working-directory: kandelo
        shell: bash
        env:
          WASM_POSIX_BINARY_CACHE_ROOT: ${{ runner.temp }}/main-shell-mirror-package-cache
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
        run: |
          set -euo pipefail
          test ! -e "$WASM_POSIX_BINARY_CACHE_ROOT"
          case "$PUBLICATION_MODE" in
            create-mirror)
              source_binaries="$RUNNER_TEMP/main-shell-source-binaries"
              test ! -e "$source_binaries"
              mkdir "$source_binaries"
              # WHY: the mirror must be derived from reviewed current-main
              # source before the new package generation is activated. Build
              # the direct bootstrap companion first into the same isolated
              # resolver cache, then force the shell recipe itself through the
              # ordinary package resolver. Keep all scalar queries inside one
              # dev shell: its status output must never become part of a path.
              bash scripts/dev-shell.sh bash -s -- \
                "$source_binaries" \
                "$WASM_POSIX_BINARY_CACHE_ROOT" \
                "$GITHUB_OUTPUT" <<'SOURCE_BUILD'
          set -euo pipefail
          source_binaries="$1"
          cache_root="$2"
          github_output="$3"
          host_target="$(rustc -vV | awk '/^host:/ {print $2}')"
          [ -n "$host_target" ]

          WASM_POSIX_BINARY_CACHE_ROOT="$cache_root" \
            cargo run --release -p xtask --target "$host_target" --quiet -- \
              build-deps --arch wasm32 --binaries-dir "$source_binaries" \
                --force-source-build resolve homebrew-bootstrap
          WASM_POSIX_BINARY_CACHE_ROOT="$cache_root" \
            cargo run --release -p xtask --target "$host_target" --quiet -- \
              build-deps --arch wasm32 --binaries-dir "$source_binaries" \
                --force-source-build resolve shell

          bootstrap_archive_rel="$(cargo run --release -p xtask \
            --target "$host_target" --quiet -- \
              build-deps --arch wasm32 output-path homebrew-bootstrap \
                homebrew-bootstrap.zip)"
          bootstrap_env_rel="$(cargo run --release -p xtask \
            --target "$host_target" --quiet -- \
              build-deps --arch wasm32 output-path homebrew-bootstrap \
                homebrew-brew.env)"
          image_rel="$(cargo run --release -p xtask --target "$host_target" \
            --quiet -- build-deps --arch wasm32 output-path \
              shell shell.vfs.zst)"

          cache_root="$(realpath "$cache_root")"
          programs_root="$(realpath "$source_binaries/programs/wasm32")"
          test -d "$cache_root"
          test -d "$programs_root"
          resolve_product() {
            local relative="$1"
            local mirror_path
            local link_target
            local resolved
            [ -n "$relative" ]
            [ "${relative#/}" = "$relative" ]
            case "$relative" in
              *$'\n'*|../*|*/../*|*/..) return 1 ;;
            esac
            mirror_path="$programs_root/$relative"
            case "$mirror_path" in
              "$programs_root"/*) ;;
              *) return 1 ;;
            esac
            test -L "$mirror_path"
            link_target="$(readlink "$mirror_path")"
            case "$link_target" in
              /*) ;;
              *) return 1 ;;
            esac
            resolved="$(realpath "$mirror_path")"
            case "$resolved" in
              "$cache_root"/*) ;;
              *) return 1 ;;
            esac
            test -f "$resolved"
            test ! -L "$resolved"
            printf '%s\n' "$resolved"
          }
          bootstrap="$(resolve_product "$bootstrap_archive_rel")"
          bootstrap_env="$(resolve_product "$bootstrap_env_rel")"
          image="$(resolve_product "$image_rel")"
          for path in "$image" "$bootstrap" "$bootstrap_env"; do
            test -f "$path"
            test ! -L "$path"
          done
          {
            echo "image=$image"
            echo "bootstrap=$bootstrap"
            echo "bootstrap-env=$bootstrap_env"
          } >>"$github_output"
          SOURCE_BUILD
              ;;
            publish-lifecycle)
              # Historical lifecycle recovery keeps its sealed public product
              # path. It is independent of the current mirror creation lane.
              bash scripts/dev-shell.sh env \
                "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
                bash scripts/fetch-binaries.sh --fetch-only --package shell
              image="$(bash scripts/resolve-binary.sh programs/shell.vfs.zst)"
              bootstrap_root="$RUNNER_TEMP/homebrew-bootstrap-bottle"
              test ! -e "$bootstrap_root"
              bash scripts/dev-shell.sh bash \
                scripts/prepare-homebrew-browser-bootstrap.sh \
                  --require-sealed \
                  --output-directory "$bootstrap_root"
              bootstrap="$bootstrap_root/homebrew-bootstrap.zip"
              bootstrap_env="$bootstrap_root/homebrew-brew.env"
              bash scripts/verify-homebrew-main-shell-artifact-lock.sh \
                --lock homebrew/main-shell-lazy-artifact-lock.json \
                --expected-source-date-epoch 0 \
                --artifact "$image"
              for path in "$image" "$bootstrap" "$bootstrap_env"; do
                test -f "$path"
                test ! -L "$path"
              done
              {
                echo "image=$image"
                echo "bootstrap=$bootstrap"
                echo "bootstrap-env=$bootstrap_env"
              } >>"$GITHUB_OUTPUT"
              ;;
          esac

      - name: Recover exact public-source bottle payloads
        id: mirror
        working-directory: kandelo
        shell: bash
        env:
          IMAGE: ${{ steps.shell.outputs.image }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          TAP_MIRROR_AUTHORITY_REF: ${{ steps.authority.outputs.mirror-authority-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/main-shell-mirror"
          report="$RUNNER_TEMP/main-shell-mirror-recovery.json"
          publish="$RUNNER_TEMP/main-shell-mirror-publish.json"
          test ! -e "$mirror"
          test ! -e "$report"
          test ! -e "$publish"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            bash scripts/dev-shell.sh npx tsx \
              scripts/recover-homebrew-bottle-mirror.ts \
                --image "$IMAGE" \
                --out "$mirror" \
                --report "$report"
          case "$PUBLICATION_MODE" in
            create-mirror)
              cmp "$mirror/kandelo-homebrew-bottle-mirror-plan.json" \
                homebrew/main-shell-flat-lazy-mirror-plan.json
              jq -e '
                .source == "flat-lazy-image-binding" and
                .repository == "kandelo-dev/homebrew-tap-core" and
                (.assets | length) == 37
              ' "$report" >/dev/null
              ;;
            publish-lifecycle)
              [ "$(jq -er '.catalog.checkout_commit' "$report")" = \
                "$TAP_CATALOG_REF" ]
              ;;
          esac
          bash scripts/dev-shell.sh npx tsx \
            scripts/create-homebrew-bottle-mirror-publish-manifest.ts \
              --bundle "$mirror" \
              --recovery-report "$report" \
              --target-commitish "$TAP_MIRROR_AUTHORITY_REF" \
              --out "$publish"
          [ "$(jq -er '.target_commitish' "$publish")" = \
            "$TAP_MIRROR_AUTHORITY_REF" ]
          {
            echo "root=$mirror"
            echo "report=$report"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

      - name: Create and verify bounded data handoff
        id: bounded
        working-directory: kandelo
        shell: bash
        env:
          IMAGE: ${{ steps.shell.outputs.image }}
          BOOTSTRAP: ${{ steps.shell.outputs.bootstrap }}
          BOOTSTRAP_ENV: ${{ steps.shell.outputs.bootstrap-env }}
          MIRROR: ${{ steps.mirror.outputs.root }}
          PUBLISH: ${{ steps.mirror.outputs.publish }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
          TAP_MIRROR_AUTHORITY_REF: ${{ steps.authority.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/main-shell-mirror-handoff"
          test ! -e "$handoff"
          mkdir "$handoff"
          cp "$IMAGE" "$handoff/main-shell.vfs.zst"
          cp "$BOOTSTRAP" "$handoff/homebrew-bootstrap.zip"
          cp "$BOOTSTRAP_ENV" "$handoff/homebrew-brew.env"
          cp "$PUBLISH" "$handoff/publish.json"
          cp -R "$MIRROR" "$handoff/mirror"
          digest() { sha256sum "$1" | awk '{print $1}'; }
          bytes() { wc -c <"$1" | tr -d '[:space:]'; }
          plan="$handoff/mirror/kandelo-homebrew-bottle-mirror-plan.json"
          mirror_bytes="$(
            find "$handoff/mirror" -mindepth 1 -maxdepth 1 -type f -exec wc -c {} + |
              awk '{ total += $1 } END { print total + 0 }'
          )"
          mirror_count="$(
            find "$handoff/mirror" -mindepth 1 -maxdepth 1 -type f |
              wc -l | tr -d '[:space:]'
          )"
          jq -n \
            --arg kandelo "$KANDELO_REF" \
            --arg tap_catalog "$TAP_CATALOG_REF" \
            --arg tap_mirror_authority "$TAP_MIRROR_AUTHORITY_REF" \
            --arg tap_caller_authority "$TAP_CALLER_AUTHORITY_REF" \
            --arg canary "$CANARY_REF" \
            --arg image_sha "$(digest "$handoff/main-shell.vfs.zst")" \
            --argjson image_bytes "$(bytes "$handoff/main-shell.vfs.zst")" \
            --arg bootstrap_sha "$(digest "$handoff/homebrew-bootstrap.zip")" \
            --argjson bootstrap_bytes "$(bytes "$handoff/homebrew-bootstrap.zip")" \
            --arg env_sha "$(digest "$handoff/homebrew-brew.env")" \
            --argjson env_bytes "$(bytes "$handoff/homebrew-brew.env")" \
            --arg publish_sha "$(digest "$handoff/publish.json")" \
            --argjson publish_bytes "$(bytes "$handoff/publish.json")" \
            --arg plan_sha "$(digest "$plan")" \
            --argjson mirror_bytes "$mirror_bytes" \
            --argjson mirror_count "$mirror_count" '
            {
              schema: 1,
              kind: "kandelo-homebrew-main-shell-mirror-handoff",
              kandelo_ref: $kandelo,
              tap_catalog_ref: $tap_catalog,
              tap_mirror_authority_ref: $tap_mirror_authority,
              tap_caller_authority_ref: $tap_caller_authority,
              canary_ref: $canary,
              files: {
                "main-shell.vfs.zst": {
                  sha256: $image_sha, bytes: $image_bytes
                },
                "homebrew-bootstrap.zip": {
                  sha256: $bootstrap_sha, bytes: $bootstrap_bytes
                },
                "homebrew-brew.env": {
                  sha256: $env_sha, bytes: $env_bytes
                },
                "publish.json": {
                  sha256: $publish_sha, bytes: $publish_bytes
                }
              },
              mirror: {
                plan_sha256: $plan_sha,
                asset_count: $mirror_count,
                bytes: $mirror_bytes
              }
            }
          ' >"$handoff/handoff.json"
          bash scripts/verify-homebrew-main-shell-mirror-handoff.sh \
            --root "$handoff" \
            --publication-mode "$PUBLICATION_MODE" \
            --kandelo-ref "$KANDELO_REF" \
            --tap-catalog-ref "$TAP_CATALOG_REF" \
            --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
            --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
            --canary-ref "$CANARY_REF"
          echo "root=$handoff" >>"$GITHUB_OUTPUT"

      - name: Upload same-run bounded handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-main-shell-mirror-handoff
          path: ${{ steps.bounded.outputs.root }}
          retention-days: 1
          if-no-files-found: error

      - name: Prepare separate public lifecycle-input handoff
        id: lifecycle
        if: inputs.publication-mode == 'publish-lifecycle'
        working-directory: kandelo
        shell: bash
        env:
          IMAGE: ${{ steps.shell.outputs.image }}
          BOOTSTRAP: ${{ steps.shell.outputs.bootstrap }}
          BOOTSTRAP_ENV: ${{ steps.shell.outputs.bootstrap-env }}
          MIRROR_PLAN: ${{ steps.mirror.outputs.root }}/kandelo-homebrew-bottle-mirror-plan.json
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          TAP_MIRROR_AUTHORITY_REF: ${{ steps.authority.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff"
          test ! -e "$root"
          # WHY: the shell package exposes its image only inside an archive,
          # while the support-data bottle contains the bootstrap ZIP and
          # environment as members. The browser needs direct immutable URLs,
          # so publish only these fixed proof inputs under a separate identity
          # instead of adding them to the bottle-layer mirror. The handoff
          # records the Formula ownership and stable guest prefix explicitly.
          bash scripts/dev-shell.sh npx tsx \
            scripts/homebrew-guest-lifecycle-publication.ts create \
              --image "$IMAGE" \
              --homebrew-bootstrap-spec \
                homebrew/main-shell-brew-package-tree.json \
              --homebrew-bootstrap-archive "$BOOTSTRAP" \
              --homebrew-bootstrap-env "$BOOTSTRAP_ENV" \
              --bottle-mirror-plan "$MIRROR_PLAN" \
              --kandelo-ref "$KANDELO_REF" \
              --tap-catalog-ref "$TAP_CATALOG_REF" \
              --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
              --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
              --canary-ref "$CANARY_REF" \
              --out "$root"
          echo "root=$root" >>"$GITHUB_OUTPUT"

      - name: Upload same-run lifecycle-input handoff
        id: lifecycle-handoff
        if: inputs.publication-mode == 'publish-lifecycle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-guest-lifecycle-inputs-handoff
          path: ${{ steps.lifecycle.outputs.root }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish with tap-owned token
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact tap authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Kandelo-dev/homebrew-tap-core
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact Kandelo publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          path: kandelo
          persist-credentials: false

      - name: Download only the same-run prepared handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-main-shell-mirror-handoff
          path: ${{ runner.temp }}/main-shell-mirror-handoff

      - name: Download only the same-run lifecycle-input handoff
        if: inputs.publication-mode == 'publish-lifecycle'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-guest-lifecycle-inputs-handoff
          path: ${{ runner.temp }}/homebrew-guest-lifecycle-inputs-handoff

      - name: Revalidate handoff and live publication authority
        shell: bash
        env:
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          PUBLICATION_MODE: ${{ inputs.publication-mode }}
          TAP_MIRROR_AUTHORITY_REF: ${{ needs.prepare.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$TAP_CALLER_AUTHORITY_REF" ]
          [ "$(git -C kandelo rev-parse HEAD)" = "$KANDELO_REF" ]
          # The Kandelo checkout is an intentional untracked sibling. Only
          # tracked tap authority may affect publication.
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C kandelo status --porcelain=v1 --untracked-files=all)"
          [ "${{ needs.prepare.outputs.artifact-digest }}" != "" ]
          bash kandelo/scripts/verify-homebrew-main-shell-mirror-handoff.sh \
            --root "$RUNNER_TEMP/main-shell-mirror-handoff" \
            --publication-mode "$PUBLICATION_MODE" \
            --kandelo-ref "$KANDELO_REF" \
            --tap-catalog-ref "$TAP_CATALOG_REF" \
            --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
            --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
            --canary-ref "$CANARY_REF"
          case "$PUBLICATION_MODE" in
            create-mirror)
              # WHY: TA0 must not receive a lifecycle publication manifest.
              # The mirror handoff includes source-verification bytes, but
              # without the separate lifecycle handoff this job has no
              # manifest that can authorize a lifecycle release.
              [ "${{ needs.prepare.outputs.lifecycle-artifact-digest }}" = "" ]
              test ! -e \
                "$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff"
              ;;
            publish-lifecycle)
              [ "${{ needs.prepare.outputs.lifecycle-artifact-digest }}" != "" ]
              bash kandelo/scripts/verify-homebrew-guest-lifecycle-publication.sh \
                --root "$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff" \
                --bottle-mirror-plan \
                  "$RUNNER_TEMP/main-shell-mirror-handoff/mirror/kandelo-homebrew-bottle-mirror-plan.json" \
                --kandelo-ref "$KANDELO_REF" \
                --tap-catalog-ref "$TAP_CATALOG_REF" \
                --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
                --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
                --canary-ref "$CANARY_REF"
              ;;
          esac
          GH_TOKEN="${{ github.token }}" \
            bash kandelo/.github/scripts/require-exact-kandelo-main.sh \
              --repository Automattic/kandelo --source-sha "$KANDELO_REF"
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository Kandelo-dev/homebrew-tap-core \
            --source-sha "$TAP_CALLER_AUTHORITY_REF"

      - name: Create and anonymously re-read the immutable mirror
        id: mirror-release
        if: inputs.publication-mode == 'create-mirror'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_MIRROR_AUTHORITY_REF: ${{ needs.prepare.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$TAP_MIRROR_AUTHORITY_REF" = "$TAP_CALLER_AUTHORITY_REF" ]
          handoff="$RUNNER_TEMP/main-shell-mirror-handoff"
          receipt="$RUNNER_TEMP/main-shell-mirror-release-receipt.json"
          # WHY: only TA0 creates the mirror. The publisher also performs an
          # anonymous byte-for-byte readback, so completion means later TA1
          # consumers can actually retrieve this exact public collection.
          bash kandelo/scripts/publish-immutable-github-release.sh \
            --manifest "$handoff/publish.json" \
            --asset-root "$handoff/mirror" \
            --lock-root "$GITHUB_WORKSPACE" \
            --receipt "$receipt" \
            --exact-kandelo-main-sha "$KANDELO_REF" \
            --exact-target-main-sha "$TAP_CALLER_AUTHORITY_REF"
          jq -e \
            --arg tap "$TAP_CALLER_AUTHORITY_REF" '
            .status == "success" and
            .visibility == "public-anonymous-readback" and
            .repository == "kandelo-dev/homebrew-tap-core" and
            .target_commitish == $tap and
            .immutable == true and
            (.assets | length) > 1
          ' "$receipt" >/dev/null
          echo "receipt=$receipt" >>"$GITHUB_OUTPUT"

      - name: Verify the existing mirror and publish only lifecycle inputs
        id: lifecycle-release
        if: inputs.publication-mode == 'publish-lifecycle'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          TAP_MIRROR_AUTHORITY_REF: ${{ needs.prepare.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/main-shell-mirror-handoff"
          mirror_receipt="$RUNNER_TEMP/main-shell-mirror-verification-receipt.json"
          # WHY: the mirror tag is already immutable and truthfully belongs to
          # TA0. This path may prove and consume it, but must never rewrite or
          # relabel it as a release created by the later TA1 caller.
          bash kandelo/scripts/verify-existing-immutable-github-release.sh \
            --manifest "$handoff/publish.json" \
            --asset-root "$handoff/mirror" \
            --receipt "$mirror_receipt" \
            --exact-target-commit-sha "$TAP_MIRROR_AUTHORITY_REF"
          jq -e \
            --arg tap "$TAP_MIRROR_AUTHORITY_REF" '
            .status == "success" and
            .operation == "verified-existing" and
            .visibility == "public-anonymous-readback" and
            .repository == "kandelo-dev/homebrew-tap-core" and
            .target_commitish == $tap and
            .immutable == true and
            (.assets | length) > 1
          ' "$mirror_receipt" >/dev/null
          lifecycle="$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff"
          lifecycle_receipt="$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-release-receipt.json"
          bash kandelo/scripts/publish-immutable-github-release.sh \
            --manifest "$lifecycle/publish.json" \
            --asset-root "$lifecycle" \
            --lock-root "$GITHUB_WORKSPACE" \
            --receipt "$lifecycle_receipt" \
            --exact-kandelo-main-sha "$KANDELO_REF" \
            --exact-target-main-sha "$TAP_CALLER_AUTHORITY_REF"
          jq -e \
            --arg tap "$TAP_CALLER_AUTHORITY_REF" '
            .status == "success" and
            .visibility == "public-anonymous-readback" and
            .repository == "kandelo-dev/homebrew-tap-core" and
            .target_commitish == $tap and
            .immutable == true and
            (.assets | length) == 4
          ' "$lifecycle_receipt" >/dev/null
          {
            echo "mirror-receipt=$mirror_receipt"
            echo "lifecycle-receipt=$lifecycle_receipt"
          } >>"$GITHUB_OUTPUT"

      - name: Upload immutable mirror publication receipt
        if: inputs.publication-mode == 'create-mirror'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-main-shell-mirror-publication
          path: ${{ steps.mirror-release.outputs.receipt }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload mirror verification and lifecycle publication receipts
        if: inputs.publication-mode == 'publish-lifecycle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-main-shell-mirror-publication
          path: |
            ${{ steps.lifecycle-release.outputs.mirror-receipt }}
            ${{ steps.lifecycle-release.outputs.lifecycle-receipt }}
          retention-days: 7
          if-no-files-found: error

  public-node-proof:
    name: Prove public bottle installation in Node
    needs: [prepare, publish]
    if: inputs.publication-mode == 'publish-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact Kandelo Node consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          persist-credentials: false

      - name: Download same-run exact product handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-main-shell-mirror-handoff
          path: ${{ runner.temp }}/main-shell-mirror-handoff

      - name: Download same-run lifecycle-input handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-guest-lifecycle-inputs-handoff
          path: ${{ runner.temp }}/homebrew-guest-lifecycle-inputs-handoff

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host/package-lock.json

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Cache Nix store and flake evaluation
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: false
          use-flakehub: false

      - name: Install public Node proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix host ci --no-audit --no-fund
          bash scripts/dev-shell.sh true

      - name: Build the production Node process worker
        shell: bash
        run: |
          set -euo pipefail
          # WHY: stock Brew creates hundreds of short-lived guest
          # processes. Without this artifact, each process starts a new
          # tsx compiler in its Node Worker and can exhaust a hosted
          # runner before `brew tap` completes. The shipped host uses
          # this compiled worker path.
          npm --prefix host run build
          test -s host/dist/worker-entry.js

      - name: Revalidate exact Node handoff and live refs
        shell: bash
        env:
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          TAP_MIRROR_AUTHORITY_REF: ${{ needs.prepare.outputs.mirror-authority-ref }}
          TAP_CALLER_AUTHORITY_REF: ${{ github.sha }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$KANDELO_REF" ]
          bash scripts/verify-homebrew-main-shell-mirror-handoff.sh \
            --root "$RUNNER_TEMP/main-shell-mirror-handoff" \
            --publication-mode publish-lifecycle \
            --kandelo-ref "$KANDELO_REF" \
            --tap-catalog-ref "$TAP_CATALOG_REF" \
            --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
            --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
            --canary-ref "$CANARY_REF"
          bash scripts/verify-homebrew-guest-lifecycle-publication.sh \
            --root "$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff" \
            --bottle-mirror-plan \
              "$RUNNER_TEMP/main-shell-mirror-handoff/mirror/kandelo-homebrew-bottle-mirror-plan.json" \
            --kandelo-ref "$KANDELO_REF" \
            --tap-catalog-ref "$TAP_CATALOG_REF" \
            --tap-mirror-authority-ref "$TAP_MIRROR_AUTHORITY_REF" \
            --tap-caller-authority-ref "$TAP_CALLER_AUTHORITY_REF" \
            --canary-ref "$CANARY_REF"
          bash .github/scripts/require-exact-repository-main.sh \
            --repository Automattic/kandelo --source-sha "$KANDELO_REF"
          bash .github/scripts/require-exact-repository-main.sh \
            --repository Kandelo-dev/homebrew-tap-core \
            --source-sha "$TAP_CALLER_AUTHORITY_REF"
          bash .github/scripts/require-exact-repository-main.sh \
            --repository brandonpayton/homebrew-kandelo-canary \
            --source-sha "$CANARY_REF"

      - name: Resolve exact public Node proof inputs
        id: public
        shell: bash
        env:
          WASM_POSIX_BINARY_CACHE_ROOT: ${{ runner.temp }}/main-shell-public-node-proof-cache
        run: |
          set -euo pipefail
          test ! -e "$WASM_POSIX_BINARY_CACHE_ROOT"
          # WHY: the signed handoff already owns the exact shell and Homebrew
          # inputs. The Node host resolves only the kernel outside that
          # handoff, so fetching the browser closure here wastes disk and
          # memory before the lifecycle proof it is meant to isolate.
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            bash scripts/fetch-binaries.sh --fetch-only --package kernel
          bash scripts/resolve-binary.sh kernel.wasm >/dev/null
          handoff="$RUNNER_TEMP/main-shell-mirror-handoff"
          lifecycle="$RUNNER_TEMP/homebrew-guest-lifecycle-inputs-handoff"
          plan="$handoff/mirror/kandelo-homebrew-bottle-mirror-plan.json"
          plan_url="$(jq -er '.release_root + "/" + .manifest_asset' "$plan")"
          env -u GH_TOKEN -u GITHUB_TOKEN curl --disable --fail --location \
            --silent --show-error "$plan_url" \
            --output "$RUNNER_TEMP/public-node-plan.json"
          cmp "$plan" "$RUNNER_TEMP/public-node-plan.json"
          lifecycle_root="$(jq -er '.release.root' "$lifecycle/handoff.json")"
          for name in \
            main-shell.vfs.zst \
            main-shell-brew-package-tree.json \
            homebrew-bootstrap.zip \
            homebrew-brew.env
          do
            env -u GH_TOKEN -u GITHUB_TOKEN \
              curl --disable --fail --location --silent --show-error \
                "${lifecycle_root}${name}" \
                --output "$RUNNER_TEMP/public-node-$name"
            cmp "$lifecycle/$name" "$RUNNER_TEMP/public-node-$name"
          done
          cmp "$handoff/main-shell.vfs.zst" \
            "$lifecycle/main-shell.vfs.zst"
          cmp homebrew/main-shell-brew-package-tree.json \
            "$lifecycle/main-shell-brew-package-tree.json"
          cmp "$handoff/homebrew-bootstrap.zip" \
            "$lifecycle/homebrew-bootstrap.zip"
          cmp "$handoff/homebrew-brew.env" \
            "$lifecycle/homebrew-brew.env"
          {
            echo "image=$lifecycle/main-shell.vfs.zst"
            echo "bootstrap=$lifecycle/homebrew-bootstrap.zip"
            echo "bootstrap-env=$lifecycle/homebrew-brew.env"
          } >>"$GITHUB_OUTPUT"

      - name: Initialize bounded Node lifecycle telemetry
        shell: bash
        run: |
          set -euo pipefail
          : >"$RUNNER_TEMP/homebrew-node-lifecycle-resources.log"

      # WHY: distinct workflow steps keep the active scope visible in durable
      # job metadata even when a force cancellation prevents log finalization.
      - name: Prove shipping-core public bottle installs in Node
        shell: bash
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.public.outputs.image }}
          BOOTSTRAP: ${{ steps.public.outputs.bootstrap }}
          BOOTSTRAP_ENV: ${{ steps.public.outputs.bootstrap-env }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          bash homebrew/test/run_homebrew_guest_shipping_scope.sh \
            shipping-core

      - name: Prove shipping-canary public bottle installs in Node
        shell: bash
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.public.outputs.image }}
          BOOTSTRAP: ${{ steps.public.outputs.bootstrap }}
          BOOTSTRAP_ENV: ${{ steps.public.outputs.bootstrap-env }}
          TAP_CATALOG_REF: ${{ inputs.tap-catalog-ref }}
          CANARY_REF: ${{ inputs.canary-ref }}
        run: |
          set -euo pipefail
          bash homebrew/test/run_homebrew_guest_shipping_scope.sh \
            shipping-canary

      - name: Upload bounded Node lifecycle telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-public-node-lifecycle-telemetry
          path: ${{ runner.temp }}/homebrew-node-lifecycle-resources.log
          retention-days: 7
          if-no-files-found: warn

  public-chromium-proof:
    name: Prove public guest lifecycle in Chromium
    needs: [prepare, publish]
    if: inputs.publication-mode == 'publish-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact Kandelo consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
