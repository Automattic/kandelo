        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-guest-lifecycle-inputs-handoff
          path: ${{ runner.temp }}/homebrew-guest-lifecycle-inputs-handoff

