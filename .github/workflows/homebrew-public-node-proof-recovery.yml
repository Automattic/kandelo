name: Homebrew public Node proof recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare exact public Node runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
    steps:
      - name: Check out exact recovery workflow authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact published product authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Automattic/kandelo
          ref: 0b0945f5f78b5e7577d08fafffc540408a501cb1
          path: product
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            product/package-lock.json
            product/host/package-lock.json

      - name: Set up the declared Nix environment
        uses: ./.github/actions/setup-nix

      - name: Install exact product build tools
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix host ci --no-audit --no-fund
          bash scripts/dev-shell.sh true

      - name: Resolve the exact published kernel
        id: kernel
        working-directory: product
        shell: bash
        env:
          WASM_POSIX_BINARY_CACHE_ROOT: ${{ runner.temp }}/node-proof-kernel-cache
        run: |
          set -euo pipefail
          test ! -e "$WASM_POSIX_BINARY_CACHE_ROOT"
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            bash scripts/fetch-binaries.sh --fetch-only --package kernel
          kernel="$(bash scripts/resolve-binary.sh kernel.wasm)"
          test -f "$kernel"
          test ! -L "$kernel"
          echo "path=$kernel" >>"$GITHUB_OUTPUT"

      - name: Build and verify the bounded runtime handoff
        id: runtime
        shell: bash
        env:
          KANDELO_REF: 0b0945f5f78b5e7577d08fafffc540408a501cb1
          WORKFLOW_REF: ${{ github.sha }}
          TAP_CATALOG_REF: 6ad0e3dbc60e5572c4288c86919238f71c1bc110
          TAP_AUTHORITY_REF: 84fcb7b104af0d9440690fd519d5a5a44fda5b80
          CANARY_REF: d8bdda662f6d80cf3dcdbe8451edb12bb33bbafc
          KERNEL: ${{ steps.kernel.outputs.path }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/homebrew-public-node-runtime-handoff"
          test ! -e "$root"
          # WHY: the exact product source still needs Nix, npm, TypeScript,
          # worker compilation, and kernel resolution. Finishing all of that
          # here gives each bottle proof a new runner and empty cgroup.
          # WHY: the Nix setup actions may put another Node.js ahead of the
          # setup-node toolcache on PATH. The product dev shell is the build
          # contract and pins Node.js 24, so enter it instead of weakening the
          # runtime handoff's version check.
          (
            cd "$GITHUB_WORKSPACE/product"
            bash scripts/dev-shell.sh \
              bash \
                "$GITHUB_WORKSPACE/scripts/create-homebrew-node-proof-runtime-handoff.sh" \
                --source-root "$GITHUB_WORKSPACE/product" \
                --kernel "$KERNEL" \
                --kandelo-ref "$KANDELO_REF" \
                --workflow-ref "$WORKFLOW_REF" \
                --tap-catalog-ref "$TAP_CATALOG_REF" \
                --tap-authority-ref "$TAP_AUTHORITY_REF" \
                --canary-ref "$CANARY_REF" \
                --out "$root"
          )
          echo "root=$root" >>"$GITHUB_OUTPUT"

      - name: Upload same-run bounded runtime handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-public-node-runtime-handoff
          path: ${{ steps.runtime.outputs.root }}
          retention-days: 1
          if-no-files-found: error

  prove:
    name: Prove ${{ matrix.scope }} on a fresh Node runner
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope:
          - shipping-core
          - shipping-canary
    steps:
      - name: Check out exact recovery workflow authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download only the same-run runtime handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-public-node-runtime-handoff
          path: ${{ runner.temp }}/homebrew-public-node-runtime-handoff

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Verify runtime and fetch immutable public inputs
        id: public
        shell: bash
        env:
          KANDELO_REF: 0b0945f5f78b5e7577d08fafffc540408a501cb1
          WORKFLOW_REF: ${{ github.sha }}
          TAP_CATALOG_REF: 6ad0e3dbc60e5572c4288c86919238f71c1bc110
          TAP_AUTHORITY_REF: 84fcb7b104af0d9440690fd519d5a5a44fda5b80
          CANARY_REF: d8bdda662f6d80cf3dcdbe8451edb12bb33bbafc
        run: |
          set -euo pipefail
          [ "${{ needs.prepare.outputs.artifact-digest }}" != "" ]
          runtime="$RUNNER_TEMP/homebrew-public-node-runtime-handoff"
          bash scripts/verify-homebrew-node-proof-runtime-handoff.sh \
            --root "$runtime" \
            --kandelo-ref "$KANDELO_REF" \
            --workflow-ref "$WORKFLOW_REF" \
            --tap-catalog-ref "$TAP_CATALOG_REF" \
            --tap-authority-ref "$TAP_AUTHORITY_REF" \
            --canary-ref "$CANARY_REF"

          lock="$GITHUB_WORKSPACE/homebrew/public-proof-recovery-lock.json"
          release_repository="$(jq -er '.release.repository' "$lock")"
          release_tag="$(jq -er '.release.tag' "$lock")"
          release_api="https://api.github.com/repos/${release_repository}/releases/tags/${release_tag}"
          release_json="$RUNNER_TEMP/public-node-proof-release.json"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            curl --disable --fail --location --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$release_api" --output "$release_json"
          jq -e \
            --arg tag "$release_tag" \
            --arg target "$TAP_AUTHORITY_REF" '
            .tag_name == $tag and
            .target_commitish == $target and
            .immutable == true and
            .draft == false and
            .prerelease == false and
            ([.assets[].name] | sort) == [
              "homebrew-bootstrap.zip",
              "homebrew-brew.env",
              "main-shell-brew-package-tree.json",
              "main-shell.vfs.zst"
            ]
          ' "$release_json" >/dev/null

          public_root="$RUNNER_TEMP/homebrew-public-node-inputs"
          test ! -e "$public_root"
          mkdir "$public_root"
          for name in \
            homebrew-bootstrap.zip \
            homebrew-brew.env \
            main-shell-brew-package-tree.json \
            main-shell.vfs.zst
          do
            url="$(jq -er --arg name "$name" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "$release_json")"
            env -u GH_TOKEN -u GITHUB_TOKEN \
              curl --disable --fail --location --silent --show-error \
                "$url" --output "$public_root/$name"
            expected_sha="$(jq -er --arg name "$name" \
              '.release.assets[$name].sha256' "$lock")"
            expected_bytes="$(jq -er --arg name "$name" \
              '.release.assets[$name].bytes' "$lock")"
            actual_sha="$(sha256sum "$public_root/$name" | awk '{print $1}')"
            actual_bytes="$(wc -c <"$public_root/$name" |
              tr -d '[:space:]')"
            [ "$actual_sha" = "$expected_sha" ]
            [ "$actual_bytes" = "$expected_bytes" ]
          done
          {
            echo "image=$public_root/main-shell.vfs.zst"
            echo "bootstrap-spec=$public_root/main-shell-brew-package-tree.json"
            echo "bootstrap=$public_root/homebrew-bootstrap.zip"
            echo "bootstrap-env=$public_root/homebrew-brew.env"
          } >>"$GITHUB_OUTPUT"

      - name: Initialize bounded Node lifecycle telemetry
        shell: bash
        run: |
          set -euo pipefail
          : >"$RUNNER_TEMP/homebrew-node-lifecycle-resources.log"

      # WHY: one matrix value means one hosted runner and one cgroup. The core
      # proof cannot leave retired generations for the canary proof, while the
      # guest still receives the product default worker limit of four.
      - name: Prove the selected stock guest bottle install
        shell: bash
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.public.outputs.image }}
          BOOTSTRAP_SPEC: ${{ steps.public.outputs.bootstrap-spec }}
          BOOTSTRAP: ${{ steps.public.outputs.bootstrap }}
          BOOTSTRAP_ENV: ${{ steps.public.outputs.bootstrap-env }}
          TAP_CATALOG_REF: 6ad0e3dbc60e5572c4288c86919238f71c1bc110
          CANARY_REF: d8bdda662f6d80cf3dcdbe8451edb12bb33bbafc
          KANDELO_HOMEBREW_NODE_PROOF_RUNTIME: ${{ runner.temp }}/homebrew-public-node-runtime-handoff
        run: |
          set -euo pipefail
          bash homebrew/test/run_homebrew_guest_shipping_scope.sh \
            "${{ matrix.scope }}"

      - name: Upload bounded Node lifecycle telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-public-node-recovery-${{ matrix.scope }}
          path: ${{ runner.temp }}/homebrew-node-lifecycle-resources.log
          retention-days: 7
          if-no-files-found: warn
