name: Process memory retirement telemetry

on:
  pull_request:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    process-memory-retirement-telemetry-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: false

jobs:
  # WHY: the expensive matrix compares retired and deliberately-live
  # low/high trials on one engine and runner. It is a differential sentinel,
  # not an absolute RSS ceiling, so unrelated pull requests need only this
  # cheap applicability decision and the aggregate gate below.
  scope:
    name: Decide whether physical memory telemetry applies
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
      reason: ${{ steps.scope.outputs.reason }}
      target_sha: ${{ steps.scope.outputs.target_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate scope and aggregate-gate controls
        run: bash .github/scripts/test-process-memory-telemetry-control.sh

      - name: Classify the exact-head change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error::scope checkout $actual_sha != $TARGET_SHA"
            exit 1
          fi
          echo "target_sha=$actual_sha" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled or manually dispatched run" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull request event did not provide a base SHA"
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch origin "$BASE_SHA" --no-tags
          fi
          changed_files="$(git diff --name-only "$BASE_SHA...HEAD")"
          if [ -z "$changed_files" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=empty diff; measuring as a fail-safe" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matches="$(
            printf '%s\n' "$changed_files" |
              bash .github/scripts/process-memory-telemetry-scope.sh
          )"
          if [ -n "$matches" ]; then
            {
              echo "required=true"
              echo "reason=browser process-memory ownership inputs changed"
            } >> "$GITHUB_OUTPUT"
            printf 'Physical-memory telemetry inputs:\n%s\n' "$matches"
          else
            {
              echo "required=false"
              echo "reason=no browser process-memory ownership inputs changed"
            } >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Build exact memory-test inputs
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
      - uses: ./.github/actions/setup-nix

      - name: Materialize the pinned musl source
        run: git submodule update --init --depth 1 libc/musl

      - name: Build the kernel and memory-churn fixture
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            bash scripts/build-musl.sh
            bash packages/registry/kernel/build-kernel.sh
            wasm32posix-cc \
              host/test/fixtures/process-memory-reclamation-churn.c \
              -o host/test/fixtures/process-memory-reclamation-churn.wasm
            mkdir -p process-memory-telemetry-inputs
            cp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              process-memory-telemetry-inputs/kandelo-kernel.wasm
            cp host/test/fixtures/process-memory-reclamation-churn.wasm \
              process-memory-telemetry-inputs/
          '

      - name: Upload exact test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-memory-telemetry-inputs
          path: process-memory-telemetry-inputs
          if-no-files-found: error
          retention-days: 7

  measure:
    name: ${{ matrix.engine }} counterbalanced memory sentinel
    needs: [scope, prepare]
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix host ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix apps/browser-demos ci --no-audit --no-fund

      - name: Install ${{ matrix.engine }}
        working-directory: apps/browser-demos
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Download exact test inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: process-memory-telemetry-inputs
          path: process-memory-telemetry-inputs

      - name: Measure low/high retired and live process memory
        id: measure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p process-memory-telemetry-results
          npx tsx \
            apps/browser-demos/scripts/process-memory-retirement-rss.ts \
            --engine "${{ matrix.engine }}" \
            --kernel \
              process-memory-telemetry-inputs/kandelo-kernel.wasm \
            --program \
              process-memory-telemetry-inputs/process-memory-reclamation-churn.wasm \
            --output \
              "process-memory-telemetry-results/${{ matrix.engine }}.json" \
            2>&1 |
            tee "process-memory-telemetry-results/${{ matrix.engine }}.log"

      - name: Upload raw engine-local trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-memory-rss-${{ matrix.engine }}
          path: process-memory-telemetry-results
          if-no-files-found: error
          retention-days: 90

      - name: Report engine-local size-contrast verdict
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          result="process-memory-telemetry-results/${{ matrix.engine }}.json"
          test -f "$result" || {
            echo "::error::RSS telemetry did not produce a JSON trace"
            exit 1
          }
          status="$(jq -r '.verdict.status' "$result")"
          reason="$(jq -r '.verdict.reason' "$result")"
          measured_commit="$(jq -r '.commit' "$result")"
          baseline_key="$(jq -r '.longitudinalBaselineKey' "$result")"
          {
            echo "### ${{ matrix.engine }} process memory"
            echo
            echo "- Verdict: \`$status\`"
            echo "- Reason: $reason"
            echo "- Longitudinal baseline: \`$baseline_key\`"
            echo "- Raw trace: \`process-memory-rss-${{ matrix.engine }}\`"
            jq -r \
              '.verdict.advisories[]? | "- Advisory: " + .' \
              "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$measured_commit" != "$EXPECTED_SHA" ]; then
            echo "::error::trace commit $measured_commit != $EXPECTED_SHA"
            exit 1
          fi
          case "$status" in
            pass)
              if [ "$MEASURE_OUTCOME" != "success" ]; then
                echo "::error::telemetry command outcome was $MEASURE_OUTCOME"
                exit 1
              fi
              ;;
            inconclusive)
              echo "::warning::$reason"
              # An insensitive sampler supplies no reclamation evidence.
              # Preserve the trace, but do not present this run as green.
              exit 1
              ;;
            regression)
              echo "::error::$reason"
              exit 1
              ;;
            *)
              echo "::error::unknown RSS telemetry verdict: $status"
              exit 1
              ;;
          esac

  gate:
    name: Process memory retirement telemetry gate
    needs: [scope, prepare, measure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require applicable engine results
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          TELEMETRY_REQUIRED: ${{ needs.scope.outputs.required }}
        run: |
          echo "Scope: $SCOPE_REASON"
          bash .github/scripts/process-memory-telemetry-gate.sh
