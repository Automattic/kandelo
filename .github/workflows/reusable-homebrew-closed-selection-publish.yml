name: Reusable Homebrew closed-selection publish

on:
  workflow_call:
    inputs:
      expected-caller-sha:
        description: Exact tap main commit selected before dispatch
        type: string
        required: true
      kandelo-ref:
        description: Exact protected-main commit that owns this publisher
        type: string
        required: true
      selection-plan:
        description: Canonical compact JSON naming roots and immutable handoffs
        type: string
        required: true
      selection-plan-sha256:
        description: SHA-256 of the canonical selection plan
        type: string
        required: true

concurrency:
  group: >-
    homebrew-closed-selection-${{ github.repository }}-${{ inputs.expected-caller-sha }}-${{ inputs.selection-plan-sha256 }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare credential-free closed selection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      caller-sha: ${{ steps.admit.outputs.caller-sha }}
      campaign-tag: ${{ steps.admit.outputs.campaign-tag }}
      campaign-kandelo-commit: >-
        ${{ steps.admit.outputs.campaign-kandelo-commit }}
      plan-sha256: ${{ steps.admit.outputs.plan-sha256 }}
      source-tap-commit: ${{ steps.admit.outputs.source-tap-commit }}
    steps:
      - name: Admit the protected tap caller and publisher ref
        shell: bash
        env:
          ACTUAL_CALLER_SHA: ${{ github.sha }}
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          SELECTION_PLAN: ${{ inputs.selection-plan }}
          PLAN_SHA256: ${{ inputs.selection-plan-sha256 }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [ "$CALLER_EVENT" = workflow_dispatch ]
          [ "$CALLER_REF" = refs/heads/main ]
          [ "${CALLER_REPOSITORY,,}" = \
            kandelo-dev/homebrew-tap-core ]
          [ "$CALLER_WORKFLOW_REF" = \
            "$CALLER_REPOSITORY/.github/workflows/publish-closed-selection.yml@refs/heads/main" ]
          [[ "$EXPECTED_CALLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          # WHY: workflow_dispatch resolves `main` when GitHub accepts the
          # request. Refuse a different resolved commit before preparing data.
          [ "$ACTUAL_CALLER_SHA" = "$EXPECTED_CALLER_SHA" ]
          [[ "$KANDELO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout exact Kandelo publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Require the publisher and tap caller to be current main
        shell: bash
        env:
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
        run: |
          set -euo pipefail
          [ "$(git -C kandelo rev-parse HEAD)" = "$KANDELO_REF" ]
          test -z "$(git -C kandelo status --porcelain=v1 \
            --untracked-files=all)"
          main_record="$(
            env -u GH_TOKEN -u GITHUB_TOKEN \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_TERMINAL_PROMPT=0 \
              git -c credential.helper= \
                -c http.https://github.com/.extraheader= \
                ls-remote https://github.com/Automattic/kandelo.git \
                refs/heads/main
          )"
          [ "$main_record" = "$KANDELO_REF"$'\t'refs/heads/main ]
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository kandelo-dev/homebrew-tap-core \
            --source-sha "$EXPECTED_CALLER_SHA"

      - name: Admit the exact digest-bound selection plan
        id: admit
        shell: bash
        env:
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          SELECTION_PLAN: ${{ inputs.selection-plan }}
          PLAN_SHA256: ${{ inputs.selection-plan-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closed-selection"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-closed-selection-controller.py \
              admit \
              --event "$GITHUB_EVENT_PATH" \
              --caller-sha "$GITHUB_SHA" \
              --expected-caller-sha "$EXPECTED_CALLER_SHA" \
              --github-ref "$GITHUB_REF" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --selection-plan "$SELECTION_PLAN" \
              --selection-plan-sha256 "$PLAN_SHA256" \
              --plan-out \
                "$RUNNER_TEMP/closed-selection/plan.json" \
              --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact campaign source tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ steps.admit.outputs.source-tap-commit }}
          path: source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Require campaign authorities on public main histories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_KANDELO_COMMIT: >-
            ${{ steps.admit.outputs.campaign-kandelo-commit }}
          SOURCE_TAP_COMMIT: ${{ steps.admit.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          bash \
            kandelo/.github/scripts/require-repository-main-contains.sh \
            --repository Automattic/kandelo \
            --source-sha "$CAMPAIGN_KANDELO_COMMIT"
          bash \
            kandelo/.github/scripts/require-repository-main-contains.sh \
            --repository kandelo-dev/homebrew-tap-core \
            --source-sha "$SOURCE_TAP_COMMIT"

      - name: Fetch the exact public campaign
        shell: bash
        env:
          CAMPAIGN_TAG: ${{ steps.admit.outputs.campaign-tag }}
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-prefix-campaign-executor.py \
              fetch-campaign-release \
              --repository kandelo-dev/homebrew-tap-core \
              --tag "$CAMPAIGN_TAG" \
              --out "$RUNNER_TEMP/closed-selection/campaign.json" \
              --receipt-out \
                "$RUNNER_TEMP/closed-selection/campaign-receipt.json"

      - name: Materialize the sealed campaign tap source
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN \
            python3 \
              kandelo/scripts/homebrew-prefix-campaign-executor.py \
              materialize-campaign-source \
              --campaign \
                "$RUNNER_TEMP/closed-selection/campaign.json" \
              --source-tap-root source-tap \
              --out "$RUNNER_TEMP/closed-selection/target-source"

      - name: Assemble the exact selection from public handoffs
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-closed-selection-controller.py \
              prepare \
              --plan "$RUNNER_TEMP/closed-selection/plan.json" \
              --campaign \
                "$RUNNER_TEMP/closed-selection/campaign.json" \
              --source-tap-root \
                "$RUNNER_TEMP/closed-selection/target-source" \
              --executor \
                kandelo/scripts/homebrew-prefix-campaign-executor.py \
              --out "$RUNNER_TEMP/closed-selection/prepared"

      - name: Retain the exact prepared selection
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-closed-selection-preparation
          path: ${{ runner.temp }}/closed-selection/prepared
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish and read back immutable selection
    needs: prepare
    runs-on: ubuntu-latest
    # WHY: this job independently repeats the bounded preparation path before
    # publishing. It needs the same ceiling as the original 128-Formula pass.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact Kandelo publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Automattic/kandelo
          ref: ${{ inputs.kandelo-ref }}
          path: kandelo
          persist-credentials: false
          submodules: false

      - name: Checkout protected tap lock authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ inputs.expected-caller-sha }}
          path: tap-authority
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact campaign source for reconstruction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.prepare.outputs.source-tap-commit }}
          path: verification-source-tap
          fetch-depth: 0
          persist-credentials: false

      - name: Admit the exact same-run preparation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_CALLER_SHA: ${{ github.sha }}
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          ADMITTED_CALLER_SHA: ${{ needs.prepare.outputs.caller-sha }}
          EXPECTED_ID: ${{ needs.prepare.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [ "$ACTUAL_CALLER_SHA" = "$EXPECTED_CALLER_SHA" ]
          [ "$ADMITTED_CALLER_SHA" = "$EXPECTED_CALLER_SHA" ]
          # WHY: upload-artifact exposes a bare SHA-256 value, while the
          # Actions REST API prefixes the same digest with `sha256:`.
          expected_rest_digest="sha256:$EXPECTED_DIGEST"
          artifact="$RUNNER_TEMP/closed-selection-artifact.json"
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ID" \
            >"$artifact"
          jq -e \
            --arg digest "$expected_rest_digest" \
            --argjson id "$EXPECTED_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$EXPECTED_CALLER_SHA" '
              .id == $id and
              .name == "homebrew-closed-selection-preparation" and
              .expired == false and .digest == $digest and
              .workflow_run.id == $run_id and
              .workflow_run.head_sha == $head_sha
            ' "$artifact" >/dev/null

      - name: Download only the same-run prepared selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/closed-selection-preparation

      - name: Fetch the exact campaign for independent verification
        shell: bash
        env:
          CAMPAIGN_TAG: ${{ needs.prepare.outputs.campaign-tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closed-selection-verification"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-prefix-campaign-executor.py \
              fetch-campaign-release \
              --repository kandelo-dev/homebrew-tap-core \
              --tag "$CAMPAIGN_TAG" \
              --out \
                "$RUNNER_TEMP/closed-selection-verification/campaign.json" \
              --receipt-out \
                "$RUNNER_TEMP/closed-selection-verification/receipt.json"

      - name: Materialize campaign source for independent reconstruction
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-prefix-campaign-executor.py \
              materialize-campaign-source \
              --campaign \
                "$RUNNER_TEMP/closed-selection-verification/campaign.json" \
              --source-tap-root verification-source-tap \
              --out \
                "$RUNNER_TEMP/closed-selection-verification/target-source"

      - name: Reconstruct and verify the downloaded selection
        shell: bash
        env:
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          ADMITTED_CALLER_SHA: ${{ needs.prepare.outputs.caller-sha }}
          SELECTION_PLAN: ${{ inputs.selection-plan }}
          PLAN_SHA256: ${{ inputs.selection-plan-sha256 }}
          ADMITTED_PLAN_SHA256: ${{ needs.prepare.outputs.plan-sha256 }}
        run: |
          set -euo pipefail
          [ "$EXPECTED_CALLER_SHA" = "$ADMITTED_CALLER_SHA" ]
          [ "$PLAN_SHA256" = "$ADMITTED_PLAN_SHA256" ]
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            python3 \
              kandelo/scripts/homebrew-closed-selection-controller.py \
              reconstruct-verify \
              --selection-plan "$SELECTION_PLAN" \
              --selection-plan-sha256 "$PLAN_SHA256" \
              --prepared-release \
                "$RUNNER_TEMP/closed-selection-preparation" \
              --campaign \
                "$RUNNER_TEMP/closed-selection-verification/campaign.json" \
              --source-tap-root \
                "$RUNNER_TEMP/closed-selection-verification/target-source" \
              --executor \
                kandelo/scripts/homebrew-prefix-campaign-executor.py

      - name: Recheck protected publication authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_CALLER_SHA: ${{ github.sha }}
          EXPECTED_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
        run: |
          set -euo pipefail
          [ "$ACTUAL_CALLER_SHA" = "$EXPECTED_CALLER_SHA" ]
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository Automattic/kandelo \
            --source-sha "$KANDELO_REF"
          bash kandelo/.github/scripts/require-exact-repository-main.sh \
            --repository kandelo-dev/homebrew-tap-core \
            --source-sha "$EXPECTED_CALLER_SHA"

      - name: Publish and anonymously read back the exact selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KANDELO_REF: ${{ inputs.kandelo-ref }}
          TAP_CALLER_SHA: ${{ inputs.expected-caller-sha }}
          SELECTION_PLAN: ${{ inputs.selection-plan }}
          PLAN_SHA256: ${{ inputs.selection-plan-sha256 }}
          CAMPAIGN_KANDELO_COMMIT: >-
            ${{ needs.prepare.outputs.campaign-kandelo-commit }}
          SOURCE_TAP_COMMIT: ${{ needs.prepare.outputs.source-tap-commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closed-selection-publication"
          # WHY: the generic publisher acquires a run-owned Git ref lock,
          # rechecks both main histories before every write, and removes all
          # credentials for its final byte-for-byte public readback.
          bash \
            kandelo/scripts/publish-homebrew-closed-selection-release.sh \
            --prepared-release \
              "$RUNNER_TEMP/closed-selection-preparation" \
            --campaign \
              "$RUNNER_TEMP/closed-selection-verification/campaign.json" \
            --lock-root "$GITHUB_WORKSPACE/tap-authority" \
            --receipt \
              "$RUNNER_TEMP/closed-selection-publication/receipt.json" \
            --selection-plan "$SELECTION_PLAN" \
            --selection-plan-sha256 "$PLAN_SHA256" \
            --exact-execution-kandelo-main-sha "$KANDELO_REF" \
            --exact-execution-target-main-sha "$TAP_CALLER_SHA" \
            --kandelo-main-contains-sha \
              "$CAMPAIGN_KANDELO_COMMIT" \
            --target-main-contains-sha "$SOURCE_TAP_COMMIT"

      - name: Retain public readback receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            homebrew-closed-selection-publication-${{ inputs.selection-plan-sha256 }}
          path: ${{ runner.temp }}/closed-selection-publication/receipt.json
          if-no-files-found: error
          retention-days: 30
