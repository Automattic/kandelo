name: Browser demo smoke tests

on:
  pull_request:
    paths:
      - ".github/workflows/browser-demos-ci.yml"
      - "apps/browser-demos/**"
      - "docs/**"
      - "docs-site/**"
      - "host/package.json"
      - "host/package-lock.json"
      - "host/src/**"
      - "host/test/**"
      - "host/tsconfig.json"
      - "host/vitest*.ts"
      - "host/tsup.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci-vitest-evidence-classes.tsv"
      - "web-libs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-demos-ci.yml"
      - "apps/browser-demos/**"
      - "docs/**"
      - "docs-site/**"
      - "host/package.json"
      - "host/package-lock.json"
      - "host/src/**"
      - "host/test/**"
      - "host/tsconfig.json"
      - "host/vitest*.ts"
      - "host/tsup.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci-vitest-evidence-classes.tsv"
      - "web-libs/**"

permissions:
  contents: read

jobs:
  coi:
    name: COI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate user guide publication
        env:
          VITEPRESS_BASE: /kandelo/guide/
        run: |
          set -euo pipefail
          npm run docs:build

      - name: Install browser demo dependencies
        working-directory: apps/browser-demos
        run: npm ci --no-audit --no-fund

      - name: Install host dependencies
        working-directory: host
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund

      - name: Typecheck host package
        working-directory: host
        run: npm run typecheck

      # These node:test files sat in the tree with no runner, so drift in the
      # contracts they guard (Vite deployment config, service-worker scope,
      # VFS product loading) went unnoticed. They need no browser, so they run
      # before the Playwright install.
      - name: Run browser demo unit tests
        working-directory: apps/browser-demos
        run: npm run test:unit

      - name: Check memory ownership and lifecycle without product artifacts
        working-directory: host
        run: npx vitest run --config vitest.browser-memory.config.ts

      - name: Install Playwright browsers
        working-directory: apps/browser-demos
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke tests
        working-directory: apps/browser-demos
        run: |
          npx playwright test \
            test/boot-current-boundary.spec.ts \
            test/coi.spec.ts \
            test/machine-audio-activation.spec.ts \
            test/vfs-import-seal-boundary.spec.ts \
            test/wasm-trap-signal.spec.ts \
            test/worker-exit-trap.spec.ts \
            --project=chromium \
            --project=firefox \
            --project=webkit
