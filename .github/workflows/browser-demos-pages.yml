name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # WHY: the canonical browser product resolves a transitive package
    # closure whose declared and shared inputs can grow. Every main push must
    # supersede the deployed product; a maintained path allowlist could leave
    # Pages on an older admitted generation.
  workflow_dispatch:

concurrency:
  group: kandelo-gh-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

env:
  # Exercise GitHub's post-Node-20 action runtime now, before it becomes
  # the runner default for actions that still declare node20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch musl for repository-owned browser support programs
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install host dependencies
        working-directory: host
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund

      - name: Install browser demo dependencies
        working-directory: apps/browser-demos
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Typecheck host package
        working-directory: host
        run: npm run typecheck

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Verify browser package projection is current
        run: |
          bash scripts/dev-shell.sh bash -c '
            host_target="$(rustc -vV | sed -n "s/^host: //p")"
            cargo run -p xtask --target "$host_target" --quiet -- \
              build-deps program-index-check \
              packages/registry packages/registry/program-packages.json
          '

      - name: Isolate the canonical bottled browser product
        run: |
          set -euo pipefail
          product_cache="$RUNNER_TEMP/pages-canonical-bottle-cache"
          test ! -e "$product_cache"
          # WHY: an empty runner-local cache proves this deployment can recover
          # the complete canonical package generation. Reusing another job's
          # cache could hide an unavailable or stale public product archive.
          echo "WASM_POSIX_BINARY_CACHE_ROOT=$product_cache" >> "$GITHUB_ENV"

      - name: Prepare browser demo assets
        run: |
          set -euo pipefail
          # WHY: --fetch-only prevents a missing package archive from being
          # replaced by a source build. The current gallery still compiles its
          # repository-owned support-program bundle and derives VFS images;
          # neither path can replace the canonical shell bound below.
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            ./run.sh --fetch-only prepare-browser

      - name: Bind the canonical bottled shell product
        id: shell_product
        run: |
          set -euo pipefail
          image=$(bash scripts/resolve-binary.sh programs/shell.vfs.zst)
          bootstrap=$(bash scripts/resolve-binary.sh \
            programs/homebrew-bootstrap/homebrew-bootstrap.zip)
          report="$RUNNER_TEMP/homebrew-main-shell-public-product.json"
          for path in "$image" "$bootstrap"; do
            test -f "$path"
            test ! -L "$path"
          done
          bash scripts/verify-homebrew-main-shell-artifact-lock.sh \
            --lock homebrew/main-shell-lazy-artifact-lock.json \
            --expected-source-date-epoch 0 \
            --artifact "$image"
          test ! -e "$report"
          # WHY: keep the inspector's rejection cases beside the only
          # production workflow that relies on its admission decision.
          bash scripts/dev-shell.sh npx tsx --test \
            scripts/inspect-homebrew-main-shell-public-product.test.ts
          bash scripts/dev-shell.sh npx tsx \
            scripts/inspect-homebrew-main-shell-public-product.ts \
              --image "$image" \
              --homebrew-bootstrap-archive "$bootstrap" \
              --homebrew-bootstrap-spec \
                homebrew/main-shell-brew-package-tree.json \
              --homebrew-runtime-support \
                homebrew/main-shell-homebrew-runtime-support.json \
              --out "$report"
          jq -e '
            .schema == 1 and
            .kind == "kandelo-homebrew-main-shell-public-product" and
            (.image.sha256 | test("^[0-9a-f]{64}$")) and
            (.image.bytes > 0) and
            (.homebrew_bootstrap.sha256 | test("^[0-9a-f]{64}$")) and
            (.homebrew_bootstrap.bytes > 0) and
            .homebrew_bootstrap.activation_root == "/usr/bin/brew" and
            (.bottle_mirror.plan_url |
              startswith("https://github.com/") and
              endswith("/kandelo-homebrew-bottle-mirror-plan.json")) and
            (.bottle_mirror.asset_count > 0)
          ' "$report" >/dev/null
          {
            echo "image=$image"
            echo "image_sha256=$(jq -er '.image.sha256' "$report")"
            echo "bootstrap_sha256=$(jq -er \
              '.homebrew_bootstrap.sha256' "$report")"
            echo "bootstrap_bytes=$(jq -er \
              '.homebrew_bootstrap.bytes' "$report")"
            echo "mirror_plan_url=$(jq -er \
              '.bottle_mirror.plan_url' "$report")"
          } >>"$GITHUB_OUTPUT"

      - name: Build browser demos for GitHub Pages
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          VITE_CORS_PROXY_URL: https://wordpress-playground-cors-proxy.net/?
        run: |
          set -euo pipefail
          npm run build
          # WHY: Vite imports the resolver-selected shell under a hashed asset
          # name. Verify that exact emitted asset; an unhashed public copy can
          # be absent or stale without affecting the image the browser boots.
          bash ../../scripts/verify-browser-shell-vfs-asset.sh \
            dist "${{ steps.shell_product.outputs.image }}"

      # The root publisher replaces the complete branch so content-addressed
      # browser assets cannot accumulate forever. Include the independently
      # published documentation trees in that replacement.
      - name: Build user guide for the complete Pages tree
        env:
          VITEPRESS_BASE: /kandelo/guide/
        run: npm run docs:build

      - name: Typecheck API docs for the complete Pages tree
        working-directory: host
        run: npx tsc --noEmit -p tsconfig.docs.json

      - name: Build API docs for the complete Pages tree
        working-directory: host
        run: npx typedoc

      - name: Add documentation to the complete Pages tree
        run: |
          cp -R docs-site/.vitepress/dist apps/browser-demos/dist/guide
          cp -R host/docs apps/browser-demos/dist/api

      - name: Boot the canonical bottled Pages shell in Chromium
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          KANDELO_BROWSER_DEMO_INPUTS: main
          KANDELO_HOMEBREW_MAIN_SHELL_STRICT: "1"
          KANDELO_HOMEBREW_MAIN_SHELL_SHA256: ${{ steps.shell_product.outputs.image_sha256 }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256: ${{ steps.shell_product.outputs.bootstrap_sha256 }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES: ${{ steps.shell_product.outputs.bootstrap_bytes }}
          KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE: public
          KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL: ${{ steps.shell_product.outputs.mirror_plan_url }}
          KANDELO_PLAYWRIGHT_SERVE_DIST: "1"
          KANDELO_TEST_BASE_URL: http://127.0.0.1:5401/kandelo/
        run: |
          set -euo pipefail
          bash ../../scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            npx playwright test \
            test/kandelo-homebrew-main-shell.spec.ts \
            --project=chromium

      - name: Enforce the GitHub Pages published-site size limit
        run: node scripts/check-pages-publish-size.mjs apps/browser-demos/dist 1000000000

      # Concurrency removes the usual superseded run promptly, but GitHub does
      # not guarantee the order in which runs enter a concurrency group. Query
      # this workflow immediately before its only publishing step so a delayed
      # older run cannot overwrite the newest triggered complete-tree build.
      - name: Confirm this is the newest Pages run
        id: publish_freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pages-run-freshness.sh

      - name: Deploy to gh-pages
        if: steps.publish_freshness.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/browser-demos/dist
          force_orphan: true
