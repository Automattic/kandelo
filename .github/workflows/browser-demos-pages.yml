name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # WHY: the temporary source-shell lane composes a transitive package
    # closure whose declared and shared tool inputs can grow. Every main push
    # must supersede the deployed product; a maintained path allowlist could
    # silently leave Pages on an older source closure.
  workflow_dispatch:

concurrency:
  group: kandelo-gh-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

env:
  # Exercise GitHub's post-Node-20 action runtime now, before it becomes
  # the runner default for actions that still declare node20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Fetch musl submodule
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install host dependencies
        working-directory: host
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund

      - name: Install browser demo dependencies
        working-directory: apps/browser-demos
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Typecheck host package
        working-directory: host
        run: npm run typecheck

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Verify browser package projection is current
        run: |
          bash scripts/dev-shell.sh bash -c '
            host_target="$(rustc -vV | sed -n "s/^host: //p")"
            cargo run -p xtask --target "$host_target" --quiet -- \
              build-deps program-index-check \
              packages/registry packages/registry/program-packages.json
          '

      - name: Build current wasm32 sysroot for source-built browser packages
        run: |
          set -euo pipefail
          # WHY: the temporary shell activation recipe is deliberately newer
          # than every canonical package archive. Pages must be able to follow
          # the normal source fallback instead of deploying an old-ABI shell.
          bash scripts/dev-shell.sh bash scripts/build-musl.sh
          test -f sysroot/lib/libc.a

      - name: Isolate the exact-main source package closure
        run: |
          set -euo pipefail
          abi=$(sed -nE 's/^pub const ABI_VERSION: u32 = ([0-9]+);$/\1/p' \
            crates/shared/src/lib.rs)
          [[ "$abi" =~ ^[0-9]+$ ]]
          empty_index="$RUNNER_TEMP/pages-source-empty-index.toml"
          source_cache="$RUNNER_TEMP/pages-source-exact-cache"
          test ! -e "$empty_index"
          test ! -e "$source_cache"
          cat >"$empty_index" <<EOF
          abi_version = $abi
          generated_at = "1970-01-01T00:00:00Z"
          generator = "exact-main Pages source closure"
          EOF
          # WHY: Pages is the first consumer after main lands. It must not turn
          # a pre-main rehearsal package into deployed product bytes merely
          # because that package happens to have the right numeric ABI.
          echo "WASM_POSIX_BINARY_INDEX_URL=file://${empty_index}" >> "$GITHUB_ENV"
          echo "WASM_POSIX_BINARY_CACHE_ROOT=$source_cache" >> "$GITHUB_ENV"

      - name: Prepare browser demo assets
        run: |
          # WHY: Pages publishes the first product bytes from this exact main
          # checkout. Select the distinct source bridge explicitly and bind
          # archive provenance to the event checkout; an empty index alone
          # must never fall back to the canonical bottle-backed shell recipe.
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            "WASM_POSIX_SOURCE_ROOTFS_SHELL_ISOLATION=pages-exact-main-v1" \
            "WASM_POSIX_SOURCE_ROOTFS_SHELL_RUNNER_ENVIRONMENT=${{ runner.environment }}" \
            "WASM_POSIX_SOURCE_ROOTFS_SHELL_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
            "WASM_POSIX_SOURCE_ROOTFS_SHELL_COMMIT=$GITHUB_SHA" \
            ./run.sh prepare-browser --source-rootfs-shell --allow-stale

      - name: Build browser demos for GitHub Pages
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          VITE_CORS_PROXY_URL: https://wordpress-playground-cors-proxy.net/?
        run: npm run build

      # The root publisher replaces the complete branch so content-addressed
      # browser assets cannot accumulate forever. Include the independently
      # published documentation trees in that replacement.
      - name: Build user guide for the complete Pages tree
        env:
          VITEPRESS_BASE: /kandelo/guide/
        run: npm run docs:build

      - name: Typecheck API docs for the complete Pages tree
        working-directory: host
        run: npx tsc --noEmit -p tsconfig.docs.json

      - name: Build API docs for the complete Pages tree
        working-directory: host
        run: npx typedoc

      - name: Add documentation to the complete Pages tree
        run: |
          cp -R docs-site/.vitepress/dist apps/browser-demos/dist/guide
          cp -R host/docs apps/browser-demos/dist/api

      - name: Boot the sealed Pages shell product in Chromium
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          KANDELO_SOURCE_ROOTFS_SHELL_STRICT: "1"
          KANDELO_PLAYWRIGHT_SERVE_DIST: "1"
          KANDELO_TEST_BASE_URL: http://127.0.0.1:5401/kandelo/
        run: |
          set -euo pipefail
          shell_sha=$(sha256sum dist/shell.vfs.zst | awk '{print $1}')
          [[ "$shell_sha" =~ ^[0-9a-f]{64}$ ]]
          KANDELO_MAIN_SHELL_SHA256="$shell_sha" \
            bash ../../scripts/dev-shell.sh env \
              "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
              npx playwright test \
              test/kandelo-source-rootfs-shell.spec.ts \
              --project=chromium

      - name: Enforce the GitHub Pages published-site size limit
        run: node scripts/check-pages-publish-size.mjs apps/browser-demos/dist 1000000000

      # Concurrency removes the usual superseded run promptly, but GitHub does
      # not guarantee the order in which runs enter a concurrency group. Query
      # this workflow immediately before its only publishing step so a delayed
      # older run cannot overwrite the newest triggered complete-tree build.
      - name: Confirm this is the newest Pages run
        id: publish_freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pages-run-freshness.sh

      - name: Deploy to gh-pages
        if: steps.publish_freshness.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/browser-demos/dist
          force_orphan: true
