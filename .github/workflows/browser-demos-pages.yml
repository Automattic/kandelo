name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # WHY: the canonical browser product resolves a transitive package
    # closure whose declared and shared inputs can grow. Every main push must
    # supersede the deployed product; a maintained path allowlist could leave
    # Pages on an older admitted generation.
  workflow_dispatch:

concurrency:
  group: kandelo-gh-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

env:
  # Exercise GitHub's post-Node-20 action runtime now, before it becomes
  # the runner default for actions that still declare node20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch musl for repository-owned browser support programs
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install host dependencies
        working-directory: host
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund

      - name: Install browser demo dependencies
        working-directory: apps/browser-demos
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Typecheck host package
        working-directory: host
        run: npm run typecheck

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Verify browser package projection is current
        run: |
          bash scripts/dev-shell.sh bash -c '
            host_target="$(rustc -vV | sed -n "s/^host: //p")"
            source_root="$(pwd -P)"
            cargo run -p xtask --target "$host_target" --quiet -- \
              build-deps program-index-check \
              --source-repo-root "$source_root" \
              packages/registry packages/registry/program-packages.json
          '

      - name: Isolate canonical package resolution
        run: |
          set -euo pipefail
          product_cache="$RUNNER_TEMP/pages-canonical-package-cache"
          test ! -e "$product_cache"
          # WHY: an empty runner-local cache proves this deployment can recover
          # the complete canonical package generation. Reusing another job's
          # cache could hide an unavailable or stale public product archive.
          echo "WASM_POSIX_BINARY_CACHE_ROOT=$product_cache" >> "$GITHUB_ENV"

      - name: Prepare browser demo assets
        run: |
          set -euo pipefail
          # WHY: --fetch-only prevents a missing package archive from being
          # replaced by a source build. The current gallery still compiles its
          # repository-owned support-program bundle and derives VFS images;
          # neither path can replace the canonical shell bound below.
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            ./run.sh --fetch-only prepare-browser

      - name: Bind canonical package images
        id: package_products
        run: |
          set -euo pipefail
          shell_image=$(bash scripts/resolve-binary.sh programs/shell.vfs.zst)
          node_image=$(bash scripts/resolve-binary.sh programs/node-vfs.vfs.zst)
          report="$RUNNER_TEMP/canonical-flat-shell-report.json"
          for path in "$shell_image" "$node_image"; do
            test -f "$path"
            test ! -L "$path"
          done
          test ! -e "$report"
          # WHY: resolver identity alone does not prove the shell has no lazy
          # state or that its checked-in selection and guest configs match.
          # Re-run both the rejection suite and exact image inspection at the
          # publication boundary before Vite imports the package bytes.
          bash scripts/dev-shell.sh npx tsx --test \
            scripts/inspect-canonical-flat-shell.test.ts
          bash scripts/dev-shell.sh npx tsx \
            scripts/inspect-canonical-flat-shell.ts \
              --image "$shell_image" \
              --selection homebrew/main-shell-flat-selection.json \
              --shell-config homebrew/main-shell-default.json \
              --demo-config homebrew/main-shell-flat-demo.json \
              --out "$report"
          jq -e '
            .schema == 1 and
            .kind == "kandelo-canonical-flat-shell" and
            .transport == {
              kind: "flat-self-contained",
              mirror_required: false
            } and
            (.image.sha256 | test("^[0-9a-f]{64}$")) and
            (.image.bytes > 0) and
            .selection.requested_vfs_filename == "shell.vfs.zst"
          ' "$report" >/dev/null
          {
            echo "shell_image=$shell_image"
            echo "node_image=$node_image"
            echo "shell_sha256=$(jq -er '.image.sha256' "$report")"
            echo "node_sha256=$(sha256sum "$node_image" | awk '{print $1}')"
          } >>"$GITHUB_OUTPUT"

      - name: Build browser demos for GitHub Pages
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          VITE_CORS_PROXY_URL: https://wordpress-playground-cors-proxy.net/?
        run: |
          set -euo pipefail
          npm run build
          # WHY: Vite imports resolver-selected package images under hashed
          # asset names. Verify the exact emitted shell and Node bytes; an
          # unhashed public copy is not publication authority.
          bash ../../scripts/verify-browser-shell-vfs-asset.sh \
            dist "${{ steps.package_products.outputs.shell_image }}"
          bash ../../scripts/verify-browser-shell-vfs-asset.sh \
            dist "${{ steps.package_products.outputs.node_image }}" node-vfs.vfs

      # The root publisher replaces the complete branch so content-addressed
      # browser assets cannot accumulate forever. Include the independently
      # published documentation trees in that replacement.
      - name: Build user guide for the complete Pages tree
        env:
          VITEPRESS_BASE: /kandelo/guide/
        run: |
          set -euo pipefail
          # WHY: documentation checks belong to the Pages publication path.
          # Adding them to the repository-wide package scripts changes the
          # cache identity of unrelated Kandelo runtime packages.
          node --test docs-site/.vitepress/homebrew-doc-links.test.mjs
          npm run docs:build
          node --test docs-site/.vitepress/homebrew-doc-output.test.mjs

      - name: Typecheck API docs for the complete Pages tree
        working-directory: host
        run: npx tsc --noEmit -p tsconfig.docs.json

      - name: Build API docs for the complete Pages tree
        working-directory: host
        run: npx typedoc

      - name: Add documentation to the complete Pages tree
        run: |
          cp -R docs-site/.vitepress/dist apps/browser-demos/dist/guide
          cp -R host/docs apps/browser-demos/dist/api

      - name: Boot the canonical flat Pages shell in Chromium
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          KANDELO_BROWSER_DEMO_INPUTS: main
          KANDELO_CANONICAL_FLAT_SHELL_STRICT: "1"
          KANDELO_CANONICAL_FLAT_SHELL_SHA256: ${{ steps.package_products.outputs.shell_sha256 }}
          KANDELO_PLAYWRIGHT_SERVE_DIST: "1"
          KANDELO_TEST_BASE_URL: http://127.0.0.1:5401/kandelo/
        run: |
          set -euo pipefail
          bash ../../scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            "VITE_BASE=$VITE_BASE" \
            "KANDELO_BROWSER_DEMO_INPUTS=$KANDELO_BROWSER_DEMO_INPUTS" \
            "KANDELO_CANONICAL_FLAT_SHELL_STRICT=$KANDELO_CANONICAL_FLAT_SHELL_STRICT" \
            "KANDELO_CANONICAL_FLAT_SHELL_SHA256=$KANDELO_CANONICAL_FLAT_SHELL_SHA256" \
            "KANDELO_PLAYWRIGHT_SERVE_DIST=$KANDELO_PLAYWRIGHT_SERVE_DIST" \
            "KANDELO_TEST_BASE_URL=$KANDELO_TEST_BASE_URL" \
            npx playwright test \
            test/kandelo-canonical-flat-shell.spec.ts \
            --project=chromium

      - name: Run exact Pages Node npm acceptance
        working-directory: apps/browser-demos
        env:
          VITE_BASE: /kandelo/
          KANDELO_BROWSER_DEMO_INPUTS: node
          KANDELO_PLAYWRIGHT_SERVE_DIST: "1"
          KANDELO_TEST_BASE_URL: http://127.0.0.1:5401/kandelo/
        run: |
          set -euo pipefail
          bash ../../scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            "VITE_BASE=$VITE_BASE" \
            "KANDELO_BROWSER_DEMO_INPUTS=$KANDELO_BROWSER_DEMO_INPUTS" \
            "KANDELO_PLAYWRIGHT_SERVE_DIST=$KANDELO_PLAYWRIGHT_SERVE_DIST" \
            "KANDELO_TEST_BASE_URL=$KANDELO_TEST_BASE_URL" \
            npx playwright test test/kandelo-node.spec.ts \
            --grep 'Kandelo Node demo installs cowsay with npm' \
            --project=chromium

      - name: Enforce the GitHub Pages published-site size limit
        run: node scripts/check-pages-publish-size.mjs apps/browser-demos/dist 1000000000

      # Concurrency removes the usual superseded run promptly, but GitHub does
      # not guarantee the order in which runs enter a concurrency group. Query
      # this workflow immediately before its only publishing step so a delayed
      # older run cannot overwrite the newest triggered complete-tree build.
      - name: Confirm this is the newest Pages run
        id: publish_freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pages-run-freshness.sh

      - name: Deploy to gh-pages
        if: steps.publish_freshness.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/browser-demos/dist
          force_orphan: true
