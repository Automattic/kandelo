name: Kandelo ABI staging PR Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "One open PR to reconcile; empty scans all open same-repository PRs"
        required: false
        type: string

permissions: {}

concurrency:
  group: abi-staging-pr-check-${{ github.event.pull_request.number || inputs.pull-request-number || 'scan' }}
  cancel-in-progress: false

jobs:
  enumerate-open-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      protected-sha: ${{ steps.resolve.outputs.protected-sha }}
      subjects: ${{ steps.resolve.outputs.subjects }}
      tap-sha: ${{ steps.resolve.outputs.tap-sha }}
    steps:
      - name: Resolve protected revisions and same-repository-only heads
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_PR: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          [[ $DEFAULT_BRANCH == main ]]
          protected_sha=$(gh api "/repos/${repository}/git/ref/heads/main" --jq '.object.sha')
          tap_sha=$(gh api "/repos/kandelo-dev/homebrew-tap-core/git/ref/heads/main" --jq '.object.sha')
          [[ $protected_sha =~ ^[0-9a-f]{40}$ && $tap_sha =~ ^[0-9a-f]{40}$ ]]

          case "$EVENT_NAME" in
            pull_request_target)
              jq -cS --arg repository "$repository" '
                [.pull_request |
                  select(.state == "open") |
                  select(.head.repo.full_name == $repository) |
                  {
                    head: .head.sha,
                    head_repository: .head.repo.full_name,
                    number: .number,
                    repository: .base.repo.full_name
                  }
                ]
              ' "$GITHUB_EVENT_PATH" >"$RUNNER_TEMP/subjects.json"
              jq -e --arg head "$EVENT_HEAD" '
                length == 0 or (length == 1 and .[0].head == $head)
              ' "$RUNNER_TEMP/subjects.json" >/dev/null
              ;;
            workflow_dispatch)
              if [[ -n $MANUAL_PR ]]; then
                [[ $MANUAL_PR =~ ^[1-9][0-9]*$ ]]
                gh api "/repos/${repository}/pulls/${MANUAL_PR}" |
                  jq -cS --arg repository "$repository" '
                    [. |
                      select(.state == "open") |
                      select(.head.repo.full_name == $repository) |
                      {
                        head: .head.sha,
                        head_repository: .head.repo.full_name,
                        number: .number,
                        repository: .base.repo.full_name
                      }
                    ]
                  ' >"$RUNNER_TEMP/subjects.json"
              else
                gh api --paginate --slurp "/repos/${repository}/pulls?state=open&per_page=100" |
                  jq -cS --arg repository "$repository" '
                    [.[][] |
                      select(.head.repo.full_name == $repository) |
                      {
                        head: .head.sha,
                        head_repository: .head.repo.full_name,
                        number: .number,
                        repository: .base.repo.full_name
                      }
                    ] | sort_by(.number)
                  ' >"$RUNNER_TEMP/subjects.json"
              fi
              ;;
            schedule)
              gh api --paginate --slurp "/repos/${repository}/pulls?state=open&per_page=100" |
                jq -cS --arg repository "$repository" '
                  [.[][] |
                    select(.head.repo.full_name == $repository) |
                    {
                      head: .head.sha,
                      head_repository: .head.repo.full_name,
                      number: .number,
                      repository: .base.repo.full_name
                    }
                  ] | sort_by(.number)
                ' >"$RUNNER_TEMP/subjects.json"
              ;;
            *) exit 2 ;;
          esac

          jq -e --arg repository "$repository" '
            type == "array" and length <= 256 and
            ([.[].number] | length == (unique | length)) and
            all(.[];
              (.number | type == "number" and . >= 1 and floor == .) and
              .repository == $repository and
              .head_repository == $repository and
              (.head | type == "string" and test("^[0-9a-f]{40}$"))
            )
          ' "$RUNNER_TEMP/subjects.json" >/dev/null
          subjects=$(jq -c '{include: map({subject: .})}' "$RUNNER_TEMP/subjects.json")
          {
            printf 'protected-sha=%s\n' "$protected_sha"
            printf 'tap-sha=%s\n' "$tap_sha"
            printf 'subjects=%s\n' "$subjects"
          } >>"$GITHUB_OUTPUT"

  collect-project:
    needs: [enumerate-open-prs]
    if: ${{ needs.enumerate-open-prs.outputs.subjects != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.enumerate-open-prs.outputs.subjects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout captured protected Kandelo authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.enumerate-open-prs.outputs.protected-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Checkout captured protected tap authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kandelo-dev/homebrew-tap-core
          ref: ${{ needs.enumerate-open-prs.outputs.tap-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: tap

      - name: Checkout inert exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.subject.head_repository }}
          ref: ${{ matrix.subject.head }}
          fetch-depth: 1
          persist-credentials: false
          path: exact-head

      - name: Set up declared protected build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Collect and project bounded public facts
        env:
          EXPECTED_HEAD: ${{ matrix.subject.head }}
          EXPECTED_PR: ${{ matrix.subject.number }}
          EXPECTED_REPOSITORY: ${{ matrix.subject.repository }}
          PROTECTED_SHA: ${{ needs.enumerate-open-prs.outputs.protected-sha }}
          TAP_SHA: ${{ needs.enumerate-open-prs.outputs.tap-sha }}
        run: |
          set -euo pipefail
          [[ $EXPECTED_REPOSITORY == "$GITHUB_REPOSITORY" ]]
          [[ $EXPECTED_HEAD =~ ^[0-9a-f]{40}$ && $EXPECTED_PR =~ ^[1-9][0-9]*$ ]]
          [[ $(git -C authority rev-parse HEAD) == "$PROTECTED_SHA" ]]
          [[ $(git -C tap rev-parse HEAD) == "$TAP_SHA" ]]
          [[ $(git -C exact-head rev-parse HEAD) == "$EXPECTED_HEAD" ]]
          exact_tree=$(git -C exact-head rev-parse 'HEAD^{tree}')
          [[ $exact_tree =~ ^[0-9a-f]{40}$ ]]
          [[ -z $(git -C exact-head status --porcelain=v1 --untracked-files=all) ]]
          env -u GH_TOKEN -u GITHUB_TOKEN git -C exact-head fetch --no-tags origin "$PROTECTED_SHA"

          output="$RUNNER_TEMP/abi-staging-pr-check"
          mkdir -p "$output"
          env -u GH_TOKEN -u GITHUB_TOKEN git -C exact-head diff --name-only -z \
            "$PROTECTED_SHA" "$EXPECTED_HEAD" >"$output/changed-paths.bin"

          host_target=$(cd authority && bash scripts/dev-shell.sh \
            bash -c 'rustc -vV | awk "/^host/ {print \$2}"')
          (cd authority && bash scripts/dev-shell.sh \
            cargo build -p xtask --target "$host_target")
          authority_xtask="$GITHUB_WORKSPACE/authority/target/$host_target/debug/xtask"
          (
            cd authority
            "$authority_xtask" abi-staging request-policy check \
              --source abi/staging/request-policy.toml \
              --generated abi/staging/request-policy.generated.json
            "$authority_xtask" abi-staging guard-codes check \
              --source abi/staging/guard-codes.toml \
              --generated abi/staging/guard-codes.generated.json
          )
          "$authority_xtask" abi-staging request classify \
            --changed-paths "$output/changed-paths.bin" \
            --out "$output/change-classes.json"

          policy_sha=$(sha256sum authority/abi/staging/request-policy.generated.json | awk '{print $1}')
          policy_version=$(jq -r '.version' authority/abi/staging/request-policy.generated.json)
          guard_sha=$(sha256sum authority/abi/staging/guard-codes.generated.json | awk '{print $1}')
          guard_version=$(jq -r '.version' authority/abi/staging/guard-codes.generated.json)
          [[ $policy_sha =~ ^[0-9a-f]{64}$ && $guard_sha =~ ^[0-9a-f]{64}$ ]]
          [[ $policy_version =~ ^[1-9][0-9]*$ && $guard_version =~ ^[1-9][0-9]*$ ]]
          applicable_count=$(jq 'length' "$output/change-classes.json")
          requirements_sha=$(printf '0%.0s' {1..64})
          if ((applicable_count > 0)); then
            "$authority_xtask" abi-staging request requirements \
              --exact-head-root "$GITHUB_WORKSPACE/exact-head" \
              --change-classes "$output/change-classes.json" \
              --requirements-out "$output/expected-requirements.json" \
              --formulae-out "$output/formula-requirements.json"
            requirements_sha=$(jq -r '.digest' "$output/expected-requirements.json")
            [[ $requirements_sha =~ ^[0-9a-f]{64}$ ]]
          fi

          jq -cnS \
            --arg repository "$EXPECTED_REPOSITORY" \
            --arg head "$EXPECTED_HEAD" \
            --arg requirements "$requirements_sha" \
            --arg policy_sha "$policy_sha" \
            --arg guard_sha "$guard_sha" \
            --argjson pr "$EXPECTED_PR" \
            --argjson policy_version "$policy_version" \
            --argjson guard_version "$guard_version" '
              {
                current_guard_registry_sha256: $guard_sha,
                current_guard_registry_version: $guard_version,
                current_policy_sha256: $policy_sha,
                current_policy_version: $policy_version,
                current_requirements_sha256: $requirements,
                exact_head: $head,
                pull_request_number: $pr,
                repository: $repository
              }
            ' >"$output/context.json"

          now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          collector=(
            python3 -m scripts.abi_staging.check_projection
            --tap-root "$GITHUB_WORKSPACE/tap"
            --context "$output/context.json"
            --now "$now"
            --out "$output/projection-input.json"
          )
          if ((applicable_count == 0)); then
            collector+=(--not-applicable)
          else
            collector+=(
              --exact-head-root "$GITHUB_WORKSPACE/exact-head"
              --expected-requirements "$output/expected-requirements.json"
              --formula-requirements "$output/formula-requirements.json"
            )
          fi
          (
            cd authority
            bash scripts/dev-shell.sh env -u GH_TOKEN -u GITHUB_TOKEN \
              PYTHONPATH="$GITHUB_WORKSPACE/tap" "${collector[@]}"
          )
          "$authority_xtask" abi-staging check-projection project \
            --input "$output/projection-input.json" \
            --activation authority/abi/staging/required-check-activation.toml \
            --out "$output/projection.json"

          [[ -f $output/projection-input.json && ! -L $output/projection-input.json ]]
          [[ -f $output/projection.json && ! -L $output/projection.json ]]
          input_bytes=$(wc -c <"$output/projection-input.json")
          projection_bytes=$(wc -c <"$output/projection.json")
          ((input_bytes >= 1 && input_bytes <= 67108864))
          ((projection_bytes >= 1 && projection_bytes <= 16777216))

      - name: Transfer bounded inert projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abi-staging-pr-check-${{ github.run_id }}-${{ matrix.subject.number }}-${{ matrix.subject.head }}
          path: |
            ${{ runner.temp }}/abi-staging-pr-check/projection-input.json
            ${{ runner.temp }}/abi-staging-pr-check/projection.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  publish-check:
    needs: [enumerate-open-prs, collect-project]
    if: ${{ always() && needs.enumerate-open-prs.result == 'success' && needs.collect-project.result == 'success' && needs.enumerate-open-prs.outputs.subjects != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.enumerate-open-prs.outputs.subjects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout captured protected Kandelo authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.enumerate-open-prs.outputs.protected-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Set up declared protected build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Locate exact projection artifact
        id: locate
        env:
          ARTIFACT_NAME: abi-staging-pr-check-${{ github.run_id }}-${{ matrix.subject.number }}-${{ matrix.subject.head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/artifact-pages.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            >"$pages"
          jq -e --arg name "$ARTIFACT_NAME" '
            type == "array" and length <= 64 and
            ([.[] | .artifacts[]] | length == 1) and
            all(.[] | .artifacts[];
              .name == $name and .expired == false and
              (.id | type == "number" and . >= 1 and floor == .) and
              (.size_in_bytes | type == "number" and . >= 1 and . <= 83886080) and
              (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
            )
          ' "$pages" >/dev/null
          artifact_id=$(jq -r '.[0].artifacts[0].id' "$pages")
          artifact_digest=$(jq -r '.[0].artifacts[0].digest' "$pages")
          printf 'artifact-id=%s\n' "$artifact_id" >>"$GITHUB_OUTPUT"
          printf 'artifact-digest=%s\n' "$artifact_digest" >>"$GITHUB_OUTPUT"

      - name: Download exact projection artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.locate.outputs.artifact-id }}
          path: ${{ runner.temp }}/abi-staging-pr-check
          merge-multiple: true

      - name: Reproject and update the exact-head Check
        env:
          EXPECTED_HEAD: ${{ matrix.subject.head }}
          EXPECTED_PR: ${{ matrix.subject.number }}
          GH_TOKEN: ${{ github.token }}
          PROTECTED_SHA: ${{ needs.enumerate-open-prs.outputs.protected-sha }}
        run: |
          set -euo pipefail
          [[ $(git -C authority rev-parse HEAD) == "$PROTECTED_SHA" ]]
          input="$RUNNER_TEMP/abi-staging-pr-check/projection-input.json"
          supplied="$RUNNER_TEMP/abi-staging-pr-check/projection.json"
          [[ -f $input && ! -L $input && -f $supplied && ! -L $supplied ]]
          entry_count=$(find "$RUNNER_TEMP/abi-staging-pr-check" -mindepth 1 -maxdepth 1 \
            | wc -l | tr -d ' ')
          [[ $entry_count == 2 ]]
          input_bytes=$(wc -c <"$input")
          projection_bytes=$(wc -c <"$supplied")
          ((input_bytes >= 1 && input_bytes <= 67108864))
          ((projection_bytes >= 1 && projection_bytes <= 16777216))

          host_target=$(cd authority && bash scripts/dev-shell.sh \
            bash -c 'rustc -vV | awk "/^host/ {print \$2}"')
          (cd authority && bash scripts/dev-shell.sh \
            cargo build -p xtask --target "$host_target")
          authority_xtask="$GITHUB_WORKSPACE/authority/target/$host_target/debug/xtask"
          "$authority_xtask" abi-staging check-projection project \
            --input "$input" \
            --activation authority/abi/staging/required-check-activation.toml \
            --out "$RUNNER_TEMP/reprojected.json"
          cmp -s "$supplied" "$RUNNER_TEMP/reprojected.json"
          [[ $(jq -r '.head_sha' "$RUNNER_TEMP/reprojected.json") == "$EXPECTED_HEAD" ]]

          bash authority/.github/scripts/update-abi-staging-check.sh \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$EXPECTED_PR" \
            --projection "$RUNNER_TEMP/reprojected.json"
