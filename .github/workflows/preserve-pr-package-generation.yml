name: Preserve PR package closure

# Preserve one exact same-run rootfs/wasm32 closure before its mutable PR
# staging release is replaced. The result is evidence, not an admitted package
# generation: its direct tag keeps the exact producer object reachable, while
# its manifest separately binds the current default-branch publisher authority
# and explicitly records admission=none.
on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Exact temporary source release, for example pr-1097-staging'
        required: true
        type: string
      source-run-id:
        description: 'Staging-build run that produced all selected workflow artifacts'
        required: true
        type: string
      package-source-sha:
        description: 'Full 40-character commit that produced every source archive'
        required: true
        type: string
      expected-abi:
        description: 'Kernel ABI carried by the preserved closure'
        required: true
        default: '42'
        type: string
      root-package:
        description: 'Program package whose exact closure is preserved'
        required: true
        default: rootfs
        type: string
      arch:
        description: 'Target architecture for the selected closure'
        required: true
        default: wasm32
        type: string

permissions:
  contents: read

concurrency:
  group: preserve-pr-package-generation-${{ inputs.package-source-sha }}-${{ inputs.root-package }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout current publishing authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: authority

      - name: Checkout exact package source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.package-source-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: package-source

      - name: Set up declared build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Build the current authority validator
        working-directory: authority
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            host_target="$(rustc -vV | awk "/^host/ {print \$2}")"
            cargo_home="$RUNNER_TEMP/prepare-authority-cargo-home"
            install -d -m 0700 "$cargo_home"
            export CARGO_HOME="$cargo_home"
            # WHY: the later producer-tree metadata read must stay offline, but
            # a package absent from the validator build may still be named by
            # both trusted authority and older producer lockfiles. Fetch the
            # complete current-authority lock into isolated storage first.
            # This never reads producer manifests or producer Cargo config;
            # --locked also makes Cargo reject lock drift and bad checksums.
            cargo fetch --locked --manifest-path Cargo.toml
            cargo build --release -p xtask \
              --target "$host_target" \
              --target-dir "$RUNNER_TEMP/prepare-authority-target"
            printf "%s\n" "$cargo_home" \
              > "$RUNNER_TEMP/prepare-authority-cargo-home-path"
            printf "%s\n" \
              "$RUNNER_TEMP/prepare-authority-target/$host_target/release/xtask" \
              > "$RUNNER_TEMP/prepare-authority-xtask-path"
          '

      - name: Validate and application-seal the selected closure
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package-source-sha }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          EXPECTED_ABI: ${{ inputs.expected-abi }}
          ROOT_PACKAGE: ${{ inputs.root-package }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          authority_xtask="$(cat "$RUNNER_TEMP/prepare-authority-xtask-path")"
          authority_cargo_home="$(
            cat "$RUNNER_TEMP/prepare-authority-cargo-home-path"
          )"
          CARGO_HOME="$authority_cargo_home" \
            bash .github/scripts/prepare-preserved-pr-package-generation.sh \
            --source-tag "$SOURCE_TAG" \
            --source-run-id "$SOURCE_RUN_ID" \
            --package-source-root "$GITHUB_WORKSPACE/package-source" \
            --package-source-sha "$PACKAGE_SOURCE_SHA" \
            --authority-sha "$GITHUB_SHA" \
            --expected-abi "$EXPECTED_ABI" \
            --root-package "$ROOT_PACKAGE" \
            --arch "$TARGET_ARCH" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/preserved-package-generation" \
            --authority-xtask "$authority_xtask"
          echo "Prepared $(jq -r .tag "$RUNNER_TEMP/preserved-package-generation/generation.json")"

      - name: Transfer the inert preserved bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preserved-package-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preserved-package-generation
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout current publishing authority without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared build tools
        uses: ./.github/actions/setup-nix

      - name: Build current authority validator
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            host_target="$(rustc -vV | awk "/^host/ {print \$2}")"
            cargo build --release -p xtask \
              --target "$host_target" \
              --target-dir "$RUNNER_TEMP/authority-target"
            printf "%s\n" \
              "$RUNNER_TEMP/authority-target/$host_target/release/xtask" \
              > "$RUNNER_TEMP/authority-xtask-path"
          '

      - name: Download the inert preserved bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preserved-package-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preserved-package-generation

      - name: Revalidate, publish, and anonymously read back every asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          authority_xtask="$(cat "$RUNNER_TEMP/authority-xtask-path")"
          bash .github/scripts/publish-durable-package-generation.sh \
            --bundle "$RUNNER_TEMP/preserved-package-generation" \
            --authority-xtask "$authority_xtask" \
            --expected-authority-sha "$GITHUB_SHA" \
            --lock-root "$GITHUB_WORKSPACE" \
            --receipt "$RUNNER_TEMP/preserved-package-generation-receipt.json"
          tag="$(jq -r .tag "$RUNNER_TEMP/preserved-package-generation/generation.json")"
          {
            echo "## Application-sealed PR package closure"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Producer: \`${{ inputs.package-source-sha }}\`"
            echo "- Source staging release: \`${{ inputs.source-tag }}\`"
            echo "- Source workflow run: \`${{ inputs.source-run-id }}\`"
            echo "- Admission: **none**"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the exact publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preserved-package-generation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preserved-package-generation-receipt.json
          if-no-files-found: error
          retention-days: 30
