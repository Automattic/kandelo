name: Activate merge candidates

# Canonical package state moves only after GitHub reports that the exact
# synthetic-tree candidate prepared by Prepare merge landed on its target
# branch. pull_request:closed is a fast path. The scheduled default-branch
# sweep is the durable source of truth when an event or API call is missed;
# workflow_dispatch supports either a full sweep or one exact recovery target.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request to reconcile
        required: false
        type: string
      candidate_tag:
        description: Optional exact merge-candidate release tag
        required: false
        type: string
      canonical_tag:
        description: Optional exact canonical release tag to recover
        required: false
        type: string

jobs:
  activate:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ready-to-ship'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pages: read
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      INPUT_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      INPUT_CANONICAL_TAG: ${{ inputs.canonical_tag }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Always run the current default-branch protocol. A candidate may have
      # been prepared by a PR that changed these scripts; pre-merge code must
      # never activate canonical state.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Recover canonical index transactions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # WHY: this only resumes canonical transactions that were already
          # created by activation after its public-mirror gate. Running the
          # 48 MiB anonymous readback on every quiet scheduled sweep would not
          # protect a new transaction; new candidates pass the gate below.
          args=(
            --max-pages 50
            --per-page 100
            --max-asset-pages 50
            --asset-per-page 100
            --max-targets 50
          )
          if [ -n "$INPUT_CANONICAL_TAG" ]; then
            args+=(--target-tag "$INPUT_CANONICAL_TAG")
          fi
          bash .github/scripts/recover-canonical-indexes.sh "${args[@]}"

      - name: Discover merged ready candidates
        id: reconcile
        run: |
          set -euo pipefail
          candidate_plan="$RUNNER_TEMP/merge-candidate-plan.tsv"
          activated_receipts="$RUNNER_TEMP/activated-receipts.jsonl"
          args=(
            --plan-file "$candidate_plan"
            --activated-receipts-file "$activated_receipts"
            --max-pages 50
            --per-page 100
            --max-asset-pages 50
            --asset-per-page 100
            --max-candidates 20
            --target-ref HEAD
            --target-branch "$GITHUB_DEFAULT_BRANCH"
          )
          if [ -n "$INPUT_PR_NUMBER" ]; then
            args+=(--pr-number "$INPUT_PR_NUMBER")
          fi
          if [ -n "$INPUT_CANDIDATE_TAG" ]; then
            args+=(--candidate-tag "$INPUT_CANDIDATE_TAG")
          fi
          bash .github/scripts/reconcile-merge-candidates.sh "${args[@]}"
          echo "plan=$candidate_plan" >> "$GITHUB_OUTPUT"
          echo "activated_receipts=$activated_receipts" >> "$GITHUB_OUTPUT"
          if [ -s "$candidate_plan" ]; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Nix
        if: steps.reconcile.outputs.has_candidates == 'true'
        uses: ./.github/actions/setup-nix

      - name: Activate exact merged candidates
        id: activate
        if: steps.reconcile.outputs.has_candidates == 'true'
        env:
          CANDIDATE_PLAN: ${{ steps.reconcile.outputs.plan }}
          ACTIVATED_RECEIPTS: ${{ steps.reconcile.outputs.activated_receipts }}
        run: |
          set -uo pipefail
          failed=0
          activated_any=false
          while IFS=$'\t' read -r merged_at pr_number candidate_tag; do
            echo "Reconciling $candidate_tag for PR #$pr_number (merged $merged_at)"
            if bash scripts/dev-shell.sh bash .github/scripts/activate-merge-candidate.sh \
                --candidate-tag "$candidate_tag" \
                --pr-number "$pr_number"
            then
              receipt_dir="$RUNNER_TEMP/activated-receipt-$candidate_tag"
              mkdir -p "$receipt_dir"
              gh release download "$candidate_tag" \
                --repo "${{ github.repository }}" \
                --pattern activated.json \
                --dir "$receipt_dir" \
                --clobber
              jq -e \
                --arg candidate_tag "$candidate_tag" \
                '.candidate_tag == $candidate_tag and
                 (.canonical_index_sha256 | test("^[0-9a-f]{64}$"))' \
                "$receipt_dir/activated.json" >/dev/null
              jq -c . "$receipt_dir/activated.json" >> "$ACTIVATED_RECEIPTS"
              activated_any=true
              continue
            fi

            failed=1
            marker="<!-- merge-candidate-activation-failed:$candidate_tag -->"
            comments="$RUNNER_TEMP/activation-comments-$pr_number"
            if gh api \
                "/repos/${{ github.repository }}/issues/$pr_number/comments?per_page=100" \
                --paginate \
                --jq '.[].body' \
                > "$comments"
            then
              if ! grep -Fq -- "$marker" "$comments"; then
                gh pr comment "$pr_number" \
                  --repo "${{ github.repository }}" \
                  --body "Canonical package activation failed closed for \`$candidate_tag\`. The tested candidate remains isolated and \`binaries-abi-v<N>/index.toml\` was not partially overlaid. Inspect ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Scheduled reconciliation will retry transient failures; an exact-tree or same-package drift rejection requires a fresh build from the merged target. $marker" \
                  || true
              fi
            else
              echo "::warning::Could not check existing activation-failure comments for PR #$pr_number; skipping a potentially duplicate comment."
            fi
          done < "$CANDIDATE_PLAN"
          echo "activated_any=$activated_any" >>"$GITHUB_OUTPUT"
          exit "$failed"

      - name: Resolve the exact Pages generation
        id: pages_generation
        env:
          ACTIVATED_ANY: ${{ steps.activate.outputs.activated_any || 'false' }}
          ACTIVATED_RECEIPTS: ${{ steps.reconcile.outputs.activated_receipts }}
        run: |
          set -euo pipefail
          abi=$(grep -oE 'ABI_VERSION: u32 = [0-9]+' \
            crates/shared/src/lib.rs | awk '{print $4}')
          canonical_tag="binaries-abi-v$abi"
          generation_dir="$RUNNER_TEMP/pages-generation"
          canonical_index="$generation_dir/index.toml"
          canonical_head="$generation_dir/head"
          mkdir -p "$generation_dir"
          bash scripts/release-index-state.sh snapshot \
            --target-tag "$canonical_tag" \
            --expected-abi "$abi" \
            --output "$canonical_index" \
            --head-file "$canonical_head"
          canonical_index_sha256=$(sha256sum "$canonical_index" | awk '{print $1}')
          source_sha=$(git rev-parse HEAD)

          selected=""
          if [ -s "$ACTIVATED_RECEIPTS" ]; then
            selected=$(jq -sc \
              --arg canonical_index_sha256 "$canonical_index_sha256" '
                unique_by(.candidate_tag) |
                map(select(
                  .canonical_index_sha256 == $canonical_index_sha256 and
                  (.candidate_tag | type == "string") and
                  (.activated_at | type == "string")
                )) |
                sort_by(.activated_at) | last // empty
              ' "$ACTIVATED_RECEIPTS")
          fi
          if [ -z "$selected" ]; then
            if [ "$ACTIVATED_ANY" = true ]; then
              echo "::error::Activated candidate has no receipt for canonical index $canonical_index_sha256"
              exit 1
            fi
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "No authenticated candidate receipt selects the current canonical generation."
            exit 0
          fi
          candidate_tag=$(jq -er '.candidate_tag' <<<"$selected")
          if ! [[ "$candidate_tag" =~ ^merge-candidate-abi-v${abi}-pr-[0-9]+-run-[0-9]+-attempt-[0-9]+$ ]]; then
            echo "::error::Selected activation receipt has an invalid candidate tag"
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "candidate_tag=$candidate_tag"
            echo "canonical_index_sha256=$canonical_index_sha256"
          } >> "$GITHUB_OUTPUT"

          deployed_manifest="$generation_dir/deployed.json"
          pages_response="$generation_dir/pages.json"
          if gh api "/repos/${{ github.repository }}/pages" > "$pages_response" &&
             jq -e '(.html_url | type == "string" and startswith("https://"))' \
               "$pages_response" >/dev/null
          then
            pages_url=$(jq -r .html_url "$pages_response")
            manifest_url="${pages_url%/}/kandelo-deployment.json"
            if curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                "$manifest_url" > "$deployed_manifest" &&
               jq -e \
                 --arg source_sha "$source_sha" \
                 --arg canonical_index_sha256 "$canonical_index_sha256" '
                   .schema_version == 1 and
                   .source_sha == $source_sha and
                   .canonical_index_sha256 == $canonical_index_sha256
                 ' "$deployed_manifest" >/dev/null
            then
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              echo "Pages already serves source $source_sha with canonical index $canonical_index_sha256."
              exit 0
            fi
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the exact Pages generation
        if: steps.pages_generation.outputs.dispatch == 'true'
        run: |
          gh workflow run browser-demos-pages.yml \
            --ref "$GITHUB_DEFAULT_BRANCH" \
            -f source_sha="${{ steps.pages_generation.outputs.source_sha }}" \
            -f candidate_tag="${{ steps.pages_generation.outputs.candidate_tag }}" \
            -f canonical_index_sha256="${{ steps.pages_generation.outputs.canonical_index_sha256 }}"
