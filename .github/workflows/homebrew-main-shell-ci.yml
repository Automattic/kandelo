name: Homebrew main shell

on:
  # WHY: An independent PR workflow starts before package bytes exist.
  # Staging build calls this workflow only after sealing the exact attempt,
  # so the consumer can never race its producer.
  workflow_call:
    inputs:
      caller_event_name:
        description: Event that started the calling workflow
        required: true
        type: string
      pull_request_number:
        description: Exact pull request number from the caller
        required: true
        type: string
      pull_request_base_sha:
        description: Exact pull request base commit from the caller
        required: true
        type: string
      pull_request_head_sha:
        description: Exact pull request head commit from the caller
        required: true
        type: string
      staging_required:
        description: Whether this pull request produced a staging release
        required: true
        type: boolean
      staging_tag:
        description: Exact sealed release tag or not-required
        required: true
        type: string
      staged_matrix:
        description: Exact package rows owned by the sealed staging release
        required: true
        type: string
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      transport_mode:
        description: Validate exact bottle bytes from closed bindings or the public release
        required: true
        default: closed
        type: choice
        options:
          - closed
          - public
      kandelo_main_revision:
        description: Exact live Kandelo default-branch commit M
        required: true
        type: string
      core_tap_final_revision:
        description: Exact live first-party tap commit TF
        required: true
        type: string
      canary_tap_revision:
        description: Exact live independent-canary tap commit C
        required: true
        type: string

concurrency:
  group: homebrew-main-shell-${{ inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homebrew-main-shell-scope:
    name: classify exact Homebrew shell effect
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pull_request_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the exact shell effect
        id: scope
        env:
          CALLER_EVENT_NAME: ${{ inputs.caller_event_name || github.event_name }}
          BASE_SHA: ${{ inputs.pull_request_base_sha }}
          HEAD_SHA: ${{ inputs.pull_request_head_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/homebrew-main-shell-change-scope.sh \
            --event "$CALLER_EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"

  exact-public-bottle-closure:
    name: run exact current lazy shell (Node + Chromium)
    needs: homebrew-main-shell-scope
    if: needs.homebrew-main-shell-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    # WHY: package publication owns source builds. This consumer gate now
    # fails quickly when a required Kandelo package archive is absent instead
    # of compiling an unrelated gallery image for hours and hiding the
    # publication gap.
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CALLER_EVENT_NAME: ${{ inputs.caller_event_name || github.event_name }}
      CALLER_PR_NUMBER: ${{ inputs.pull_request_number }}
      CALLER_PR_HEAD: ${{ inputs.pull_request_head_sha }}
      STAGING_REQUIRED: ${{ inputs.staging_required && 'true' || 'false' }}
      STAGING_TAG: ${{ inputs.staging_tag || 'not-required' }}
      STAGED_MATRIX: ${{ inputs.staged_matrix || '[]' }}
      TRANSPORT_MODE: ${{ (inputs.caller_event_name || github.event_name) == 'workflow_dispatch' && inputs.transport_mode || 'closed' }}
      KANDELO_HOMEBREW_MAIN_SHELL_STRICT: "1"
      # WHY: this workflow is the product cutover gate. Every trigger must
      # compose and boot the bottle-owned shell; allowing PR or main runs to
      # substitute the source-rootfs bridge would make a green check prove the
      # wrong artifact again.
      SHELL_ACTIVATION_MODE: bottles
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pull_request_head_sha || github.sha }}
          persist-credentials: false

      - name: Bind exact live lifecycle revisions
        if: (inputs.caller_event_name || github.event_name) == 'workflow_dispatch' && inputs.transport_mode == 'closed'
        id: live-inputs
        env:
          KANDELO_M: ${{ inputs.kandelo_main_revision }}
          CORE_TAP_TF: ${{ inputs.core_tap_final_revision }}
          CANARY_C: ${{ inputs.canary_tap_revision }}
        run: |
          set -euo pipefail
          [ "$SHELL_ACTIVATION_MODE" = bottles ]
          for revision in "$KANDELO_M" "$CORE_TAP_TF" "$CANARY_C"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$(git rev-parse HEAD)" = "$KANDELO_M" ]
          [ "$(jq -er '.catalog.tap_commit' \
            homebrew/main-shell-homebrew-runtime-support.json)" = "$CORE_TAP_TF" ]
          [ "$(jq -er '.catalog.tap_commit' \
            homebrew/main-shell-migration-lock.json)" = "$CORE_TAP_TF" ]
          jq -e --arg canary "$CANARY_C" '
            .lifecycle_installs as $installs |
            ($installs | length) == 1 and
            $installs[0].tap == "brandonpayton/kandelo-canary" and
            $installs[0].repository ==
              "brandonpayton/homebrew-kandelo-canary" and
            $installs[0].revision == $canary and
            $installs[0].formula == "m4" and
            $installs[0].phase == "guest-lifecycle" and
            $installs[0].image_closure == false
          ' homebrew/main-shell-homebrew-runtime-support.json >/dev/null
          # WHY: a reviewed historical commit can remain fetchable forever.
          # Require each operator-supplied identity to be its anonymous public
          # main head before a detached fetch mistakes reachability for live
          # cutover authority. Local locks remain independent corroboration.
          require_exact_live_main() {
            local repository="$1"
            local expected="$2"
            local record
            record=$(env -u GH_TOKEN -u GITHUB_TOKEN git ls-remote \
              "$repository" refs/heads/main)
            [ -n "$record" ]
            [ "$(printf '%s\n' "$record" | wc -l | tr -d '[:space:]')" -eq 1 ]
            [ "${record#*[[:space:]]}" = refs/heads/main ]
            [ "${record%%[[:space:]]*}" = "$expected" ]
          }
          require_exact_live_main \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$KANDELO_M"
          require_exact_live_main \
            "https://github.com/Kandelo-dev/homebrew-tap-core.git" "$CORE_TAP_TF"
          require_exact_live_main \
            "https://github.com/brandonpayton/homebrew-kandelo-canary.git" "$CANARY_C"
          {
            echo "m=$KANDELO_M"
            echo "tf=$CORE_TAP_TF"
            echo "c=$CANARY_C"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch musl submodule for source-build fallback
        if: env.SHELL_ACTIVATION_MODE == 'source-rootfs'
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/browser-demos/package-lock.json
            host/package-lock.json
            tools/mkrootfs/package-lock.json

      - name: Validate the exact catalog lock
        run: |
          set -euo pipefail
          node scripts/check-homebrew-main-shell-brewfile.mjs

      - uses: ./.github/actions/setup-nix

      - name: Prepare isolated source tree for the wasm32 sysroot
        if: env.SHELL_ACTIVATION_MODE == 'source-rootfs'
        id: sysroot-source
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/homebrew-main-shell-sysroot-source"
          test ! -e "$source_root"
          mkdir -p "$source_root"
          # Keep this copy outside Git. GitHub checks out a depth-one synthetic
          # merge, so a linked worktree makes Nix inspect parent commits that
          # are intentionally absent. An archive is the same reviewed tree but
          # Nix correctly treats it as a local path input.
          git archive "$GITHUB_SHA" | tar -x -C "$source_root"
          mkdir -p "$source_root/libc/musl"
          cp -R libc/musl/. "$source_root/libc/musl"
          test ! -e "$source_root/.git"
          echo "path=$source_root" >> "$GITHUB_OUTPUT"

      - name: Build current wasm32 sysroot for source-build fallback
        if: env.SHELL_ACTIVATION_MODE == 'source-rootfs'
        working-directory: ${{ steps.sysroot-source.outputs.path }}
        run: |
          set -euo pipefail
          bash scripts/dev-shell.sh bash scripts/build-musl.sh
          test -f sysroot/lib/libc.a
          test ! -e "$GITHUB_WORKSPACE/sysroot"
          cp -R sysroot "$GITHUB_WORKSPACE/sysroot"
          test -f "$GITHUB_WORKSPACE/sysroot/lib/libc.a"
          test -z "$(git -C "$GITHUB_WORKSPACE/libc/musl" status --porcelain=v1 --untracked-files=all)"

      - name: Install exact-image and browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix tools/mkrootfs ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix host ci --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm --prefix apps/browser-demos ci --no-audit --no-fund
          (
            cd apps/browser-demos
            npx playwright install chromium --with-deps
          )

      - name: Validate the stock guest lifecycle contracts
        run: |
          set -euo pipefail
          npx tsx --test \
            apps/browser-demos/homebrew-closed-acceptance.test.ts \
            apps/browser-demos/homebrew-closed-acceptance-vite-config.test.ts \
            apps/browser-demos/playwright-server-policy.test.ts \
            apps/browser-demos/playwright-closed-acceptance.test.ts \
            apps/browser-demos/shell-vfs-image-url.test.ts \
            apps/browser-demos/test/support/terminal-command.test.ts \
            homebrew/test/homebrew_guest_lifecycle_browser_fixture.test.ts \
            homebrew/test/homebrew_guest_lifecycle_contract.test.ts \
            homebrew/test/homebrew_guest_lifecycle_progress.test.ts \
            homebrew/test/homebrew_guest_lifecycle_runner.test.ts \
            homebrew/test/homebrew_guest_lifecycle_runtime_contract.test.ts \
            homebrew/test/homebrew_guest_lifecycle_runtime_inputs.test.ts \
            homebrew/test/homebrew_system_command_spawn_proof.test.ts \
            scripts/create-homebrew-guest-lifecycle-fixture.test.ts \
            scripts/homebrew-guest-lifecycle-publication.test.ts \
            scripts/inspect-homebrew-main-shell-public-product.test.ts \
            scripts/homebrew-main-shell-image-contract.test.ts \
            scripts/homebrew-closed-lazy-assets.test.ts
          bash scripts/test-verify-existing-immutable-github-release.sh
          npx esbuild homebrew/test/homebrew_guest_lifecycle_node.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --packages=external \
            --outfile="$RUNNER_TEMP/homebrew_guest_lifecycle_node.mjs"

      - name: Select one verified package generation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          abi=$(sed -nE 's/^pub const ABI_VERSION: u32 = ([0-9]+);$/\1/p' \
            crates/shared/src/lib.rs)
          [[ "$abi" =~ ^[0-9]+$ ]]
          binary_cache="$RUNNER_TEMP/homebrew-main-shell-exact-cache"
          test ! -e "$binary_cache"
          # WHY: every activation mode needs one cache/trust root across the
          # package producer, fetcher, Vite build, and sealed preview.
          echo "WASM_POSIX_BINARY_CACHE_ROOT=$binary_cache" >> "$GITHUB_ENV"
          if [ "$SHELL_ACTIVATION_MODE" = source-rootfs ]; then
            empty_index="$RUNNER_TEMP/source-rootfs-empty-index.toml"
            source_cache="$binary_cache"
            test ! -e "$empty_index"
            cat >"$empty_index" <<EOF
          abi_version = $abi
          generated_at = "1970-01-01T00:00:00Z"
          generator = "exact-main source-rootfs closure"
          EOF
            # WHY: a closed PR staging generation can contain rehearsal bytes
            # whose producer is not main. Source activation gets an empty
            # index and a fresh cache so no prior bottle can enter its closure.
            echo "SOURCE_SHELL_BINARY_INDEX_URL=file://${empty_index}" >> "$GITHUB_ENV"
            echo "SOURCE_SHELL_BINARY_CACHE_ROOT=$source_cache" >> "$GITHUB_ENV"
          fi
          canonical_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/binaries-abi-v${abi}/index.toml"
          selected_url="$canonical_url"

          if [ "$CALLER_EVENT_NAME" = pull_request ]; then
            pr_number="$CALLER_PR_NUMBER"
            pr_head="$CALLER_PR_HEAD"
            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
            [[ "$pr_head" =~ ^[0-9a-f]{40}$ ]]
            case "$STAGING_REQUIRED" in
              true)
                expected_tag="pr-${pr_number}-staging-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
                [ "$STAGING_TAG" = "$expected_tag" ] || {
                  echo "::error::staging tag differs from this exact workflow attempt"
                  exit 1
                }
                target_tag="$STAGING_TAG"
                release_body="$RUNNER_TEMP/homebrew-main-shell-staging-body.txt"

                printf 'PR #%s staging build run %s attempt %s' \
                  "$pr_number" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
                  >"$release_body"

                # WHY: Producer success is only an ordering signal. Recheck
                # the exact immutable release, direct tag, and sealed asset
                # inventory before any package bytes become executable input.
                bash .github/scripts/package-release-lifecycle.sh \
                  verify-immutable \
                  --tag "$target_tag" \
                  --target-commit "$pr_head" \
                  --title "$target_tag" \
                  --body-file "$release_body" \
                  --prerelease true

                expected="$RUNNER_TEMP/homebrew-main-shell-staging-expected.json"
                selected_matrix="$RUNNER_TEMP/homebrew-main-shell-staged-matrix.json"
                target_expected="$RUNNER_TEMP/homebrew-main-shell-target-expected.json"
                canonical_expected="$RUNNER_TEMP/homebrew-main-shell-canonical-expected.json"
                target_snapshot="$RUNNER_TEMP/homebrew-main-shell-target-snapshot"
                canonical_snapshot="$RUNNER_TEMP/homebrew-main-shell-canonical-snapshot"
                frozen_index="$RUNNER_TEMP/homebrew-main-shell-frozen-index.toml"
                canonical_tag="binaries-abi-v${abi}"
                target_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${target_tag}/"
                canonical_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${canonical_tag}/"
                printf '%s\n' "$STAGED_MATRIX" >"$selected_matrix"

                # WHY: a PR release intentionally contains only rows rebuilt
                # by that PR. Bind those rows to the exact sealed release and
                # every unchanged row to canonical separately. A selected row
                # is never allowed to fall back to older canonical bytes.
                # shellcheck disable=SC2016
                bash scripts/dev-shell.sh env \
                  EXPECTED="$expected" \
                  SELECTED_MATRIX="$selected_matrix" \
                  TARGET_EXPECTED="$target_expected" \
                  CANONICAL_EXPECTED="$canonical_expected" \
                  TARGET_SNAPSHOT="$target_snapshot" \
                  CANONICAL_SNAPSHOT="$canonical_snapshot" \
                  FROZEN_INDEX="$frozen_index" \
                  TARGET_TAG="$target_tag" \
                  CANONICAL_TAG="$canonical_tag" \
                  TARGET_BASE="$target_base" \
                  CANONICAL_BASE="$canonical_base" \
                  ABI="$abi" \
                  bash -c '
                    set -euo pipefail
                    host_target=$(rustc -vV | awk "/^host/ {print \$2}")
                    cargo build --release -p xtask --target "$host_target"
                    xtask="target/$host_target/release/xtask"
                    "$xtask" staging-reuse expected \
                      --registry packages/registry \
                      --expected-abi "$ABI" \
                      --exclude erlang-vfs,perl,perl-vfs,python-vfs,redis,texlive \
                      --output "$EXPECTED"
                    bash .github/scripts/split-staging-package-ledger.sh \
                      --expected-ledger "$EXPECTED" \
                      --selected-matrix "$SELECTED_MATRIX" \
                      --selected-output "$TARGET_EXPECTED" \
                      --complement-output "$CANONICAL_EXPECTED"
                    bash .github/scripts/validate-staging-release.sh \
                      --tag "$TARGET_TAG" \
                      --expected-ledger "$TARGET_EXPECTED" \
                      --mode current \
                      --materialize \
                      --output-dir "$TARGET_SNAPSHOT" \
                      --xtask "$xtask"
                    canonical_count=$(jq ".entries | length" \
                      "$CANONICAL_EXPECTED")
                    if [ "$canonical_count" -eq 0 ]; then
                      # The typed composer still projects the exact complete
                      # ledger, so target-only runs cannot retain index extras.
                      base_index="$TARGET_SNAPSHOT/index.toml"
                      base_snapshot="$TARGET_SNAPSHOT/snapshot.json"
                    else
                      bash .github/scripts/validate-staging-release.sh \
                        --tag "$CANONICAL_TAG" \
                        --expected-ledger "$CANONICAL_EXPECTED" \
                        --mode current \
                        --output-dir "$CANONICAL_SNAPSHOT" \
                        --xtask "$xtask"
                      base_index="$CANONICAL_SNAPSHOT/index.toml"
                      base_snapshot="$CANONICAL_SNAPSHOT/snapshot.json"
                    fi
                    # WHY: compose only the two independently verified
                    # snapshots. Source-specific absolute URLs keep this
                    # proof lazy without consulting either mutable index
                    # again during package resolution. This transformation
                    # has no reason to inherit any network credential.
                    env -u GH_TOKEN -u GITHUB_TOKEN \
                      -u HOMEBREW_GITHUB_API_TOKEN \
                      -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
                      -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
                      -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                      -u ACTIONS_ID_TOKEN_REQUEST_URL \
                      -u ACTIONS_RUNTIME_TOKEN \
                      "$xtask" staging-reuse compose \
                        --base-index "$base_index" \
                        --base-expected-ledger "$CANONICAL_EXPECTED" \
                        --base-snapshot "$base_snapshot" \
                        --base-release-tag "$CANONICAL_TAG" \
                        --base-release-base-url "$CANONICAL_BASE" \
                        --overlay-index "$TARGET_SNAPSHOT/index.toml" \
                        --overlay-expected-ledger "$TARGET_EXPECTED" \
                        --overlay-snapshot "$TARGET_SNAPSHOT/snapshot.json" \
                        --overlay-release-tag "$TARGET_TAG" \
                        --overlay-release-base-url "$TARGET_BASE" \
                        --complete-expected-ledger "$EXPECTED" \
                        --output "$FROZEN_INDEX"
                  '
                selected_url="file://${frozen_index}"
                echo "Using exact staged rows plus verified canonical complement"
                ;;
              false)
                [ "$STAGING_TAG" = not-required ] || {
                  echo "::error::non-staging call supplied release authority"
                  exit 1
                }
                jq -e 'type == "array" and length == 0' \
                  <<<"$STAGED_MATRIX" >/dev/null || {
                  echo "::error::non-staging call supplied staged package rows"
                  exit 1
                }
                ;;
              *)
                echo "::error::invalid staging requirement: $STAGING_REQUIRED"
                exit 1
                ;;
            esac
          fi

          echo "WASM_POSIX_BINARY_INDEX_URL=$selected_url" >> "$GITHUB_ENV"

      - name: Build the exact candidate kernel
        id: candidate_kernel
        run: |
          set -euo pipefail
          test -n "${WASM_POSIX_BINARY_INDEX_URL:-}"
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            cargo build --release -p kandelo -Z build-std=core,alloc
            # WHY: this is a package-owned resolver mirror. Install the exact
            # candidate into an immutable local generation so later dependency
            # resolution cannot substitute released kernel bytes.
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION="ci-kernel-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}" \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            # WHY: the public mirror is intentionally a symlink. Record the
            # immutable generation member selected by the installer so later
            # acceptance boots installed bytes without weakening its
            # non-symlink input boundary.
            kernel_member="$(realpath local-binaries/kernel.wasm)"
            kernel_generation="$(dirname "$kernel_member")"
            kernel_identity="$(dirname "$kernel_generation")"
            kernel_namespace="$(realpath \
              local-binaries/.kandelo-local-generations/wasm32/kernel)"
            kernel_session="$(basename "$kernel_generation")"
            kernel_cache_key="$(basename "$kernel_identity")"
            [ "$(dirname "$kernel_identity")" = "$kernel_namespace" ]
            [ "$(basename "$kernel_member")" = kandelo-kernel.wasm ]
            [[ "$kernel_cache_key" =~ ^[0-9a-f]{64}$ ]]
            [ "$kernel_session" = \
              "ci-kernel-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}" ]
            [ -f "$kernel_identity/.$kernel_session.publication-claimed" ]
            [ ! -L "$kernel_identity/.$kernel_session.publication-claimed" ]
            [ -f "$kernel_member" ]
            [ ! -L "$kernel_member" ]
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              "$kernel_member"
            printf "path=%s\n" "$kernel_member" >> "$GITHUB_OUTPUT"
          '

      - name: Build the exact source-rootfs activation shell
        if: env.SHELL_ACTIVATION_MODE == 'source-rootfs'
        id: source_candidate
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/source-rootfs-main-shell-candidate"
          archive_root="$candidate_root/archive"
          test ! -e "$candidate_root"
          mkdir -p "$archive_root"
          # WHY: the isolated child shell owns these variable expansions.
          # shellcheck disable=SC2016
          env \
            WASM_POSIX_BINARY_INDEX_URL="$SOURCE_SHELL_BINARY_INDEX_URL" \
            bash scripts/dev-shell.sh env \
              WASM_POSIX_BINARY_CACHE_ROOT="$SOURCE_SHELL_BINARY_CACHE_ROOT" \
              bash -c '
            set -euo pipefail
            candidate_root="$1"
            archive_root="$2"
            host_target=$(rustc -vV | awk "/^host/ {print \$2}")
            cargo build --release -p xtask --target "$host_target"
            xtask="target/$host_target/release/xtask"
            # WHY: no pull-request, rehearsal, or old-main artifact may satisfy
            # any buildable node in this activation closure. Immutable source
            # archives remain reusable only after their declared hash verifies.
            # The bridge is a distinct non-published package so selecting this
            # lane can never execute the canonical bottle-backed shell recipe.
            "$xtask" archive-stage \
              --package homebrew/source-rootfs-shell-package \
              --registry packages/registry \
              --arch wasm32 \
              --binaries-dir local-binaries \
              --out "$archive_root" \
              --build-timestamp "1970-01-01T00:00:00Z" \
              --build-host "source-rootfs-main-shell-ci" \
              --source-repository "https://github.com/${GITHUB_REPOSITORY}" \
              --source-commit "$GITHUB_SHA" \
              --cache-root "$WASM_POSIX_BINARY_CACHE_ROOT" \
              --force-source-closure
            mapfile -t archives < <(
              find "$archive_root" -maxdepth 1 -type f -name "*.tar.zst" -print
            )
            [ "${#archives[@]}" -eq 1 ]
            manifest="$candidate_root/source-package-manifest.toml"
            zstd -dc -- "${archives[0]}" | tar -xOf - manifest.toml >"$manifest"
            archive_repository=$(sed -nE \
              "s/^repo_url[[:space:]]*=[[:space:]]*\"([^\"]+)\"$/\1/p" \
              "$manifest")
            archive_commit=$(sed -nE \
              "s/^commit[[:space:]]*=[[:space:]]*\"([0-9a-f]{40})\"$/\1/p" \
              "$manifest")
            archive_package=$(sed -nE \
              "s/^name[[:space:]]*=[[:space:]]*\"([^\"]+)\"$/\1/p" \
              "$manifest" | head -n 1)
            # WHY: CLI intent is not provenance evidence. Fail on the staged
            # bytes if a legacy build.toml repository or UNPUBLISHED marker
            # survived archive-stage instead of the exact event checkout.
            [ "$archive_package" = source-rootfs-shell ]
            [ "$archive_repository" = \
              "https://github.com/${GITHUB_REPOSITORY}" ]
            [ "$archive_commit" = "$GITHUB_SHA" ]
            ! grep -Fq "UNPUBLISHED" "$manifest"
            # WHY: this lane deliberately has an empty binary index, so asking
            # the resolver to rediscover the just-built shell would either
            # fail or permit the substitution this proof excludes. Consume the
            # declared file from the exact archive whose provenance was checked.
            "$xtask" archive-extract-member \
              --archive "${archives[0]}" \
              --member artifacts/shell.vfs.zst \
              --out "$candidate_root/main-shell.vfs.zst"
          ' bash "$candidate_root" "$archive_root"
          image="$candidate_root/main-shell.vfs.zst"
          report="$candidate_root/source-rootfs-main-shell-report.json"
          image_sha=$(sha256sum "$image" | awk '{print $1}')
          image_bytes=$(wc -c <"$image" | tr -d '[:space:]')
          [[ "$image_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$image_bytes" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg image_sha256 "$image_sha" \
            --argjson image_bytes "$image_bytes" \
            '{
              schema: 1,
              kind: "kandelo-source-rootfs-shell-activation",
              source_sha: $source_sha,
              image: {sha256: $image_sha256, bytes: $image_bytes}
            }' >"$report"
          {
            echo "image=$image"
            echo "report=$report"
            echo "manifest=$candidate_root/source-package-manifest.toml"
            source_assets="$candidate_root/source-local-binaries.sha256"
            source_links="$candidate_root/source-local-binaries.symlinks"
            find local-binaries \( -type f -o -type l \) -print0 |
              sort -z |
              xargs -0 sha256sum >"$source_assets"
            find local-binaries -type l -print0 |
              sort -z |
              while IFS= read -r -d '' path; do
                printf '%s\0%s\0' "$path" "$(readlink "$path")"
              done >"$source_links"
            test -s "$source_assets"
            echo "local_manifest=$source_assets"
            echo "link_manifest=$source_links"
          } >> "$GITHUB_OUTPUT"

      - name: Build the exact lazy shell from public bottles
        if: env.SHELL_ACTIVATION_MODE == 'bottles'
        id: bottle_candidate
        run: |
          set -euo pipefail
          tap_sha=$(jq -er '.catalog.tap_commit' \
            homebrew/main-shell-migration-lock.json)
          [[ "$tap_sha" =~ ^[0-9a-f]{40}$ ]]
          tap_root="$RUNNER_TEMP/homebrew-tap-core"
          candidate_root="$RUNNER_TEMP/homebrew-main-shell-candidate"
          test ! -e "$tap_root"
          test ! -e "$candidate_root"
          git init "$tap_root"
          git -C "$tap_root" remote add origin \
            https://github.com/Kandelo-dev/homebrew-tap-core.git
          git -C "$tap_root" fetch --depth=1 origin "$tap_sha"
          git -C "$tap_root" checkout --detach FETCH_HEAD
          test "$(git -C "$tap_root" rev-parse HEAD)" = "$tap_sha"
          test -z "$(git -C "$tap_root" status --porcelain=v1 --untracked-files=all)"
          # WHY: `/usr/bin/brew` becomes usable only when its independently
          # reviewed source tree and every bottle in its atomic support cohort
          # are admitted at this exact tap revision.
          node scripts/check-homebrew-main-shell-brewfile.mjs \
            homebrew/main-shell.Brewfile \
            homebrew/main-shell-migration-lock.json \
            "$tap_root/Kandelo/metadata.json" \
            homebrew/main-shell-homebrew-runtime-support.json
          bootstrap_package=$(jq -er '.package.name' \
            homebrew/main-shell-brew-package-tree.json)
          runtime_bootstrap_package=$(jq -er '.activation.bootstrap_package.name' \
            homebrew/main-shell-homebrew-runtime-support.json)
          [ "$bootstrap_package" = "$runtime_bootstrap_package" ]
          tap_abi=$(jq -er '.kandelo_abi' \
            "$tap_root/Kandelo/metadata.json")
          source_abi=$(sed -nE \
            's/^pub const ABI_VERSION: u32 = ([0-9]+);$/\1/p' \
            crates/shared/src/lib.rs)
          [ "$tap_abi" = "$source_abi" ]
          bootstrap_root="$RUNNER_TEMP/homebrew-bootstrap-bottle"
          test ! -e "$bootstrap_root"
          # WHY: the bootstrap is now Formula-owned software. Extract only its
          # recipe-declared support files from the exact public bottle, binding
          # catalog, Formula, recipe lock, keg, archive, and build provenance
          # without consulting the transitional Kandelo package registry.
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            bash scripts/dev-shell.sh \
              node_modules/.bin/tsx \
              scripts/extract-homebrew-support-data-bottle.ts \
                --tap-root "$tap_root" \
                --expected-tap-sha "$tap_sha" \
                --tap-repository kandelo-dev/homebrew-tap-core \
                --tap-name kandelo-dev/tap-core \
                --package "$bootstrap_package" \
                --arch wasm32 \
                --expected-abi "$tap_abi" \
                --output-directory "$bootstrap_root"
          bootstrap="$bootstrap_root/homebrew-bootstrap.zip"
          bootstrap_env="$bootstrap_root/homebrew-brew.env"
          bootstrap_bottle_report="$bootstrap_root/report.json"
          test -f "$bootstrap"
          test -f "$bootstrap_env"
          test -f "$bootstrap_bottle_report"
          artifact_state=$(jq -er '.state' \
            homebrew/main-shell-lazy-artifact-lock.json)
          case "$CALLER_EVENT_NAME:$artifact_state" in
            pull_request:pending|push:pending)
              # WHY: a changed input invalidates the old sealed image before
              # a replacement digest can exist. These CI lanes only build
              # and run the candidate; they cannot publish it. Manual runs
              # remain the shipping boundary and must reject pending bytes.
              artifact_review_args=(--review-pending-artifact)
              ;;
            *:sealed)
              artifact_review_args=()
              ;;
            *)
              echo "::error::pending shell artifact is not publishable"
              exit 1
              ;;
          esac
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            bash scripts/dev-shell.sh bash \
              scripts/build-homebrew-main-shell-closure.sh \
                --lazy-shell \
                --tap-root "$tap_root" \
                --expected-tap-sha "$tap_sha" \
                --package-tree-spec homebrew/main-shell-brew-package-tree.json \
                --package-tree-archive "$bootstrap" \
                --homebrew-bootstrap-env "$bootstrap_env" \
                --homebrew-bootstrap-bottle-report \
                  "$bootstrap_bottle_report" \
                --work-dir "$candidate_root" \
                "${artifact_review_args[@]}"
          test -f "$candidate_root/main-shell.vfs.zst"
          test -f "$candidate_root/main-shell-report.json"
          expected_mirror_files=$(jq -er '.bottle_mirror.assets | length + 1' \
            "$candidate_root/main-shell-report.json")
          test "$(find "$candidate_root/bottle-mirror" -maxdepth 1 -type f | wc -l)" \
            -eq "$expected_mirror_files"
          test "$(jq -er '.package_deferred_trees[0].state' \
            "$candidate_root/main-shell-report.json")" = deferred
          {
            echo "image=$candidate_root/main-shell.vfs.zst"
            echo "report=$candidate_root/main-shell-report.json"
            echo "bootstrap=$bootstrap"
            echo "bootstrap_env=$bootstrap_env"
            echo "bootstrap_bottle_report=$bootstrap_bottle_report"
            echo "tap_sha=$tap_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Select the source shell for dependent browser VFS builds
        if: env.SHELL_ACTIVATION_MODE == 'source-rootfs'
        id: source_alias
        env:
          CANDIDATE_PATH: ${{ steps.source_candidate.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/dev-shell.sh bash \
            scripts/install-local-shell-artifact.sh \
              "$CANDIDATE_PATH" \
              "homebrew-source-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          bash scripts/activate-local-shell-build-override.sh "$CANDIDATE_PATH"
          source_assets="$RUNNER_TEMP/source-local-binaries-with-shell.sha256"
          source_links="$RUNNER_TEMP/source-local-binaries-with-shell.symlinks"
          find local-binaries \( -type f -o -type l \) -print0 |
            sort -z |
            xargs -0 sha256sum >"$source_assets"
          find local-binaries -type l -print0 |
            sort -z |
            while IFS= read -r -d '' path; do
              printf '%s\0%s\0' "$path" "$(readlink "$path")"
            done >"$source_links"
          test -s "$source_assets"
          echo "local_manifest=$source_assets" >> "$GITHUB_OUTPUT"
          echo "link_manifest=$source_links" >> "$GITHUB_OUTPUT"

      - name: Resolve exact shell browser inputs
        run: |
          set -euo pipefail
          test -n "${WASM_POSIX_BINARY_INDEX_URL:-}"
          # WHY: this is the shell product gate, not a gallery build. Traverse
          # the real root-page and private lifecycle HTML entry graphs so a
          # new required binary is included automatically, while optional VFS
          # import.meta.glob entries remain lazy. Pages separately builds the
          # complete gallery and boots its shell route on every protected-main
          # commit.
          browser_package_file="$RUNNER_TEMP/browser-binary-packages.txt"
          node scripts/browser-binary-package-roots.mjs \
            --arch wasm32 \
            --html-entry index.html \
            --html-entry pages/homebrew-vfs-test/index.html \
            --local-capability kernel-wasm \
            --package-capability rootfs-vfs=rootfs \
            --exclude-package shell \
            > "$browser_package_file"
          mapfile -t browser_input_packages < "$browser_package_file"
          [ "${#browser_input_packages[@]}" -gt 0 ]
          [ "$(printf '%s\n' "${browser_input_packages[@]}" | sort -u | wc -l)" \
            -eq "${#browser_input_packages[@]}" ]
          # WHY: a successful source fallback would make this gate prove bytes
          # that are not independently published. Fetch-only turns a stale or
          # absent cache key into a short, package-named publication failure.
          fetch_args=(--fetch-only)
          for package in "${browser_input_packages[@]}"; do
            fetch_args+=(--package "$package")
          done
          bash scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            bash scripts/fetch-binaries.sh "${fetch_args[@]}"
          if [ "$SHELL_ACTIVATION_MODE" = source-rootfs ]; then
            # Re-run the idempotent verifier after all derived packages. This
            # proves no source fallback replaced the bridge override while
            # resolving the reverse-dependent browser VFS images.
            bash scripts/activate-local-shell-build-override.sh \
              "${{ steps.source_candidate.outputs.image }}"
            # WHY: unrelated browser roots may use the verified staging or
            # canonical index, but they must never replace the exact-source
            # shell closure that Vite resolves from local-binaries first.
            sha256sum --check \
              "${{ steps.source_alias.outputs.local_manifest }}"
            # WHY: resolving unrelated browser roots is expected to add new
            # mirrors. It must not remove or retarget any link that belonged to
            # the exact source-shell closure selected above.
            verified_links=0
            while IFS= read -r -d '' path; do
              if ! IFS= read -r -d '' expected_target; then
                echo "::error::selected shell link manifest has an incomplete record"
                exit 1
              fi
              [ -L "$path" ]
              [ "$(readlink "$path")" = "$expected_target" ]
              verified_links=$((verified_links + 1))
            done <"${{ steps.source_alias.outputs.link_manifest }}"
            [ "$verified_links" -gt 0 ]
          fi

      - name: Install the candidate's exact shell bytes
        id: image
        env:
          CANDIDATE_PATH: ${{ steps.source_candidate.outputs.image || steps.bottle_candidate.outputs.image }}
          CANDIDATE_BOOTSTRAP_PATH: ${{ steps.bottle_candidate.outputs.bootstrap }}
          CANDIDATE_BOOTSTRAP_ENV_PATH: ${{ steps.bottle_candidate.outputs.bootstrap_env }}
        run: |
          set -euo pipefail
          browser_copy=apps/browser-demos/public/shell.vfs.zst
          install_session="homebrew-main-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test -f "$CANDIDATE_PATH"
          mkdir -p "$(dirname "$browser_copy")"
          bash scripts/dev-shell.sh bash \
            scripts/install-local-shell-artifact.sh \
              "$CANDIDATE_PATH" "$install_session"
          resolved=$(bash scripts/resolve-binary.sh programs/shell.vfs.zst)
          test -f "$resolved"
          cmp "$CANDIDATE_PATH" "$resolved"
          cp "$CANDIDATE_PATH" "$browser_copy"
          cmp "$CANDIDATE_PATH" "$browser_copy"
          image_sha=$(sha256sum "$CANDIDATE_PATH" | awk '{print $1}')
          [[ "$image_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$image_sha" >> "$GITHUB_OUTPUT"
          echo "path=$CANDIDATE_PATH" >> "$GITHUB_OUTPUT"
          if [ "$SHELL_ACTIVATION_MODE" = bottles ]; then
            test -f "$CANDIDATE_BOOTSTRAP_PATH"
            test -f "$CANDIDATE_BOOTSTRAP_ENV_PATH"
            resolved_bootstrap=$(bash scripts/resolve-binary.sh \
              programs/homebrew-bootstrap/homebrew-bootstrap.zip)
            resolved_bootstrap_env=$(bash scripts/resolve-binary.sh \
              programs/homebrew-bootstrap/homebrew-brew.env)
            cmp "$CANDIDATE_BOOTSTRAP_PATH" "$resolved_bootstrap"
            cmp "$CANDIDATE_BOOTSTRAP_ENV_PATH" "$resolved_bootstrap_env"
            bootstrap_sha=$(sha256sum "$CANDIDATE_BOOTSTRAP_PATH" | awk '{print $1}')
            bootstrap_bytes=$(wc -c <"$CANDIDATE_BOOTSTRAP_PATH" | tr -d '[:space:]')
            [[ "$bootstrap_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$bootstrap_bytes" =~ ^[1-9][0-9]*$ ]]
            echo "bootstrap_sha256=$bootstrap_sha" >> "$GITHUB_OUTPUT"
            echo "bootstrap_bytes=$bootstrap_bytes" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover the exact bottle mirror from anonymous source packages
        if: env.SHELL_ACTIVATION_MODE == 'bottles'
        id: mirror
        run: |
          set -euo pipefail
          mirror_dir="$RUNNER_TEMP/homebrew-main-shell-bottles"
          mirror_report="$RUNNER_TEMP/homebrew-main-shell-bottle-recovery.json"
          expected_assets=$(jq -er '.bottle_mirror.assets | length' \
            "${{ steps.bottle_candidate.outputs.report }}")
          expected_files=$((expected_assets + 1))
          env -u GH_TOKEN -u GITHUB_TOKEN \
            -u HOMEBREW_GITHUB_API_TOKEN \
            -u HOMEBREW_GITHUB_PACKAGES_TOKEN \
            -u HOMEBREW_DOCKER_REGISTRY_TOKEN \
            bash scripts/dev-shell.sh npx tsx \
              scripts/recover-homebrew-bottle-mirror.ts \
              --image "${{ steps.bottle_candidate.outputs.image }}" \
              --out "$mirror_dir" \
              --report "$mirror_report"
          test "$(find "$mirror_dir" -maxdepth 1 -type f | wc -l)" \
            -eq "$expected_files"
          test -f "$mirror_dir/kandelo-homebrew-bottle-mirror-plan.json"
          jq -e --argjson expected_assets "$expected_assets" '
            .schema == 1 and
            .kind == "kandelo-homebrew-bottle-mirror-recovery" and
            (.assets | length) == $expected_assets
          ' "$mirror_report" >/dev/null
          publish_manifest="$RUNNER_TEMP/homebrew-main-shell-bottle-publish.json"
          # WHY: target_commitish is the release-write authority carried by
          # this bounded handoff. Bind it to the exact checked-out tap catalog
          # rather than the Kandelo workflow head or event-selected data.
          bash scripts/dev-shell.sh npx tsx \
            scripts/create-homebrew-bottle-mirror-publish-manifest.ts \
              --bundle "$mirror_dir" \
              --recovery-report "$mirror_report" \
              --target-commitish "${{ steps.bottle_candidate.outputs.tap_sha }}" \
              --out "$publish_manifest"
          jq -e \
            --arg target "${{ steps.bottle_candidate.outputs.tap_sha }}" \
            --argjson expected_files "$expected_files" '
            .schema == 1 and .target_commitish == $target and
            (.assets | length) == $expected_files and
            (.preferred_asset_names | length) == $expected_files and
            .accepted_existing_asset_sets == []
          ' "$publish_manifest" >/dev/null
          browser_mirror=apps/browser-demos/public/homebrew-main-shell-bottles
          test ! -e "$browser_mirror"
          if [ "$TRANSPORT_MODE" = closed ]; then
            cp -R "$mirror_dir" "$browser_mirror"
            test "$(find "$browser_mirror" -maxdepth 1 -type f | wc -l)" \
              -eq "$expected_files"
          elif [ "$TRANSPORT_MODE" = public ]; then
            mkdir -p "$browser_mirror"
            cp "$mirror_dir/kandelo-homebrew-bottle-mirror-plan.json" \
              "$browser_mirror/"
            test "$(find "$browser_mirror" -maxdepth 1 -type f | wc -l)" -eq 1
          else
            echo "unsupported transport mode: $TRANSPORT_MODE" >&2
            exit 1
          fi
          echo "plan=$mirror_dir/kandelo-homebrew-bottle-mirror-plan.json" >> "$GITHUB_OUTPUT"

      - name: Create the exact closed Chromium lifecycle fixture
        if: (inputs.caller_event_name || github.event_name) == 'workflow_dispatch' && inputs.transport_mode == 'closed'
        id: live-fixture
        run: |
          set -euo pipefail
          [ "${{ steps.live-inputs.outputs.tf }}" = \
            "${{ steps.bottle_candidate.outputs.tap_sha }}" ]
          main_record=$(env -u GH_TOKEN -u GITHUB_TOKEN git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
          [ "$(wc -l <<<"$main_record" | tr -d '[:space:]')" -eq 1 ]
          [ "${main_record%%[[:space:]]*}" = \
            "${{ steps.live-inputs.outputs.m }}" ]

          support=homebrew/main-shell-homebrew-runtime-support.json
          runtime_id=$(jq -er '.id' "$support")
          runtime_capability=$(jq -er '.activation.capability' "$support")
          jq -e \
            --arg runtime_id "$runtime_id" \
            --arg runtime_capability "$runtime_capability" '
              .activation.atomic_group == $runtime_id and
              (.activation.capabilities | index($runtime_capability)) != null
            ' homebrew/main-shell-brew-package-tree.json >/dev/null
          jq -e --slurpfile support "$support" '
            .materialization.runtime_support.id == $support[0].id and
            .materialization.runtime_support.activation_root ==
              $support[0].activation.roots[0] and
            .materialization.runtime_support.activation_capability ==
              $support[0].activation.capability and
            .materialization.runtime_support.package_order ==
              $support[0].additional_formula_order and
            .materialization.runtime_support.tree_count ==
              ($support[0].additional_formula_order | length) and
            .materialization.runtime_support.deferred_relocation_formulae ==
              [$support[0].deferred_formulae[].package] and
            ([.bottle_mirror.assets[].package] | sort) ==
              ((.materialization.deferred_package_order +
                $support[0].additional_formula_order) | sort)
          ' "${{ steps.bottle_candidate.outputs.report }}" >/dev/null
          # WHY: the shell bottle closure is not itself a brew runtime. Bind
          # this live proof only after the candidate contains the separately
          # reviewed atomic support cohort; a partial ambient tool set must
          # fail here before either host can create lifecycle evidence.

          fixture="$RUNNER_TEMP/homebrew-guest-lifecycle-browser-fixture.json"
          fixed_url_root="https://closed.kandelo.invalid/homebrew-main-shell/${{ steps.live-inputs.outputs.m }}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          bash scripts/dev-shell.sh npx tsx \
            scripts/create-homebrew-guest-lifecycle-fixture.ts \
              --image "${{ steps.bottle_candidate.outputs.image }}" \
              --homebrew-bootstrap-spec homebrew/main-shell-brew-package-tree.json \
              --homebrew-bootstrap-archive "${{ steps.bottle_candidate.outputs.bootstrap }}" \
              --homebrew-bootstrap-env "${{ steps.bottle_candidate.outputs.bootstrap_env }}" \
              --bottle-mirror "$RUNNER_TEMP/homebrew-main-shell-bottles" \
              --fixed-asset-url-root "$fixed_url_root" \
              --core-revision "${{ steps.live-inputs.outputs.tf }}" \
              --canary-revision "${{ steps.live-inputs.outputs.c }}" \
              --timeout-ms 900000 \
              --out "$fixture"
          test -f "$fixture"

          browser_root=apps/browser-demos/public/homebrew-main-shell-bottles
          install_browser_fixture_asset() {
            local source="$1"
            local destination
            destination="$browser_root/$(basename "$source")"
            test ! -e "$destination"
            cp "$source" "$destination"
            cmp "$source" "$destination"
          }
          # WHY: retain canonical HTTPS identities in the fixture while the
          # closed browser run reads the same already-verified candidate bytes
          # used by Node. Guest tap operations still use their live Git remotes.
          install_browser_fixture_asset "${{ steps.bottle_candidate.outputs.image }}"
          install_browser_fixture_asset homebrew/main-shell-brew-package-tree.json
          install_browser_fixture_asset "${{ steps.bottle_candidate.outputs.bootstrap }}"
          install_browser_fixture_asset "${{ steps.bottle_candidate.outputs.bootstrap_env }}"
          echo "fixture=$fixture" >> "$GITHUB_OUTPUT"

      - name: Build the sealed browser product tree
        working-directory: apps/browser-demos
        run: |
          set -euo pipefail
          build_env=()
          build_args=()
          # WHY: the root page is the user-visible shell product exercised
          # below. The complete gallery remains owned by the Pages deployment
          # gate instead of extending this exact shell proof's critical path.
          build_env+=("KANDELO_BROWSER_DEMO_INPUTS=main")
          if [ "$SHELL_ACTIVATION_MODE" = bottles ] &&
             [ "$TRANSPORT_MODE" = closed ]; then
            build_env+=(
              "VITE_KANDELO_HOMEBREW_CLOSED_ACCEPTANCE_ROOT=/homebrew-main-shell-bottles"
            )
            # WHY: optimized Vite builds are all PROD. This exact mode admits
            # the verified local mirror and its private fixture page without
            # granting either capability to public or source-rootfs builds.
            build_args+=(-- --mode homebrew-closed-acceptance)
          fi
          bash ../../scripts/dev-shell.sh env \
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT" \
            "${build_env[@]}" \
            npm run build "${build_args[@]}"
          test -f dist/index.html
          bash ../../scripts/verify-browser-shell-vfs-asset.sh \
            dist "${{ steps.image.outputs.path }}"

      - name: Boot the exact installed bytes in Node
        run: |
          set -euo pipefail
          case "$SHELL_ACTIVATION_MODE" in
            source-rootfs)
              bash scripts/dev-shell.sh npx tsx \
                scripts/source-rootfs-shell-node-smoke.ts \
                --image "${{ steps.image.outputs.path }}" \
                --kernel "${{ steps.candidate_kernel.outputs.path }}" \
                --shell-config homebrew/source-rootfs-shell-default.json \
                --demo-config homebrew/main-shell-demo.json \
                --demo-profile-overlay homebrew/source-rootfs-shell-demo-profiles.json
              ;;
            bottles)
              node_smoke_args=(
                --image "${{ steps.image.outputs.path }}"
                --migration-lock homebrew/main-shell-migration-lock.json
                --homebrew-bootstrap-spec homebrew/main-shell-brew-package-tree.json
                --homebrew-bootstrap-archive "${{ steps.bottle_candidate.outputs.bootstrap }}"
                --homebrew-bootstrap-env "${{ steps.bottle_candidate.outputs.bootstrap_env }}"
                --homebrew-bootstrap-state deferred
                --homebrew-runtime-support homebrew/main-shell-homebrew-runtime-support.json
                --demo-config homebrew/main-shell-demo.json
                --transport-mode "$TRANSPORT_MODE"
              )
              case "$TRANSPORT_MODE" in
                closed)
                  node_smoke_args+=(
                    --bottle-mirror-plan "${{ steps.mirror.outputs.plan }}"
                  )
                  ;;
                public)
                  ;;
                *)
                  echo "unsupported transport mode: $TRANSPORT_MODE" >&2
                  exit 1
                  ;;
              esac
              bash scripts/dev-shell.sh npx tsx \
                scripts/homebrew-main-shell-node-smoke.ts \
                "${node_smoke_args[@]}"
              ;;
            *)
              echo "unsupported shell activation mode: $SHELL_ACTIVATION_MODE" >&2
              exit 1
              ;;
          esac

      - name: Exercise the live first- and third-party lifecycle in Node
        if: (inputs.caller_event_name || github.event_name) == 'workflow_dispatch' && inputs.transport_mode == 'closed'
        run: |
          set -euo pipefail
          bash scripts/dev-shell.sh npx tsx \
            homebrew/test/homebrew_guest_lifecycle_node.ts \
              --image "${{ steps.bottle_candidate.outputs.image }}" \
              --homebrew-bootstrap-spec homebrew/main-shell-brew-package-tree.json \
              --homebrew-bootstrap-archive "${{ steps.bottle_candidate.outputs.bootstrap }}" \
              --homebrew-bootstrap-env "${{ steps.bottle_candidate.outputs.bootstrap_env }}" \
              --transport-mode closed \
              --bottle-mirror-plan "${{ steps.mirror.outputs.plan }}" \
              --proof-mode comprehensive \
              --core-revision "${{ steps.live-inputs.outputs.tf }}" \
              --canary-revision "${{ steps.live-inputs.outputs.c }}" \
              --timeout-ms 900000

      - name: Boot the current main-shell path in Chromium
        env:
          KANDELO_MAIN_SHELL_SHA256: ${{ steps.image.outputs.sha256 }}
          KANDELO_HOMEBREW_MAIN_SHELL_SHA256: ${{ steps.image.outputs.sha256 }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256: ${{ steps.image.outputs.bootstrap_sha256 }}
          KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES: ${{ steps.image.outputs.bootstrap_bytes }}
          KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE: ${{ env.TRANSPORT_MODE }}
          KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL: /homebrew-main-shell-bottles/kandelo-homebrew-bottle-mirror-plan.json
        run: |
          set -euo pipefail
          lifecycle_report="$RUNNER_TEMP/homebrew-guest-lifecycle-playwright.json"
          shell_report="$RUNNER_TEMP/homebrew-main-shell-playwright.json"
          modeset_report="$RUNNER_TEMP/homebrew-main-shell-modeset-playwright.json"
          playwright_env=(
            "KANDELO_MAIN_SHELL_SHA256=$KANDELO_MAIN_SHELL_SHA256"
            "KANDELO_PLAYWRIGHT_SERVE_DIST=1"
            "WASM_POSIX_BINARY_CACHE_ROOT=$WASM_POSIX_BINARY_CACHE_ROOT"
          )
          case "$SHELL_ACTIVATION_MODE" in
            source-rootfs)
              shell_spec=test/kandelo-source-rootfs-shell.spec.ts
              playwright_env+=("KANDELO_SOURCE_ROOTFS_SHELL_STRICT=1")
              ;;
            bottles)
              shell_spec=test/kandelo-homebrew-main-shell.spec.ts
              playwright_env+=(
                "KANDELO_HOMEBREW_MAIN_SHELL_STRICT=$KANDELO_HOMEBREW_MAIN_SHELL_STRICT"
                "KANDELO_HOMEBREW_MAIN_SHELL_SHA256=$KANDELO_HOMEBREW_MAIN_SHELL_SHA256"
                "KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256=$KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_SHA256"
                "KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES=$KANDELO_HOMEBREW_MAIN_SHELL_BOOTSTRAP_BYTES"
                "KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE=$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE"
                "KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL=$KANDELO_HOMEBREW_MAIN_SHELL_MIRROR_PLAN_URL"
              )
              if [ "$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" = closed ]; then
                playwright_env+=(
                  "KANDELO_PLAYWRIGHT_VITE_MODE=homebrew-closed-acceptance"
                  "KANDELO_PLAYWRIGHT_CLOSED_ACCEPTANCE_ROOT=/homebrew-main-shell-bottles"
                )
              elif [ "$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" != public ]; then
                echo "unsupported transport mode: $KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported shell activation mode: $SHELL_ACTIVATION_MODE" >&2
              exit 1
              ;;
          esac
          (
            cd apps/browser-demos
            reports=("$shell_report")
            if [ "$SHELL_ACTIVATION_MODE" = bottles ] &&
               [ "$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" = closed ]; then
              # This offline browser contract must reject before any external
              # fixture fetch. The separately gated live test runs only when
              # an exact immutable fixture is explicitly supplied.
              bash ../../scripts/dev-shell.sh env \
                "KANDELO_BROWSER_DEMO_INPUTS=homebrew-vfs-test" \
                "${playwright_env[@]}" \
                npx playwright test test/homebrew-guest-lifecycle.spec.ts \
                --project=chromium \
                --grep "rejects a guest lifecycle fixture"
              if [ "$CALLER_EVENT_NAME" = workflow_dispatch ] &&
                 [ "$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" = closed ]; then
                # Run the rebooting live lifecycle in its own browser process so
                # it receives the same exact image/bootstrap/mirror as Node.
                bash ../../scripts/dev-shell.sh env \
                  "PLAYWRIGHT_JSON_OUTPUT_FILE=$lifecycle_report" \
                  "KANDELO_BROWSER_DEMO_INPUTS=homebrew-vfs-test" \
                  "KANDELO_HOMEBREW_GUEST_BROWSER_LIFECYCLE_LIVE=1" \
                  "KANDELO_HOMEBREW_GUEST_BROWSER_LIFECYCLE_FIXTURE_PATH=${{ steps.live-fixture.outputs.fixture }}" \
                  "${playwright_env[@]}" \
                  npx playwright test test/homebrew-guest-lifecycle.spec.ts \
                  --project=chromium \
                  --grep "survives a Chromium rootfs reboot" \
                  --reporter=json
              fi
            fi
            bash ../../scripts/dev-shell.sh env \
              "PLAYWRIGHT_JSON_OUTPUT_FILE=$shell_report" \
              "KANDELO_BROWSER_DEMO_INPUTS=main" \
              "${playwright_env[@]}" \
              npx playwright test "$shell_spec" \
              --project=chromium --reporter=json
            # WHY: modeset and its launch profile are part of the reviewed
            # current-shell contract, but use a fresh process because the
            # preceding shell worker makes browser-process lifetime observable.
            if [ "$SHELL_ACTIVATION_MODE" = bottles ]; then
              bash ../../scripts/dev-shell.sh env \
                "PLAYWRIGHT_JSON_OUTPUT_FILE=$modeset_report" \
                "${playwright_env[@]}" \
                npx playwright test test/kandelo-modeset.spec.ts \
                --project=chromium --reporter=json
              reports+=("$modeset_report")
            fi
            for report in "${reports[@]}"; do
              jq -e '
                .stats.expected == 1 and .stats.unexpected == 0 and
                .stats.flaky == 0 and .stats.skipped == 0
              ' "$report" >/dev/null
            done
          )
          if [ "$CALLER_EVENT_NAME" = workflow_dispatch ] &&
             [ "$KANDELO_HOMEBREW_MAIN_SHELL_TRANSPORT_MODE" = closed ]; then
            jq -e '
              .stats.expected == 1 and .stats.unexpected == 0 and
              .stats.flaky == 0 and .stats.skipped == 0
            ' "$lifecycle_report" >/dev/null
          fi

      - name: Upload exact closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-main-shell-closure
          path: |
            ${{ steps.image.outputs.path }}
            ${{ steps.source_candidate.outputs.report }}
            ${{ steps.source_candidate.outputs.manifest }}
            ${{ steps.bottle_candidate.outputs.report }}
            ${{ steps.bottle_candidate.outputs.bootstrap }}
            ${{ steps.bottle_candidate.outputs.bootstrap_env }}
            ${{ steps.bottle_candidate.outputs.bootstrap_bottle_report }}
            ${{ runner.temp }}/homebrew-main-shell-bottles
            ${{ runner.temp }}/homebrew-main-shell-bottle-recovery.json
            ${{ runner.temp }}/homebrew-main-shell-bottle-publish.json
            ${{ runner.temp }}/homebrew-guest-lifecycle-browser-fixture.json
            ${{ runner.temp }}/homebrew-guest-lifecycle-playwright.json
            ${{ runner.temp }}/homebrew-main-shell-playwright.json
            ${{ runner.temp }}/homebrew-main-shell-modeset-playwright.json
            apps/browser-demos/test-results
          retention-days: 7
          if-no-files-found: warn

  exact-public-bottle-closure-gate:
    name: exact current lazy shell (Node + Chromium)
    needs:
      - homebrew-main-shell-scope
      - exact-public-bottle-closure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected exact-shell result
        env:
          SCOPE_RESULT: ${{ needs.homebrew-main-shell-scope.result }}
          EXACT_RESULT: ${{ needs.exact-public-bottle-closure.result }}
          EXACT_REQUIRED: ${{ needs.homebrew-main-shell-scope.outputs.required }}
          SCOPE_REASON: ${{ needs.homebrew-main-shell-scope.outputs.reason }}
        run: |
          set -euo pipefail
          [ "$SCOPE_RESULT" = success ] || {
            echo "::error::exact-shell effect classification failed"
            exit 1
          }
          case "$EXACT_REQUIRED" in
            true)
              [ "$EXACT_RESULT" = success ] || {
                echo "::error::required exact-shell proof ended as $EXACT_RESULT"
                exit 1
              }
              ;;
            false)
              [ "$EXACT_RESULT" = skipped ] || {
                echo "::error::publisher-only exact-shell job ended as $EXACT_RESULT"
                exit 1
              }
              ;;
            *)
              echo "::error::invalid exact-shell requirement: $EXACT_REQUIRED"
              exit 1
              ;;
          esac
          echo "$SCOPE_REASON"
