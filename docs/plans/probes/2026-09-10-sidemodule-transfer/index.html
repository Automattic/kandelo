<!doctype html>
<meta charset="utf-8">
<title>side-module transfer + compile probe</title>
<script type="module">
  const res = await fetch('./dylink_module32.wasm');
  const bytes = await res.arrayBuffer();
  const fetched = { byteLength: bytes.byteLength, contentType: res.headers.get('content-type') };

  const worker = new Worker('./worker.mjs', { type: 'module' });
  const reply = new Promise((r) => { worker.onmessage = (e) => r(e.data); });
  // The real code transfers rather than clones; that is the half a static
  // check cannot see, because a detached buffer only shows up at run time.
  worker.postMessage({ dylinkModuleBytes: bytes }, [bytes]);
  const workerResult = await reply;

  window.__done = {
    crossOriginIsolated,
    fetched,
    mainThreadBufferDetachedAfterTransfer: bytes.byteLength === 0,
    worker: workerResult,
  };
  window.__ready = true;
</script>
