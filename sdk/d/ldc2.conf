"default": {
    switches = [
        "-mtriple=wasm32-unknown-kandelo-musl",
        "-mattr=+atomics,+bulk-memory,+mutable-globals",
        "--wasm-enable-eh",
        "--wasm-use-legacy-eh=false",
        "-I/usr/include/d/druntime",
        "-I/usr/include/d/phobos",
        "-I/usr/include/d/ldc",
        "-defaultlib=phobos2-ldc,druntime-ldc,kandelo-continuation",
        "-gcc=/usr/libexec/kandelo-d-link",
        "-Xcc=-pthread",
    ];
    lib-dirs = ["/usr/lib/d"];
};
