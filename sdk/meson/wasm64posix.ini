# Meson cross file for Kandelo wasm64 targets (Wasm memory64, LP64 data
# model). It is the wasm64 counterpart of sdk/meson/wasm32posix.ini and
# differs from it only in the wrapper names and the cpu identity.
#
#   meson setup --cross-file sdk/meson/wasm64posix.ini <builddir>
#
# The binaries are the SDK wrappers (on PATH inside scripts/dev-shell.sh or
# after `source sdk/activate.sh`). They already carry the target contract:
# wasm64posix-cc/-c++ inject --target, the wasm feature flags, --sysroot, and
# (when linking an executable) crt1 + libc + the syscall glue + the link
# contract; wasm64posix-pkg-config resolves the sysroot and dep-cache .pc
# files. So this file only declares the machine and Meson-level policy.
#
# `sys_root` is deliberately NOT set: Meson would export
# PKG_CONFIG_SYSROOT_DIR, which corrupts our absolute-prefix .pc files (see
# crates/kandelo-cc/src/tools.rs).

[binaries]
# Meson's feature probes (bare `has_function`, `links`) are link tests. They
# are truthful because every executable link is strict: the SDK leaves
# undefined only the imports the host provides (libc/glue/
# kandelo-host-imports.txt), so a missing function is a link error.
c = 'wasm64posix-cc'
cpp = 'wasm64posix-c++'
ar = 'wasm64posix-ar'
ranlib = 'wasm64posix-ranlib'
strip = 'wasm64posix-strip'
nm = 'wasm64posix-nm'
pkg-config = 'wasm64posix-pkg-config'

[host_machine]
# Same GNU-build-system identity as wasm64posix-configure
# (wasm64-unknown-linux-musl) and the CMake toolchains (CMAKE_SYSTEM_NAME
# Linux): it selects musl/POSIX build logic. It does not define __linux__ in
# compiled code and does not promise Linux kernel behavior.
#
# Meson has no cross-file pointer-width property. cc.sizeof() and
# cc.alignment() are compile-only probes through wasm64posix-cc, so they
# report the LP64 sizes (long, size_t, and pointers are 8 bytes) without
# running anything.
system = 'linux'
cpu_family = 'wasm64'
cpu = 'wasm64'
endian = 'little'

[properties]
# Target executables cannot run on the build machine; Meson must not try.
needs_exe_wrapper = true

[built-in options]
# Kandelo programs link libraries statically.
default_library = 'static'
# There are no shared libraries to fall back on, so every dependency lookup
# is static: pkg-config runs with --static and pulls each package's
# Requires.private/Libs.private (cairo -> pixman, fontconfig -> libxml2).
prefer_static = true
# Dependencies come from the Kandelo package resolver. A dependency() that
# misses must fail the configure, not silently download and build an
# upstream subproject in its place.
wrap_mode = 'nofallback'
# The link contract uses --allow-undefined (undefined symbols become imports);
# Meson's default -Wl,--no-undefined would contradict it.
b_lundef = false
b_asneeded = false
b_pie = false
