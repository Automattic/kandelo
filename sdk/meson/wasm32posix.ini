# Meson cross file for Kandelo wasm32 targets.
#
#   meson setup --cross-file sdk/meson/wasm32posix.ini <builddir>
#
# The binaries are the SDK wrappers (on PATH inside scripts/dev-shell.sh or
# after `source sdk/activate.sh`). They already carry the target contract:
# wasm32posix-cc/-c++ inject --target, the wasm feature flags, --sysroot, and
# (when linking an executable) crt1 + libc + the syscall glue + the link
# contract; wasm32posix-pkg-config resolves the sysroot and dep-cache .pc
# files. So this file only declares the machine and Meson-level policy.
#
# `sys_root` is deliberately NOT set: Meson would export
# PKG_CONFIG_SYSROOT_DIR, which corrupts our absolute-prefix .pc files (see
# sdk/src/bin/pkg-config.ts).

[binaries]
# WASM_POSIX_LINK_UNDEFINED=error: Meson's feature probes (bare
# `has_function`, `links`) are link tests. Under the default link contract an
# undefined function silently becomes an `env` import, so probes would report
# every missing libc function as present. Strict mode keeps the contract's
# intentional imports and rejects everything else (see
# applyUndefinedSymbolPolicy in sdk/src/lib/flags.ts). It applies to the whole
# Meson build, so real executables are strict too: a missing function is a
# link error instead of an instantiation failure at runtime.
c = ['env', 'WASM_POSIX_LINK_UNDEFINED=error', 'wasm32posix-cc']
cpp = ['env', 'WASM_POSIX_LINK_UNDEFINED=error', 'wasm32posix-c++']
ar = 'wasm32posix-ar'
ranlib = 'wasm32posix-ranlib'
strip = 'wasm32posix-strip'
nm = 'wasm32posix-nm'
pkg-config = 'wasm32posix-pkg-config'

[host_machine]
# Same GNU-build-system identity as sdk/config.site (wasm32-unknown-linux-musl)
# and the CMake toolchains (CMAKE_SYSTEM_NAME Linux): it selects musl/POSIX
# build logic. It does not define __linux__ in compiled code and does not
# promise Linux kernel behavior.
system = 'linux'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
# Target executables cannot run on the build machine; Meson must not try.
needs_exe_wrapper = true

[built-in options]
# Kandelo programs link libraries statically.
default_library = 'static'
# There are no shared libraries to fall back on, so every dependency lookup
# is static: pkg-config runs with --static and pulls each package's
# Requires.private/Libs.private (cairo -> pixman, fontconfig -> libxml2).
prefer_static = true
# Dependencies come from the Kandelo package resolver. A dependency() that
# misses must fail the configure, not silently download and build an
# upstream subproject in its place.
wrap_mode = 'nofallback'
# The link contract uses --allow-undefined (undefined symbols become imports);
# Meson's default -Wl,--no-undefined would contradict it.
b_lundef = false
b_asneeded = false
b_pie = false
